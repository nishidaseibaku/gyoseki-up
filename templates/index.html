<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業績アップ取り組みダッシュボード</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 500;
        }
        .kpi-card .card-body {
            font-size: 2.2rem;
            font-weight: 700;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .th-sortable {
            cursor: pointer;
            user-select: none;
        }
        .th-sortable:hover {
            background-color: #f8f9fa;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
        .nav-link.active {
            font-weight: 700;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
    </style>
</head>
<body>
    {% raw %}
    <div id="app">
        <!-- Offcanvas Navigation -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavLabel">メニュー</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <router-link to="/" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-graph-up-arrow me-2"></i>ダッシュボード</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/form" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-plus-circle me-2"></i>新規登録</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/list" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-list-task me-2"></i>実績一覧</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/settings" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-gear me-2"></i>設定</router-link>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Header -->
        <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
            <div class="container-fluid">
                <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav" aria-controls="offcanvasNav">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand mx-auto" href="#">
                    業績アップ取り組みダッシュボード
                </a>
                <div style="width: 40px;"></div> <!-- Spacer -->
            </div>
        </nav>

        <!-- Main Content -->
          <main class="container-fluid p-4">
              <router-view v-slot="{ Component }">
                  <transition name="fade" mode="out-in">
                      <component :is="Component" />
                  </transition>
              </router-view>
          </main>
          <div v-if="isLoading" class="loading-overlay">
              <div class="text-center">
                  <div class="spinner-border text-primary" role="status"></div>
              </div>
          </div>
      </div>

    <!-- Vue.js, Vue Router, Chart.js, Bootstrap JS from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Component Templates -->
    <script type="text/x-template" id="dashboard-template">
        <div>
            <!-- Date Filters -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label for="dashStart" class="form-label">開始日</label>
                    <input type="date" id="dashStart" class="form-control" v-model="root.filterStart">
                </div>
                <div class="col-md-3">
                    <label for="dashEnd" class="form-label">終了日</label>
                    <input type="date" id="dashEnd" class="form-control" v-model="root.filterEnd">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                    <button class="btn btn-secondary" @click="root.filterStart=''; root.filterEnd=''; root.fetchInitiatives()">リセット</button>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card text-center">
                        <div class="card-header bg-success text-white">合計貢献金額</div>
                        <div class="card-body kpi-card">
                            ¥{{ formatCurrency(totalAmount) }}
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card text-center">
                        <div class="card-header bg-info text-white">総件数</div>
                        <div class="card-body kpi-card">
                            {{ $root.initiatives.length }} 件
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Charts -->
            <div class="row">
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">分類別 金額</div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas ref="categoryChart"></canvas>
                            </div>
                            <ul class="mt-3 mb-0 list-unstyled">
                                <li v-for="(amt, cat) in categorySummary" :key="cat">{{ cat }}: ¥{{ formatCurrency(amt) }}</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">部門別 金額</div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas ref="departmentChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-form-template">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <router-link to="/list" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="bi bi-arrow-left"></i>
                </router-link>
                <span>{{ isEdit ? '取り組みを編集' : '新規取り組みを登録' }}</span>
            </div>
            <div class="card-body">
                <form @submit.prevent="submit">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="department" class="form-label">部門・チーム</label>
                            <input class="form-control" list="departmentOptions" id="department" v-model="newInitiative.department" required>
                            <datalist id="departmentOptions">
                                <option v-for="d in root.departments.value" :key="d.id" :value="d.name"></option>
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">氏名</label>
                            <input class="form-control" list="nameOptions" id="name" v-model="newInitiative.name" required>
                            <datalist id="nameOptions">
                                <option v-for="n in root.names.value" :key="n.id" :value="n.name"></option>
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label for="title" class="form-label">タイトル</label>
                            <input type="text" class="form-control" id="title" v-model="newInitiative.title" required>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label">実施日</label>
                            <input type="date" class="form-control" id="date" v-model="newInitiative.date" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">分類</label>
                            <input class="form-control" list="categoryOptions" id="category" v-model="newInitiative.category" required>
                            <datalist id="categoryOptions">
                                <option v-for="c in root.categories.value" :key="c.id" :value="c.name"></option>
                            </datalist>
                        </div>
                        <div class="col-12">
                            <label for="content" class="form-label">具体的な内容</label>
                            <textarea class="form-control" id="content" rows="3" v-model="newInitiative.content" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="amount" class="form-label">金額 (円)</label>
                            <input type="text" class="form-control" id="amount" v-model="amountInput" @input="handleAmountInput" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4" :disabled="root.isLoading.value">{{ isEdit ? '更新する' : '登録する' }}</button>
                    <button type="button" class="btn btn-danger mt-4 ms-2" v-if="isEdit" @click="remove" :disabled="root.isLoading.value">削除</button>
                </form>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-list-template">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                取り組み実績一覧
                <router-link to="/form" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>新規登録
                </router-link>
            </div>
            <div class="card-body">
                <!-- Filters -->
                <div class="row g-3 mb-4">
                    <div class="col-md-2">
                        <label for="listStart" class="form-label">開始日</label>
                        <input type="date" id="listStart" class="form-control" v-model="root.filterStart">
                    </div>
                    <div class="col-md-2">
                        <label for="listEnd" class="form-label">終了日</label>
                        <input type="date" id="listEnd" class="form-control" v-model="root.filterEnd">
                    </div>
                    <div class="col-md-2">
                        <label for="filterName" class="form-label">氏名</label>
                        <input type="text" id="filterName" class="form-control" v-model="filters.name" placeholder="氏名で検索...">
                    </div>
                    <div class="col-md-2">
                        <label for="filterDepartment" class="form-label">部門</label>
                        <input type="text" id="filterDepartment" class="form-control" v-model="filters.department" placeholder="部門で検索...">
                    </div>
                    <div class="col-md-2">
                        <label for="filterCategory" class="form-label">分類</label>
                        <select id="filterCategory" class="form-select" v-model="filters.category">
                            <option value="">すべて</option>
                            <option>粗利率改善</option>
                            <option>固定費コントロール</option>
                            <option>粗利額アップ</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                        <button class="btn btn-secondary" @click="resetFilters">リセット</button>
                    </div>
                </div>

                <!-- Initiatives List -->
                 <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th @click="sortBy('date')" class="th-sortable">実施日 <i :class="sortIcon('date')"></i></th>
                                <th @click="sortBy('department')" class="th-sortable">部門 <i :class="sortIcon('department')"></i></th>
                                <th @click="sortBy('name')" class="th-sortable">氏名 <i :class="sortIcon('name')"></i></th>
                                <th @click="sortBy('title')" class="th-sortable">タイトル <i :class="sortIcon('title')"></i></th>
                                <th @click="sortBy('category')" class="th-sortable">分類 <i :class="sortIcon('category')"></i></th>
                                <th>内容</th>
                                <th @click="sortBy('amount')" class="th-sortable text-end">金額(円) <i :class="sortIcon('amount')"></i></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="item in sortedInitiatives" :key="item.id" @click="edit(item.id)" style="cursor:pointer">
                                <td>{{ item.date }}</td>
                                <td>{{ item.department }}</td>
                                <td>{{ item.name }}</td>
                                <td>{{ item.title }}</td>
                                <td><span class="badge" :class="getCategoryClass(item.category)">{{ item.category }}</span></td>
                                <td>{{ item.content }}</td>
                                <td class="text-end">{{ formatCurrency(item.amount) }}</td>
                            </tr>
                            <tr v-if="sortedInitiatives.length === 0">
                                <td colspan="7" class="text-center">該当するデータがありません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="settings-template">
        <div>
            <h3 class="mb-3">設定</h3>
            <div class="accordion" id="settingsAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingDepartment">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDepartment" aria-expanded="false" aria-controls="collapseDepartment">
                        部門
                    </button>
                </h2>
                <div id="collapseDepartment" class="accordion-collapse collapse" aria-labelledby="headingDepartment" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="d in root.departments.value" :key="d.id">
                                <template v-if="editingDeptId === d.id">
                                    <input type="text" class="form-control me-2" v-model="editingDeptName">
                                    <button class="btn btn-sm btn-primary me-1" @click="saveDepartment(d.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelDepartmentEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ d.name || d }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startDepartmentEdit(d)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeDepartment(d.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addDepartment">
                            <input type="text" class="form-control me-2" v-model="newDepartment" placeholder="追加...">
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingName">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseName" aria-expanded="false" aria-controls="collapseName">
                        氏名
                    </button>
                </h2>
                <div id="collapseName" class="accordion-collapse collapse" aria-labelledby="headingName" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="n in root.names.value" :key="n.id">
                                <template v-if="editingNameId === n.id">
                                    <input type="text" class="form-control me-2" v-model="editingNameName">
                                    <button class="btn btn-sm btn-primary me-1" @click="saveName(n.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelNameEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ n.name || n }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startNameEdit(n)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeName(n.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addName">
                            <input type="text" class="form-control me-2" v-model="newName" placeholder="追加...">
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingCategory">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCategory" aria-expanded="false" aria-controls="collapseCategory">
                        分類
                    </button>
                </h2>
                <div id="collapseCategory" class="accordion-collapse collapse" aria-labelledby="headingCategory" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="c in root.categories.value" :key="c.id">
                                <template v-if="editingCategoryId === c.id">
                                    <input type="text" class="form-control me-2" v-model="editingCategoryName">
                                    <button class="btn btn-sm btn-primary me-1" @click="saveCategory(c.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelCategoryEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ c.name || c }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startCategoryEdit(c)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeCategory(c.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addCategory">
                            <input type="text" class="form-control me-2" v-model="newCategory" placeholder="追加...">
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </script>

    <script>
        const { createApp, ref, computed, onMounted, watch, provide, inject, onBeforeUnmount } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;

        // --- Components ---
        const Dashboard = {
            template: '#dashboard-template',
            setup() {
                const root = inject('root');
                const categoryChart = ref(null);
                const departmentChart = ref(null);
                let categoryChartInstance = null;
                let departmentChartInstance = null;

                const totalAmount = computed(() => root.initiatives.value.reduce((sum, item) => sum + item.amount, 0));

                const categorySummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.category]) summary[item.category] = 0;
                        summary[item.category] += item.amount;
                    });
                    return summary;
                });

                const departmentSummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.department]) summary[item.department] = 0;
                        summary[item.department] += item.amount;
                    });
                    return summary;
                });

                const renderCharts = () => {
                    if (categoryChart.value) {
                        const labels = Object.keys(categorySummary.value);
                        const data = Object.values(categorySummary.value);
                        if (!categoryChartInstance) {
                            categoryChartInstance = new Chart(categoryChart.value.getContext('2d'), {
                                type: 'doughnut',
                                data: {
                                    labels,
                                    datasets: [{
                                        data,
                                        backgroundColor: ['#ffc107', '#dc3545', '#28a745']
                                    }]
                                },
                                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
                            });
                        } else {
                            categoryChartInstance.data.labels = labels;
                            categoryChartInstance.data.datasets[0].data = data;
                            categoryChartInstance.update();
                        }
                    }

                    if (departmentChart.value) {
                        const labels = Object.keys(departmentSummary.value);
                        const data = Object.values(departmentSummary.value);
                        if (!departmentChartInstance) {
                            departmentChartInstance = new Chart(departmentChart.value.getContext('2d'), {
                                type: 'bar',
                                data: {
                                    labels,
                                    datasets: [{
                                        label: '部門別貢献金額',
                                        data,
                                        backgroundColor: ['#0d6efd', '#6f42c1', '#d63384', '#fd7e14', '#198754', '#0dcaf0']
                                    }]
                                },
                                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                            });
                        } else {
                            departmentChartInstance.data.labels = labels;
                            departmentChartInstance.data.datasets[0].data = data;
                            departmentChartInstance.update();
                        }
                    }
                };

                onMounted(renderCharts);
                watch(root.initiatives, renderCharts);
                onBeforeUnmount(() => {
                    if (categoryChartInstance) categoryChartInstance.destroy();
                    if (departmentChartInstance) departmentChartInstance.destroy();
                });

                return { root, totalAmount, formatCurrency: root.formatCurrency, categoryChart, departmentChart, categorySummary };
            }
        };

const InitiativeForm = {
            template: '#initiative-form-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const route = VueRouter.useRoute();

                const newInitiative = ref({
                    department: '',
                    name: '',
                    title: '',
                    date: new Date().toISOString().slice(0, 10),
                    category: '粗利額アップ',
                    content: '',
                    amount: null,
                });

                const amountInput = ref('');

                watch(
                    () => newInitiative.value.amount,
                    (val) => {
                        amountInput.value = val != null ? root.formatCurrency(val) : '';
                    },
                    { immediate: true }
                );

                const handleAmountInput = () => {
                    const numeric = amountInput.value.replace(/,/g, '');
                    const val = parseInt(numeric, 10);
                    newInitiative.value.amount = isNaN(val) ? null : val;
                    if (numeric) {
                        amountInput.value = root.formatCurrency(newInitiative.value.amount);
                    } else {
                        amountInput.value = '';
                    }
                };

                const isEdit = computed(() => !!route.params.id);

                onMounted(() => {
                    if (isEdit.value) {
                        const existing = root.initiatives.value.find(i => i.id === parseInt(route.params.id));
                        if (existing) {
                            newInitiative.value = { ...existing };
                        }
                    }
                });

                const submit = async () => {
                    handleAmountInput();
                    if (isEdit.value) {
                        await root.updateInitiative(parseInt(route.params.id), newInitiative.value);
                    } else {
                        await root.submitInitiative(newInitiative.value);
                    }
                    await router.push('/list');
                };

                const remove = async () => {
                    if (!isEdit.value) return;
                    if (!confirm('本当に削除しますか？')) return;
                    await root.deleteInitiative(parseInt(route.params.id));
                    await router.push('/list');
                };

                return { newInitiative, submit, isEdit, remove, root, amountInput, handleAmountInput };
            }
        };

const InitiativeList = {
            template: '#initiative-list-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const filters = ref({ name: '', department: '', category: '' });
                const sortByColumn = ref('date');
                const sortDirection = ref('desc');

                const filteredInitiatives = computed(() => {
                    return root.initiatives.value.filter(item => {
                        const nameMatch = item.name.toLowerCase().includes(filters.value.name.toLowerCase());
                        const depMatch = item.department.toLowerCase().includes(filters.value.department.toLowerCase());
                        const catMatch = filters.value.category ? item.category === filters.value.category : true;
                        return nameMatch && depMatch && catMatch;
                    });
                });

                const sortedInitiatives = computed(() => {
                    return [...filteredInitiatives.value].sort((a, b) => {
                        let aVal = a[sortByColumn.value];
                        let bVal = b[sortByColumn.value];

                        if (sortByColumn.value === 'date') {
                            return sortDirection.value === 'asc' ? new Date(aVal) - new Date(bVal) : new Date(bVal) - new Date(aVal);
                        }
                        
                        if (typeof aVal === 'string') {
                            return sortDirection.value === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                        }
                        
                        return sortDirection.value === 'asc' ? aVal - bVal : bVal - aVal;
                    });
                });

                const sortBy = (column) => {
                    if (sortByColumn.value === column) {
                        sortDirection.value = sortDirection.value === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortByColumn.value = column;
                        sortDirection.value = 'desc';
                    }
                };

                const sortIcon = (column) => {
                    if (sortByColumn.value !== column) return 'bi bi-arrow-down-up';
                    return sortDirection.value === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
                };
                
                const resetFilters = () => {
                    filters.value = { name: '', department: '', category: '' };
                    root.filterStart.value = '';
                    root.filterEnd.value = '';
                    root.fetchInitiatives();
                };

                const edit = (id) => {
                    router.push(`/form/${id}`);
                };

                return {
                    root,
                    filters,
                    sortBy,
                    sortIcon,
                    sortedInitiatives,
                    resetFilters,
                    edit,
                    getCategoryClass: root.getCategoryClass,
                    formatCurrency: root.formatCurrency
                };
            }
        };

        const Settings = {
            template: '#settings-template',
            setup() {
                const root = inject('root');
                  const newDepartment = ref('');
                  const newName = ref('');
                  const newCategory = ref('');

                  const editingDeptId = ref(null);
                  const editingDeptName = ref('');
                  const editingNameId = ref(null);
                  const editingNameName = ref('');
                  const editingCategoryId = ref(null);
                  const editingCategoryName = ref('');

                  const addDepartment = async () => {
                      if (!newDepartment.value) return;
                      await root.addDepartment(newDepartment.value);
                      newDepartment.value = '';
                  };

                  const startDepartmentEdit = (d) => {
                      editingDeptId.value = d.id;
                      editingDeptName.value = d.name || d;
                  };
                  const cancelDepartmentEdit = () => {
                      editingDeptId.value = null;
                      editingDeptName.value = '';
                  };
                  const saveDepartment = async (id) => {
                      if (!editingDeptName.value) return;
                      await root.updateDepartment(id, editingDeptName.value);
                      cancelDepartmentEdit();
                  };
                  const removeDepartment = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteDepartment(id);
                  };

                  const addName = async () => {
                      if (!newName.value) return;
                      await root.addName(newName.value);
                      newName.value = '';
                  };
                  const startNameEdit = (n) => {
                      editingNameId.value = n.id;
                      editingNameName.value = n.name || n;
                  };
                  const cancelNameEdit = () => {
                      editingNameId.value = null;
                      editingNameName.value = '';
                  };
                  const saveName = async (id) => {
                      if (!editingNameName.value) return;
                      await root.updateName(id, editingNameName.value);
                      cancelNameEdit();
                  };
                  const removeName = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteName(id);
                  };

                  const addCategory = async () => {
                      if (!newCategory.value) return;
                      await root.addCategory(newCategory.value);
                      newCategory.value = '';
                  };
                  const startCategoryEdit = (c) => {
                      editingCategoryId.value = c.id;
                      editingCategoryName.value = c.name || c;
                  };
                  const cancelCategoryEdit = () => {
                      editingCategoryId.value = null;
                      editingCategoryName.value = '';
                  };
                  const saveCategory = async (id) => {
                      if (!editingCategoryName.value) return;
                      await root.updateCategory(id, editingCategoryName.value);
                      cancelCategoryEdit();
                  };
                  const removeCategory = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteCategory(id);
                  };

                  return {
                      root,
                      newDepartment,
                      newName,
                      newCategory,
                      editingDeptId,
                      editingDeptName,
                      editingNameId,
                      editingNameName,
                      editingCategoryId,
                      editingCategoryName,
                      addDepartment,
                      startDepartmentEdit,
                      cancelDepartmentEdit,
                      saveDepartment,
                      removeDepartment,
                      addName,
                      startNameEdit,
                      cancelNameEdit,
                      saveName,
                      removeName,
                      addCategory,
                      startCategoryEdit,
                      cancelCategoryEdit,
                      saveCategory,
                      removeCategory
                  };
            }
        };

        // --- Router ---
        const routes = [
            { path: '/', component: Dashboard },
            { path: '/form/:id?', component: InitiativeForm },
            { path: '/list', component: InitiativeList },
            { path: '/settings', component: Settings },
        ];
        const router = createRouter({
            history: createWebHashHistory(),
            routes,
            linkActiveClass: 'active'
        });

        // --- Main App ---
        const app = createApp({
            setup() {
                const initiatives = ref([]);
                const departments = ref([]);
                const names = ref([]);
                const categories = ref([]);
                const filterStart = ref('');
                const filterEnd = ref('');

                const loadingCount = ref(0);
                const isLoading = computed(() => loadingCount.value > 0);
                const withLoading = async (fn) => {
                    loadingCount.value++;
                    try {
                        await fn();
                    } finally {
                        loadingCount.value--;
                    }
                };

                const fetchInitiatives = async () => {
                    await withLoading(async () => {
                        try {
                            let url = '/api/initiatives';
                            const params = [];
                            if (filterStart.value) params.push(`start=${filterStart.value}`);
                            if (filterEnd.value) params.push(`end=${filterEnd.value}`);
                            if (params.length) url += `?${params.join('&')}`;
                            const response = await fetch(url);
                            initiatives.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching initiatives:', error);
                        }
                    });
                };

                const fetchDepartments = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/departments');
                            departments.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching departments:', error);
                        }
                    });
                };

                const fetchNames = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/names');
                            names.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching names:', error);
                        }
                    });
                };

                const fetchCategories = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/categories');
                            categories.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching categories:', error);
                        }
                    });
                };

                const submitInitiative = async (newInitiative) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/initiatives', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(newInitiative),
                            });
                            if (response.ok) {
                                await fetchInitiatives();
                            }
                        } catch (error) {
                            console.error('Error submitting initiative:', error);
                        }
                    });
                };

                const updateInitiative = async (id, updated) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/initiatives/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updated),
                            });
                            if (response.ok) {
                                await fetchInitiatives();
                            }
                        } catch (error) {
                            console.error('Error updating initiative:', error);
                        }
                    });
                };

                const deleteInitiative = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/initiatives/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchInitiatives();
                            }
                        } catch (error) {
                            console.error('Error deleting initiative:', error);
                        }
                    });
                };

                const addDepartment = async (name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/departments', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchDepartments();
                            }
                        } catch (error) {
                            console.error('Error adding department:', error);
                        }
                    });
                };

                const addName = async (name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/names', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchNames();
                            }
                        } catch (error) {
                            console.error('Error adding name:', error);
                        }
                    });
                };

                const addCategory = async (name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/categories', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchCategories();
                            }
                        } catch (error) {
                            console.error('Error adding category:', error);
                        }
                    });
                };

                const updateDepartment = async (id, name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/departments/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchDepartments();
                            }
                        } catch (error) {
                            console.error('Error updating department:', error);
                        }
                    });
                };

                const deleteDepartment = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/departments/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchDepartments();
                            }
                        } catch (error) {
                            console.error('Error deleting department:', error);
                        }
                    });
                };

                const updateName = async (id, name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/names/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchNames();
                            }
                        } catch (error) {
                            console.error('Error updating name:', error);
                        }
                    });
                };

                const deleteName = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/names/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchNames();
                            }
                        } catch (error) {
                            console.error('Error deleting name:', error);
                        }
                    });
                };

                const updateCategory = async (id, name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/categories/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchCategories();
                            }
                        } catch (error) {
                            console.error('Error updating category:', error);
                        }
                    });
                };

                const deleteCategory = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchCategories();
                            }
                        } catch (error) {
                            console.error('Error deleting category:', error);
                        }
                    });
                };

                const formatCurrency = (value) => new Intl.NumberFormat('ja-JP').format(value);

                const getCategoryClass = (category) => {
                    switch (category) {
                        case '粗利率改善': return 'bg-warning text-dark';
                        case '固定費コントロール': return 'bg-danger';
                        case '粗利額アップ': return 'bg-success';
                        default: return 'bg-secondary';
                    }
                };

                const hideOffcanvas = () => {
                    const el = document.getElementById('offcanvasNav');
                    const instance = bootstrap.Offcanvas.getInstance(el);
                    if (instance) instance.hide();
                };

                onMounted(() => {
                    fetchInitiatives();
                    fetchDepartments();
                    fetchNames();
                    fetchCategories();
                });

                // Provide shared state and methods to all components
                  provide('root', {
                      initiatives,
                      departments,
                      names,
                      categories,
                      filterStart,
                      filterEnd,
                      fetchInitiatives,
                      submitInitiative,
                      updateInitiative,
                      deleteInitiative,
                      fetchDepartments,
                      fetchNames,
                      fetchCategories,
                      addDepartment,
                      addName,
                      addCategory,
                      updateDepartment,
                      deleteDepartment,
                      updateName,
                      deleteName,
                      updateCategory,
                      deleteCategory,
                      formatCurrency,
                      getCategoryClass,
                      isLoading
                  });

                  return { initiatives, hideOffcanvas, isLoading, filterStart, filterEnd, fetchInitiatives };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
    {% endraw %}
</body>
</html>
