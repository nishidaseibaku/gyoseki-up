<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業績アップ取り組みダッシュボード</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Tom Select CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 500;
        }
        .kpi-card .card-body {
            font-size: 2.2rem;
            font-weight: 700;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .th-sortable {
            cursor: pointer;
            user-select: none;
        }
        .th-sortable:hover {
            background-color: #f8f9fa;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
        .nav-link.active {
            font-weight: 700;
            background-color: #e9ecef;
            border-radius: 0.25rem;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
    </style>
</head>
<body>
    {% raw %}
    <div id="app">
        <!-- Offcanvas Navigation -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavLabel">メニュー</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <router-link to="/" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-graph-up-arrow me-2"></i>ダッシュボード</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/form" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-plus-circle me-2"></i>新規登録</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/list" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-list-task me-2"></i>実績一覧</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/about" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-info-circle me-2"></i>業績アップ活動とは</router-link>
                    </li>
                    <li class="nav-item">
                        <router-link to="/settings" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-gear me-2"></i>設定</router-link>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Header -->
        <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
            <div class="container-fluid">
                <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav" aria-controls="offcanvasNav">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand mx-auto" href="#">
                    業績アップ取り組みダッシュボード
                </a>
                <div style="width: 40px;"></div> <!-- Spacer -->
            </div>
        </nav>

        <!-- Main Content -->
          <main class="container-fluid p-4">
              <router-view v-slot="{ Component }">
                  <transition name="fade" mode="out-in">
                      <component :is="Component" />
                  </transition>
              </router-view>
          </main>
          <div v-if="isLoading" class="loading-overlay">
              <div class="text-center">
                  <div class="spinner-border text-primary" role="status"></div>
              </div>
          </div>
      </div>

    <!-- Vue.js, Vue Router, Chart.js, Bootstrap JS from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

    <!-- Component Templates -->
    <script type="text/x-template" id="dashboard-template">
        <div>
            <!-- Date Filters -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label for="dashStart" class="form-label">開始日</label>
                    <clearable-input type="date" id="dashStart" class="form-control" v-model="root.filterStart.value"></clearable-input>
                </div>
                <div class="col-md-3">
                    <label for="dashEnd" class="form-label">終了日</label>
                    <clearable-input type="date" id="dashEnd" class="form-control" v-model="root.filterEnd.value"></clearable-input>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                    <button class="btn btn-secondary" @click="root.filterStart.value=''; root.filterEnd.value=''; root.fetchInitiatives()">リセット</button>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card text-center">
                        <div class="card-header bg-success text-white">合計貢献金額</div>
                        <div class="card-body kpi-card">
                            ¥{{ formatCurrency(totalAmount) }}
                            <div v-if="root.goalAmount.value > 0" class="mt-3 w-100">
                                <div class="progress">
                                    <div class="progress-bar" role="progressbar" :style="{ width: Math.min(progressPercent, 100) + '%' }" :aria-valuenow="progressPercent" aria-valuemin="0" aria-valuemax="100">
                                        {{ Math.min(progressPercent, 100).toFixed(1) }}%
                                    </div>
                                </div>
                                <small class="text-muted">目標: ¥{{ formatCurrency(root.goalAmount.value) }}</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card text-center">
                        <div class="card-header bg-info text-white">総件数</div>
                        <div class="card-body kpi-card">
                            {{ $root.initiatives.length }} 件
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Charts -->
            <div class="row">
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">分類別 金額</div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas ref="categoryChart"></canvas>
                            </div>
                            <ul class="mt-3 mb-0 list-unstyled">
                                <li v-for="(amt, cat) in categorySummary" :key="cat" class="mb-2">
                                    <div class="d-flex justify-content-between">
                                        <span>{{ cat }}: ¥{{ formatCurrency(amt) }}</span>
                                        <span v-if="root.categoryGoals.value[cat] > 0">{{ (amt / root.categoryGoals.value[cat] * 100).toFixed(1) }}%</span>
                                    </div>
                                    <div v-if="root.categoryGoals.value[cat] > 0" class="progress">
                                        <div class="progress-bar" :style="{ width: Math.min(amt / root.categoryGoals.value[cat] * 100, 100) + '%' }"></div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">部門別 金額</div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas ref="departmentChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-form-template">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <router-link to="/list" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="bi bi-arrow-left"></i>
                </router-link>
                <span>{{ isEdit ? '取り組みを編集' : '新規取り組みを登録' }}</span>
            </div>
            <div class="card-body">
                <form @submit.prevent="submit">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="department" class="form-label">部門・チーム</label>
                            <tom-select id="department" class="form-select" :options="root.departments.value.map(d => d.name)" v-model="newInitiative.department" required></tom-select>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">氏名</label>
                            <tom-select id="name" class="form-select" :options="root.names.value.map(n => n.name)" v-model="newInitiative.name" required></tom-select>
                        </div>
                        <div class="col-md-6">
                            <label for="title" class="form-label">タイトル</label>
                            <clearable-input type="text" class="form-control" id="title" v-model="newInitiative.title" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label">実施日</label>
                            <clearable-input type="date" class="form-control" id="date" v-model="newInitiative.date" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">分類</label>
                            <select id="category" class="form-select" v-model="newInitiative.category" required>
                                <option v-for="c in root.categories.value" :key="c.id" :value="c.name">{{ c.name }}</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="content" class="form-label">具体的な内容</label>
                            <textarea class="form-control" id="content" rows="3" v-model="newInitiative.content" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="amount" class="form-label">金額 (円)</label>
                            <clearable-input type="text" class="form-control" id="amount" v-model="amountInput" @input="handleAmountInput" required></clearable-input>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4" :disabled="root.isLoading.value">{{ isEdit ? '更新する' : '登録する' }}</button>
                    <button type="button" class="btn btn-danger mt-4 ms-2" v-if="isEdit" @click="remove" :disabled="root.isLoading.value">削除</button>
                </form>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-list-template">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                取り組み実績一覧
                <div class="d-flex">
                    <button class="btn btn-outline-secondary me-2" @click="exportCsv">
                        <i class="bi bi-download me-1"></i>CSVエクスポート
                    </button>
                    <router-link to="/form" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>新規登録
                    </router-link>
                </div>
            </div>
            <div class="card-body">
                <!-- Filters -->
                <div class="row g-3 mb-4">
                    <div class="col-md-2">
                        <label for="listStart" class="form-label">開始日</label>
                        <clearable-input type="date" id="listStart" class="form-control" v-model="root.filterStart.value"></clearable-input>
                    </div>
                    <div class="col-md-2">
                        <label for="listEnd" class="form-label">終了日</label>
                        <clearable-input type="date" id="listEnd" class="form-control" v-model="root.filterEnd.value"></clearable-input>
                    </div>
                    <div class="col-md-2">
                        <label for="filterName" class="form-label">氏名</label>
                        <tom-select id="filterName" class="form-select" :options="root.names.value.map(n => n.name)" v-model="filters.name" placeholder="氏名で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterDepartment" class="form-label">部門</label>
                        <tom-select id="filterDepartment" class="form-select" :options="root.departments.value.map(d => d.name)" v-model="filters.department" placeholder="部門で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterCategory" class="form-label">分類</label>
                        <select id="filterCategory" class="form-select" v-model="filters.category">
                            <option value="">すべて</option>
                            <option>粗利率改善</option>
                            <option>固定費コントロール</option>
                            <option>粗利額アップ</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                        <button class="btn btn-secondary" @click="resetFilters">リセット</button>
                    </div>
                </div>

                <!-- Initiatives List -->
                 <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th @click="sortBy('date')" class="th-sortable">実施日 <i :class="sortIcon('date')"></i></th>
                                <th @click="sortBy('department')" class="th-sortable">部門 <i :class="sortIcon('department')"></i></th>
                                <th @click="sortBy('name')" class="th-sortable">氏名 <i :class="sortIcon('name')"></i></th>
                                <th @click="sortBy('title')" class="th-sortable">タイトル <i :class="sortIcon('title')"></i></th>
                                <th @click="sortBy('category')" class="th-sortable">分類 <i :class="sortIcon('category')"></i></th>
                                <th>内容</th>
                                <th @click="sortBy('amount')" class="th-sortable text-end">金額(円) <i :class="sortIcon('amount')"></i></th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="item in sortedInitiatives" :key="item.id" @click="edit(item.id)" style="cursor:pointer">
                                <td>{{ item.date }}</td>
                                <td>{{ item.department }}</td>
                                <td>{{ item.name }}</td>
                                <td>{{ item.title }}</td>
                                <td><span class="badge" :class="getCategoryClass(item.category)">{{ item.category }}</span></td>
                                <td>{{ item.content }}</td>
                                <td class="text-end">{{ formatCurrency(item.amount) }}</td>
                                <td class="text-nowrap">
                                    <button class="btn btn-sm btn-outline-secondary" @click.stop="copy(item.id)">複写</button>
                                </td>
                            </tr>
                            <tr v-if="sortedInitiatives.length === 0">
                                <td colspan="8" class="text-center">該当するデータがありません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="settings-template">
        <div>
            <h3 class="mb-3">設定</h3>
            <div class="mb-4">
                <label for="aboutText" class="form-label">業績アップ活動の説明</label>
                <textarea id="aboutText" class="form-control mb-2" rows="3" v-model="aboutInput"></textarea>
                <button class="btn btn-primary" @click="saveAbout" :disabled="root.isLoading.value">保存</button>
            </div>
            <div class="mb-4">
                <label class="form-label">デフォルト期間</label>
                <div class="row g-2">
                    <div class="col"><input type="date" class="form-control" v-model="defaultStartInput"></div>
                    <div class="col"><input type="date" class="form-control" v-model="defaultEndInput"></div>
                    <div class="col-auto"><button class="btn btn-primary" @click="saveDefaultPeriod" :disabled="root.isLoading.value">保存</button></div>
                </div>
            </div>
            <div class="mb-4">
                <h5 class="form-label">分類別目標金額 (円)</h5>
                <div v-for="c in root.categories.value" :key="c.id" class="input-group mb-2">
                    <span class="input-group-text">{{ c.name }}</span>
                    <input type="number" class="form-control" v-model.number="categoryGoalsInput[c.name]">
                </div>
                <button class="btn btn-primary" @click="saveCategoryGoals" :disabled="root.isLoading.value">保存</button>
            </div>
            <div class="mb-4">
                <label for="goalAmount" class="form-label">目標金額 (円)</label>
                <div class="input-group">
                    <clearable-input type="number" id="goalAmount" class="form-control" v-model="goalInput"></clearable-input>
                    <button class="btn btn-primary" @click="saveGoal" :disabled="root.isLoading.value">保存</button>
                </div>
            </div>
            <div class="accordion" id="settingsAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingDepartment">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDepartment" aria-expanded="false" aria-controls="collapseDepartment">
                        部門
                    </button>
                </h2>
                <div id="collapseDepartment" class="accordion-collapse collapse" aria-labelledby="headingDepartment" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="d in root.departments.value" :key="d.id">
                                <template v-if="editingDeptId === d.id">
                                    <clearable-input type="text" class="form-control me-2" v-model="editingDeptName"></clearable-input>
                                    <button class="btn btn-sm btn-primary me-1" @click="saveDepartment(d.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelDepartmentEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ d.name || d }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startDepartmentEdit(d)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeDepartment(d.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addDepartment">
                            <clearable-input type="text" class="form-control me-2" v-model="newDepartment" placeholder="追加..."></clearable-input>
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingName">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseName" aria-expanded="false" aria-controls="collapseName">
                        氏名
                    </button>
                </h2>
                <div id="collapseName" class="accordion-collapse collapse" aria-labelledby="headingName" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="n in root.names.value" :key="n.id">
                                <template v-if="editingNameId === n.id">
                                    <clearable-input type="text" class="form-control me-2" v-model="editingNameName"></clearable-input>
                                    <button class="btn btn-sm btn-primary me-1" @click="saveName(n.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelNameEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ n.name || n }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startNameEdit(n)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeName(n.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addName">
                            <clearable-input type="text" class="form-control me-2" v-model="newName" placeholder="追加..."></clearable-input>
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingCategory">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCategory" aria-expanded="false" aria-controls="collapseCategory">
                        分類
                    </button>
                </h2>
                <div id="collapseCategory" class="accordion-collapse collapse" aria-labelledby="headingCategory" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="c in root.categories.value" :key="c.id">
                                <template v-if="editingCategoryId === c.id">
                                    <clearable-input type="text" class="form-control me-2" v-model="editingCategoryName"></clearable-input>
                                    <button class="btn btn-sm btn-primary me-1" @click="saveCategory(c.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelCategoryEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ c.name || c }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startCategoryEdit(c)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeCategory(c.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addCategory">
                            <clearable-input type="text" class="form-control me-2" v-model="newCategory" placeholder="追加..."></clearable-input>
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="about-template">
        <div class="card">
            <div class="card-header">業績アップ活動とは</div>

                <p style="white-space: pre-wrap;">{{ root.aboutText.value }}</p>

    <script>
        Chart.register(ChartDataLabels);
        const { createApp, ref, computed, onMounted, watch, provide, inject, onBeforeUnmount } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;
        const colorPalette = ['#0d6efd', '#dc3545', '#28a745', '#ffc107', '#6f42c1', '#d63384', '#fd7e14', '#198754', '#0dcaf0'];

        // --- Components ---
        const Dashboard = {
            template: '#dashboard-template',
            setup() {
                const root = inject('root');
                const categoryChart = ref(null);
                const departmentChart = ref(null);
                let categoryChartInstance = null;
                let departmentChartInstance = null;

                const totalAmount = computed(() => root.initiatives.value.reduce((sum, item) => sum + item.amount, 0));

                const categorySummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.category]) summary[item.category] = 0;
                        summary[item.category] += item.amount;
                    });
                    return summary;
                });

                const departmentCategorySummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.department]) summary[item.department] = {};
                        if (!summary[item.department][item.category]) summary[item.department][item.category] = 0;
                        summary[item.department][item.category] += item.amount;
                    });
                    return summary;
                });

                const progressPercent = computed(() => {
                    if (root.goalAmount.value > 0) {
                        return (totalAmount.value / root.goalAmount.value) * 100;
                    }
                    return 0;
                });

                const renderCharts = () => {
                    if (categoryChart.value) {
                        const labels = Object.keys(categorySummary.value);
                        const data = Object.values(categorySummary.value);
                        const colors = labels.map((_, idx) => colorPalette[idx % colorPalette.length]);
                        if (!categoryChartInstance) {
                            categoryChartInstance = new Chart(categoryChart.value.getContext('2d'), {
                                type: 'doughnut',
                                data: {
                                    labels,
                                    datasets: [{
                                        data,
                                        backgroundColor: colors
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: {
                                        legend: { position: 'top' },
                                        datalabels: {
                                            formatter: (value, ctx) => {
                                                const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                                                return total ? (value / total * 100).toFixed(1) + '%' : '';
                                            }
                                        }
                                    }
                                }
                            });
                        } else {
                            categoryChartInstance.data.labels = labels;
                            categoryChartInstance.data.datasets[0].data = data;
                            categoryChartInstance.data.datasets[0].backgroundColor = colors;
                            categoryChartInstance.update();
                        }
                    }

                    if (departmentChart.value) {
                        const labels = Object.keys(departmentCategorySummary.value);
                        const categoriesList = root.categories.value.map(c => c.name);
                        const datasets = categoriesList.map((cat, idx) => ({
                            label: cat,
                            data: labels.map(dept => (departmentCategorySummary.value[dept][cat] || 0)),
                            backgroundColor: colorPalette[idx % colorPalette.length]
                        }));
                        if (!departmentChartInstance) {
                            departmentChartInstance = new Chart(departmentChart.value.getContext('2d'), {
                                type: 'bar',
                                data: { labels, datasets },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    scales: { x: { stacked: true }, y: { stacked: true } },
                                    plugins: {
                                        legend: { position: 'top' },
                                        datalabels: {
                                            formatter: (value, ctx) => {
                                                const idx = ctx.dataIndex;
                                                const total = ctx.chart.data.datasets.reduce((sum, d) => sum + d.data[idx], 0);
                                                return total ? (value / total * 100).toFixed(1) + '%' : '';
                                            }
                                        }
                                    }
                                }
                            });
                        } else {
                            departmentChartInstance.data.labels = labels;
                            departmentChartInstance.data.datasets = datasets;
                            departmentChartInstance.update();
                        }
                    }
                };

                onMounted(renderCharts);
                watch(root.initiatives, renderCharts);
                onBeforeUnmount(() => {
                    if (categoryChartInstance) categoryChartInstance.destroy();
                    if (departmentChartInstance) departmentChartInstance.destroy();
                });

                return { root, totalAmount, progressPercent, formatCurrency: root.formatCurrency, categoryChart, departmentChart, categorySummary };
            }
        };

const InitiativeForm = {
            template: '#initiative-form-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const route = VueRouter.useRoute();

                const newInitiative = ref({
                    department: '',
                    name: '',
                    title: '',
                    date: new Date().toISOString().slice(0, 10),
                    category: '粗利額アップ',
                    content: '',
                    amount: null,
                });

                const amountInput = ref('');

                watch(
                    () => newInitiative.value.amount,
                    (val) => {
                        amountInput.value = val != null ? root.formatCurrency(val) : '';
                    },
                    { immediate: true }
                );

                const handleAmountInput = () => {
                    const numeric = amountInput.value.replace(/,/g, '');
                    const val = parseInt(numeric, 10);
                    newInitiative.value.amount = isNaN(val) ? null : val;
                    if (numeric) {
                        amountInput.value = root.formatCurrency(newInitiative.value.amount);
                    } else {
                        amountInput.value = '';
                    }
                };

                const isEdit = computed(() => !!route.params.id);

                onMounted(() => {
                    if (route.query.copy) {
                        const existing = root.initiatives.value.find(i => i.id === parseInt(route.query.copy));
                        if (existing) {
                            const { id, ...rest } = existing;
                            newInitiative.value = { ...rest };
                        }
                    } else if (isEdit.value) {
                        const existing = root.initiatives.value.find(i => i.id === parseInt(route.params.id));
                        if (existing) {
                            newInitiative.value = { ...existing };
                        }
                    }
                });

                const submit = async () => {
                    handleAmountInput();
                    if (isEdit.value) {
                        await root.updateInitiative(parseInt(route.params.id), newInitiative.value);
                    } else {
                        await root.submitInitiative(newInitiative.value);
                    }
                    await router.push('/list');
                };

                const remove = async () => {
                    if (!isEdit.value) return;
                    if (!confirm('本当に削除しますか？')) return;
                    await root.deleteInitiative(parseInt(route.params.id));
                    await router.push('/list');
                };

                return { newInitiative, submit, isEdit, remove, root, amountInput, handleAmountInput };
            }
        };

const InitiativeList = {
            template: '#initiative-list-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const filters = ref({ name: '', department: '', category: '' });
                const sortByColumn = ref('date');
                const sortDirection = ref('desc');

                const filteredInitiatives = computed(() => {
                    return root.initiatives.value.filter(item => {
                        const nameMatch = item.name.toLowerCase().includes(filters.value.name.toLowerCase());
                        const depMatch = item.department.toLowerCase().includes(filters.value.department.toLowerCase());
                        const catMatch = filters.value.category ? item.category === filters.value.category : true;
                        return nameMatch && depMatch && catMatch;
                    });
                });

                const sortedInitiatives = computed(() => {
                    return [...filteredInitiatives.value].sort((a, b) => {
                        let aVal = a[sortByColumn.value];
                        let bVal = b[sortByColumn.value];

                        if (sortByColumn.value === 'date') {
                            return sortDirection.value === 'asc' ? new Date(aVal) - new Date(bVal) : new Date(bVal) - new Date(aVal);
                        }
                        
                        if (typeof aVal === 'string') {
                            return sortDirection.value === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                        }
                        
                        return sortDirection.value === 'asc' ? aVal - bVal : bVal - aVal;
                    });
                });

                const sortBy = (column) => {
                    if (sortByColumn.value === column) {
                        sortDirection.value = sortDirection.value === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortByColumn.value = column;
                        sortDirection.value = 'desc';
                    }
                };

                const sortIcon = (column) => {
                    if (sortByColumn.value !== column) return 'bi bi-arrow-down-up';
                    return sortDirection.value === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
                };
                
                const resetFilters = () => {
                    filters.value = { name: '', department: '', category: '' };
                    root.filterStart.value = '';
                    root.filterEnd.value = '';
                    root.fetchInitiatives();
                };

                const edit = (id) => {
                    router.push(`/form/${id}`);
                };

                const copy = (id) => {
                    router.push({ path: '/form', query: { copy: id } });
                };

                const exportCsv = () => {
                    const headers = ['実施日', '部門', '氏名', 'タイトル', '分類', '内容', '金額'];
                    const rows = sortedInitiatives.value.map(item => [
                        item.date,
                        item.department,
                        item.name,
                        item.title,
                        item.category,
                        item.content,
                        item.amount
                    ]);
                    const csvContent = [headers, ...rows]
                        .map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                        .join('\r\n');
                    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'initiatives.csv';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                };

                return {
                    root,
                    filters,
                    sortBy,
                    sortIcon,
                    sortedInitiatives,
                    resetFilters,
                    edit,
                    copy,
                    exportCsv,
                    getCategoryClass: root.getCategoryClass,
                    formatCurrency: root.formatCurrency
                };
            }
        };

        const Settings = {
            template: '#settings-template',
            setup() {
                const root = inject('root');
                  const newDepartment = ref('');
                  const newName = ref('');
                  const newCategory = ref('');
                  const goalInput = ref(root.goalAmount.value);
                  watch(root.goalAmount, v => (goalInput.value = v));
                  const aboutInput = ref(root.aboutText.value);
                  watch(root.aboutText, v => (aboutInput.value = v));
                  const defaultStartInput = ref(root.defaultStart.value);
                  watch(root.defaultStart, v => (defaultStartInput.value = v));
                  const defaultEndInput = ref(root.defaultEnd.value);
                  watch(root.defaultEnd, v => (defaultEndInput.value = v));
                  const categoryGoalsInput = ref({ ...root.categoryGoals.value });
                  watch(root.categoryGoals, v => (categoryGoalsInput.value = { ...v }));

                  const editingDeptId = ref(null);
                  const editingDeptName = ref('');
                  const editingNameId = ref(null);
                  const editingNameName = ref('');
                  const editingCategoryId = ref(null);
                  const editingCategoryName = ref('');

                  const addDepartment = async () => {

                  const startDepartmentEdit = (d) => {

                  };
                  const saveDepartment = async (id) => {

                  };
                  const removeDepartment = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteDepartment(id);
                  };

                  const addName = async () => {
                      if (!newName.value) return;
                      await root.addName(newName.value);
                      newName.value = '';
                  };
                  const startNameEdit = (n) => {
                      editingNameId.value = n.id;
                      editingNameName.value = n.name || n;
                  };
                  const cancelNameEdit = () => {
                      editingNameId.value = null;
                      editingNameName.value = '';
                  };
                  const saveName = async (id) => {
                      if (!editingNameName.value) return;
                      await root.updateName(id, editingNameName.value);
                      cancelNameEdit();
                  };
                  const removeName = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteName(id);
                  };

                  const addCategory = async () => {
                      if (!newCategory.value) return;
                      await root.addCategory(newCategory.value);
                      newCategory.value = '';
                  };
                  const startCategoryEdit = (c) => {
                      editingCategoryId.value = c.id;
                      editingCategoryName.value = c.name || c;
                  };
                  const cancelCategoryEdit = () => {
                      editingCategoryId.value = null;
                      editingCategoryName.value = '';
                  };
                  const saveCategory = async (id) => {
                      if (!editingCategoryName.value) return;
                      await root.updateCategory(id, editingCategoryName.value);
                      cancelCategoryEdit();
                  };
                  const removeCategory = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteCategory(id);
                  };

                  const saveGoal = async () => {
                      await root.updateGoal(goalInput.value || 0);
                  };
                  const saveAbout = async () => {
                      await root.updateAbout(aboutInput.value || '');
                  };
                  const saveDefaultPeriod = async () => {
                      await root.updateDefaultPeriod(defaultStartInput.value, defaultEndInput.value);
                  };
                  const saveCategoryGoals = async () => {
                      await root.updateCategoryGoals(categoryGoalsInput.value);
                  };

                  return {
                      root,
                      newDepartment,
                      newName,
                      newCategory,
                      goalInput,
                      aboutInput,
                      defaultStartInput,
                      defaultEndInput,
                      categoryGoalsInput,
                      editingDeptId,
                      editingDeptName,
                      editingNameId,
                      editingNameName,
                      editingCategoryId,
                      editingCategoryName,
                      addDepartment,
                      startDepartmentEdit,
                      cancelDepartmentEdit,
                      saveDepartment,
                      removeDepartment,
                      addName,
                      startNameEdit,
                      cancelNameEdit,
                      saveName,
                      removeName,
                      addCategory,
                      startCategoryEdit,
                      cancelCategoryEdit,
                      saveCategory,
                      removeCategory,
                      saveGoal,
                      saveAbout,
                      saveDefaultPeriod,
                      saveCategoryGoals
                  };
            }
        };

        const About = {
            template: '#about-template',
            setup() {
                const root = inject('root');
                return { root };
            }
        };

        // --- Router ---
        const routes = [
            { path: '/', component: Dashboard },
            { path: '/form/:id?', component: InitiativeForm },
            { path: '/list', component: InitiativeList },
            { path: '/about', component: About },
            { path: '/settings', component: Settings },
        ];
        const router = createRouter({
            history: createWebHashHistory(),
            routes,
            linkActiveClass: 'active'
        });

        // --- Main App ---
        const app = createApp({
            setup() {
                const initiatives = ref([]);
                const departments = ref([]);
                const names = ref([]);
                const categories = ref([]);
                const aboutText = ref('');
                const categoryGoals = ref({});
                const defaultStart = ref('');
                const defaultEnd = ref('');
                const goalAmount = ref(0);
                const filterStart = ref('');
                const filterEnd = ref('');

                const loadingCount = ref(0);
                const isLoading = computed(() => loadingCount.value > 0);
                const withLoading = async (fn) => {
                    loadingCount.value++;
                    try {
                        await fn();
                    } finally {
                        loadingCount.value--;
                    }
                };

                const fetchBootstrap = async () => {
                    await withLoading(async () => {
                        try {
                            let url = '/api/bootstrap';
                            const params = [];
                            if (filterStart.value) params.push(`start=${filterStart.value}`);
                            if (filterEnd.value) params.push(`end=${filterEnd.value}`);
                            if (params.length) url += `?${params.join('&')}`;
                            const response = await fetch(url);
                            const data = await response.json();
                            initiatives.value = data.initiatives;
                            departments.value = data.departments;
                            names.value = data.names;
                            categories.value = data.categories;
                            aboutText.value = data.about_text || '';
                            categoryGoals.value = data.category_goals || {};
                        } catch (error) {
                            console.error('Error fetching bootstrap data:', error);
                        }
                    });
                };

                const fetchInitiatives = async () => {
                    await withLoading(async () => {
                        try {
                            let url = '/api/initiatives';
                            const params = [];
                            if (filterStart.value) params.push(`start=${filterStart.value}`);
                            if (filterEnd.value) params.push(`end=${filterEnd.value}`);
                            if (params.length) url += `?${params.join('&')}`;
                            const response = await fetch(url);
                            initiatives.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching initiatives:', error);
                        }
                    });
                };

                const fetchDepartments = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/departments');
                            departments.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching departments:', error);
                        }
                    });
                };

                const fetchNames = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/names');
                            names.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching names:', error);
                        }
                    });
                };

                const fetchCategories = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/categories');
                            categories.value = await response.json();
                        } catch (error) {
                            console.error('Error fetching categories:', error);
                        }
                    });
                };

                const fetchDefaultPeriod = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/default-period');
                            const data = await response.json();
                            defaultStart.value = data.start || '';
                            defaultEnd.value = data.end || '';
                            filterStart.value = defaultStart.value;
                            filterEnd.value = defaultEnd.value;
                        } catch (error) {
                            console.error('Error fetching default period:', error);
                        }
                    });
                };

                const updateDefaultPeriod = async (start, end) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/default-period', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ start, end })
                            });
                            if (response.ok) {
                                defaultStart.value = start;
                                defaultEnd.value = end;
                                filterStart.value = start;
                                filterEnd.value = end;
                            }
                        } catch (error) {
                            console.error('Error updating default period:', error);
                        }
                    });
                };

                const updateAbout = async (text) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/about', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ text })
                            });
                            if (response.ok) {
                                const data = await response.json();
                                aboutText.value = data.text;
                            }
                        } catch (error) {
                            console.error('Error updating about text:', error);
                        }
                    });
                };

                const updateCategoryGoals = async (goals) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/category-goals', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(goals)
                            });
                            if (response.ok) {
                                categoryGoals.value = goals;
                            }
                        } catch (error) {
                            console.error('Error updating category goals:', error);
                        }
                    });
                };

                const fetchGoal = async () => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch('/api/goal');
                            const data = await response.json();
                            goalAmount.value = data.goal;

                            console.error('Error fetching goal:', error);

                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ goal })
                            });

                            const response = await fetch('/api/names', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },

                            const response = await fetch('/api/categories', {

                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });

                            }

                        }
                    });
                };

                            const response = await fetch(`/api/departments/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchDepartments();
                            }
                        } catch (error) {
                            console.error('Error updating department:', error);
                        }
                    });
                };

                const deleteDepartment = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/departments/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchDepartments();
                            }
                        } catch (error) {
                            console.error('Error deleting department:', error);
                        }
                    });
                };

                const updateName = async (id, name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/names/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchNames();
                            }
                        } catch (error) {
                            console.error('Error updating name:', error);
                        }
                    });
                };

                const deleteName = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/names/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchNames();
                            }
                        } catch (error) {
                            console.error('Error deleting name:', error);
                        }
                    });
                };

                const updateCategory = async (id, name) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/categories/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name }),
                            });
                            if (response.ok) {
                                await fetchCategories();
                            }
                        } catch (error) {
                            console.error('Error updating category:', error);
                        }
                    });
                };

                const deleteCategory = async (id) => {
                    await withLoading(async () => {
                        try {
                            const response = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                await fetchCategories();
                            }
                        } catch (error) {
                            console.error('Error deleting category:', error);
                        }
                    });
                };

                const formatCurrency = (value) => new Intl.NumberFormat('ja-JP').format(value);

                const getCategoryClass = (category) => {
                    switch (category) {
                        case '粗利率改善': return 'bg-warning text-dark';
                        case '固定費コントロール': return 'bg-danger';
                        case '粗利額アップ': return 'bg-success';
                        default: return 'bg-secondary';
                    }
                };

                const hideOffcanvas = () => {
                    const el = document.getElementById('offcanvasNav');
                    const instance = bootstrap.Offcanvas.getInstance(el);
                    if (instance) instance.hide();
                };

                onMounted(async () => {
                    await fetchDefaultPeriod();
                    await fetchBootstrap();
                    fetchGoal();
                });

                // Provide shared state and methods to all components
                  provide('root', {
                      initiatives,
                      departments,
                      names,
                      categories,
                      aboutText,
                      categoryGoals,
                      defaultStart,
                      defaultEnd,
                      filterStart,
                      filterEnd,
                      fetchInitiatives,
                      submitInitiative,
                      updateInitiative,
                      deleteInitiative,
                      fetchDepartments,
                      fetchNames,
                      fetchCategories,
                      addDepartment,
                      addName,
                      addCategory,
                      updateGoal,
                      updateDepartment,
                      deleteDepartment,
                      updateName,
                      deleteName,
                      updateCategory,
                      deleteCategory,
                      updateAbout,
                      updateDefaultPeriod,
                      updateCategoryGoals,
                      formatCurrency,
                      getCategoryClass,
                      isLoading,
                      goalAmount
                  });

                  return { initiatives, hideOffcanvas, isLoading, filterStart, filterEnd, fetchInitiatives };
            }
        });

        app.component('tom-select', {
            inheritAttrs: false,
            props: {
                modelValue: String,
                options: Array
            },
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const selectRef = ref(null);
                let ts;

                const updateOptions = (opts = []) => {
                    if (ts) {
                        ts.clearOptions();
                        ts.addOptions(opts.map(o => ({ value: o, text: o })));
                    }
                };

                onMounted(() => {
                    ts = new TomSelect(selectRef.value, {
                        create: true,
                        plugins: ['clear_button'],
                        onChange(value) {
                            emit('update:modelValue', value);
                        }
                    });
                    updateOptions(props.options);
                    if (props.modelValue) {
                        ts.setValue(props.modelValue);
                    }
                });

                watch(() => props.options, (opts) => {
                    updateOptions(opts);
                }, { deep: true });

                watch(() => props.modelValue, (val) => {
                    if (ts && ts.getValue() !== val) {
                        ts.setValue(val || '');
                    }
                });

                onBeforeUnmount(() => {
                    if (ts) ts.destroy();
                });

                return { selectRef, attrs };
            },
            template: `<select ref="selectRef" v-bind="attrs"></select>`
        });

        app.component('clearable-input', {
            inheritAttrs: false,
            props: ['modelValue'],
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const inputClass = computed(() => [attrs.class, 'pe-4'].filter(Boolean).join(' '));
                const clear = () => emit('update:modelValue', '');
                return { attrs, inputClass, clear };
            },
            template: `
                <div class="position-relative">
                    <input v-bind="attrs" :class="inputClass" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)">
                    <button v-if="modelValue" type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" aria-label="Clear" @click="clear"></button>
                </div>
            `
        });

        app.use(router);
        app.mount('#app');
    </script>
    {% endraw %}
</body>
</html>
