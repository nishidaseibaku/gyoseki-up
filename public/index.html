<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業績アップ取り組みダッシュボード</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6efd'/%3E%3Cpath d='M7 21 L13 14 L18 18 L25 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 8 H25 V13' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Tom Select CSS (Bootstrap 5 theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 500;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .th-sortable {
            cursor: pointer;
            user-select: none;
        }
        .th-sortable:hover {
            background-color: #f8f9fa;
        }
        .resizable-table {
            table-layout: fixed;
        }
        .resizable-table th,
        .resizable-table td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .resizable-table th {
            position: relative;
        }
        .col-resizer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
        }
        .col-resizer:hover,
        .col-resizer.resizing {
            background-color: rgba(13, 110, 253, .35);
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
        .nav-link.active {
            font-weight: 700;
            background-color: #e9ecef;
            border-radius: 0.25rem;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="app">
        <template v-if="user">
            <!-- Offcanvas Navigation -->
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavLabel">メニュー</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <router-link to="/" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-list-task me-2"></i>実績一覧</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/form" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-plus-circle me-2"></i>新規登録</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/settings" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-gear me-2"></i>設定</router-link>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Header -->
            <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
                <div class="container-fluid">
                    <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav" aria-controls="offcanvasNav">
                        <i class="bi bi-list"></i>
                    </button>
                    <router-link v-if="$route.path.startsWith('/form')" to="/" class="btn btn-outline-secondary btn-sm ms-2">
                        <i class="bi bi-arrow-left me-1"></i>一覧に戻る
                    </router-link>
                    <a class="navbar-brand mx-auto" href="#">
                        業績アップ取り組みダッシュボード
                    </a>
                    <button class="btn btn-light" type="button" @click="logout" :title="(myProfile?.name || user.email || '') + ' からログアウト'">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="container-fluid p-4">
                <router-view v-slot="{ Component }">
                    <transition name="fade" mode="out-in">
                        <component :is="Component" />
                    </transition>
                </router-view>
            </main>
        </template>

        <!-- Login Screen -->
        <div v-else-if="authReady" class="login-wrap">
            <div class="card login-card">
                <div class="card-body p-4">
                    <h5 class="mb-1 text-center">業績アップ取り組みダッシュボード</h5>
                    <p class="text-muted mb-4 text-center">ユーザー名とパスワードでログインしてください</p>
                    <form @submit.prevent="login">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">ユーザー名</label>
                            <input id="loginUsername" type="text" class="form-control" v-model="loginUsername" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">パスワード</label>
                            <input id="loginPassword" type="password" class="form-control" v-model="loginPassword" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" :disabled="isLoading">ログイン</button>
                    </form>
                    <div v-if="authError" class="alert alert-danger mt-3 mb-0 text-start" style="font-size: .85rem;">{{ authError }}</div>
                </div>
            </div>
        </div>

        <div v-if="!authReady || isLoading" class="loading-overlay" aria-live="polite" aria-busy="true">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" aria-label="読み込み中"></div>
            </div>
        </div>
    </div>

    <!-- Vue.js, Vue Router, Bootstrap JS from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

    <!-- Component Templates -->
    <script type="text/x-template" id="date-filter-template">
        <div class="row g-3 mb-4">
            <div :class="`col-md-${startCol}`">
                <label class="form-label">開始日</label>
                <clearable-input type="date" class="form-control" v-model="root.filterStart.value"></clearable-input>
            </div>
            <div :class="`col-md-${endCol}`">
                <label class="form-label">終了日</label>
                <clearable-input type="date" class="form-control" v-model="root.filterEnd.value"></clearable-input>
            </div>
            <div :class="`col-md-${buttonCol} d-flex align-items-end`">
                <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                <button class="btn btn-secondary" @click="reset">リセット</button>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-form-template">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <span>{{ isEdit ? '取り組みを編集' : '新規取り組みを登録' }}</span>
            </div>
            <div class="card-body">
                <form @submit.prevent="submit">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">氏名</label>
                            <tom-select id="name" class="form-select" :options="root.names.value.map(n => n.name)" :model-value="newInitiative.name" @update:model-value="onNameChange" required></tom-select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">所属</label>
                            <input type="text" class="form-control" :value="(newInitiative.company || '―') + ' / ' + (newInitiative.section || '―')" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="title" class="form-label">タイトル</label>
                            <clearable-input type="text" class="form-control" id="title" v-model="newInitiative.title" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label">実施日</label>
                            <clearable-input type="date" class="form-control" id="date" v-model="newInitiative.date" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">分類</label>
                            <select id="category" class="form-select" v-model="newInitiative.category" required>
                                <option v-for="c in root.categories.value" :key="c.id" :value="c.name">{{ c.name }}</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="content" class="form-label">具体的な内容</label>
                            <textarea class="form-control" id="content" rows="3" v-model="newInitiative.content" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="forecastAmount" class="form-label">見込み金額 (円)</label>
                            <clearable-input type="text" class="form-control" id="forecastAmount" v-model="forecastAmountInput" @input="handleForecastAmountInput" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="actualAmount" class="form-label">実績金額 (円)</label>
                            <clearable-input type="text" class="form-control" id="actualAmount" v-model="actualAmountInput" @input="handleActualAmountInput" required></clearable-input>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4" :disabled="root.isLoading.value">{{ isEdit ? '更新する' : '登録する' }}</button>
                    <button type="button" class="btn btn-danger mt-4 ms-2" v-if="isEdit" @click="remove" :disabled="root.isLoading.value">削除</button>
                </form>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-list-template">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                取り組み実績一覧
                <div class="d-flex">
                    <button class="btn btn-outline-secondary me-2" @click="exportCsv">
                        <i class="bi bi-download me-1"></i>CSVエクスポート
                    </button>
                    <router-link to="/form" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>新規登録
                    </router-link>
                </div>
            </div>
            <div class="card-body">
                <!-- Filters -->
                <date-filter :start-col="2" :end-col="2" :button-col="2" @reset="resetFilters"></date-filter>
                <div class="row g-3 mb-4">
                    <div class="col-md-2">
                        <label for="filterName" class="form-label">氏名</label>
                        <tom-select id="filterName" class="form-select" :options="root.names.value.map(n => n.name)" v-model="filters.name" placeholder="氏名で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterCompany" class="form-label">社</label>
                        <tom-select id="filterCompany" class="form-select" :options="root.companies.value.map(c => c.name)" v-model="filters.company" placeholder="社で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterSection" class="form-label">課</label>
                        <tom-select id="filterSection" class="form-select" :options="root.sections.value.map(s => s.name)" v-model="filters.section" placeholder="課で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterCategory" class="form-label">分類</label>
                        <select id="filterCategory" class="form-select" v-model="filters.category">
                            <option value="">すべて</option>
                            <option v-for="c in root.categories.value" :key="c.id" :value="c.name">{{ c.name }}</option>
                        </select>
                    </div>
                </div>

                <!-- Initiatives List -->
                 <div class="table-responsive">
                    <table class="table table-hover resizable-table">
                        <thead>
                            <tr>
                                <th scope="col" @click="sortBy('date')" class="th-sortable" :style="{width: colWidths.date + 'px'}">実施日 <i :class="sortIcon('date')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('date', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('company')" class="th-sortable" :style="{width: colWidths.company + 'px'}">社 <i :class="sortIcon('company')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('company', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('section')" class="th-sortable" :style="{width: colWidths.section + 'px'}">課 <i :class="sortIcon('section')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('section', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('name')" class="th-sortable" :style="{width: colWidths.name + 'px'}">氏名 <i :class="sortIcon('name')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('name', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('title')" class="th-sortable" :style="{width: colWidths.title + 'px'}">タイトル <i :class="sortIcon('title')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('title', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('category')" class="th-sortable" :style="{width: colWidths.category + 'px'}">分類 <i :class="sortIcon('category')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('category', $event)" @click.stop></span></th>
                                <th scope="col" :style="{width: colWidths.content + 'px'}">内容<span class="col-resizer" @mousedown.stop.prevent="startResize('content', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('forecastAmount')" class="th-sortable text-end" :style="{width: colWidths.forecastAmount + 'px'}">見込み金額(円) <i :class="sortIcon('forecastAmount')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('forecastAmount', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('actualAmount')" class="th-sortable text-end" :style="{width: colWidths.actualAmount + 'px'}">実績金額(円) <i :class="sortIcon('actualAmount')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('actualAmount', $event)" @click.stop></span></th>
                                <th :style="{width: colWidths.actions + 'px'}">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="item in paginatedInitiatives" :key="item.id"
                                tabindex="0" @keyup.enter="edit(item.id)" @click="edit(item.id)" style="cursor:pointer">
                                <td :title="item.date">{{ item.date }}</td>
                                <td :title="item.company">{{ item.company }}</td>
                                <td :title="item.section">{{ item.section }}</td>
                                <td :title="item.name">{{ item.name }}</td>
                                <td :title="item.title">{{ item.title }}</td>
                                <td><span class="badge" :class="getCategoryClass(item.category)">{{ item.category }}</span></td>
                                <td :title="item.content">{{ item.content }}</td>
                                <td class="text-end">{{ formatCurrency(item.forecastAmount) }}</td>
                                <td class="text-end">{{ formatCurrency(item.actualAmount) }}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-secondary" @click.stop="copy(item.id)">複写</button>
                                </td>
                            </tr>
                            <tr v-if="sortedInitiatives.length === 0">
                                <td colspan="10" class="text-center">該当するデータがありません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3" v-if="sortedInitiatives.length > 0">
                    <div class="text-muted small">
                        {{ sortedInitiatives.length }} 件中 {{ (currentPage - 1) * pageSize + 1 }}〜{{ Math.min(currentPage * pageSize, sortedInitiatives.length) }} 件を表示
                    </div>
                    <ul class="pagination pagination-sm mb-0" v-if="totalPages > 1">
                        <li class="page-item" :class="{ disabled: currentPage === 1 }">
                            <button type="button" class="page-link" @click="goToPage(currentPage - 1)">前へ</button>
                        </li>
                        <li class="page-item" v-for="p in totalPages" :key="p" :class="{ active: p === currentPage }">
                            <button type="button" class="page-link" @click="goToPage(p)">{{ p }}</button>
                        </li>
                        <li class="page-item" :class="{ disabled: currentPage === totalPages }">
                            <button type="button" class="page-link" @click="goToPage(currentPage + 1)">次へ</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="settings-template">
        <div>
            <h3 class="mb-3">設定</h3>
            <div class="mb-4">
                <label class="form-label">デフォルト期間</label>
                <div class="row g-2">
                    <div class="col"><input type="date" class="form-control" v-model="defaultStartInput"></div>
                    <div class="col"><input type="date" class="form-control" v-model="defaultEndInput"></div>
                    <div class="col-auto"><button class="btn btn-primary" @click="saveDefaultPeriod" :disabled="root.isLoading.value">保存</button></div>
                </div>
            </div>
            <div class="mb-4">
                <h5 class="form-label">分類別目標金額 (円)</h5>
                <div v-for="c in root.categories.value" :key="c.id" class="input-group mb-2">
                    <span class="input-group-text">{{ c.name }}</span>
                    <input type="number" class="form-control" v-model.number="categoryGoalsInput[c.name]">
                </div>
                <button class="btn btn-primary" @click="saveCategoryGoals" :disabled="root.isLoading.value">保存</button>
            </div>
            <div class="accordion" id="settingsAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingCompany">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCompany" aria-expanded="false" aria-controls="collapseCompany">
                        社
                    </button>
                </h2>
                <div id="collapseCompany" class="accordion-collapse collapse" aria-labelledby="headingCompany" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="co in root.companies.value" :key="co.id">
                                <template v-if="editingCompanyId === co.id">
                                    <clearable-input type="text" class="form-control me-2" v-model="editingCompanyName"></clearable-input>
                                    <button class="btn btn-sm btn-primary me-1" @click="saveCompany(co.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelCompanyEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ co.name || co }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startCompanyEdit(co)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeCompany(co.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                            <li class="list-group-item text-muted" v-if="root.companies.value.length === 0">社が登録されていません。下のフォームから追加してください。</li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addCompany">
                            <clearable-input type="text" class="form-control me-2" v-model="newCompany" placeholder="追加..."></clearable-input>
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingSection">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSection" aria-expanded="false" aria-controls="collapseSection">
                        課
                    </button>
                </h2>
                <div id="collapseSection" class="accordion-collapse collapse" aria-labelledby="headingSection" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="s in root.sections.value" :key="s.id">
                                <template v-if="editingSectionId === s.id">
                                    <select class="form-select me-2" style="max-width: 220px;" v-model="editingSectionCompanyId">
                                        <option v-for="co in root.companies.value" :key="co.id" :value="co.id">{{ co.name }}</option>
                                    </select>
                                    <clearable-input type="text" class="form-control me-2" v-model="editingSectionName"></clearable-input>
                                    <button class="btn btn-sm btn-primary me-1" @click="saveSection(s.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelSectionEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ companyName(s.companyId) }} / {{ s.name || s }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startSectionEdit(s)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeSection(s.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
