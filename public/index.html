    </script>

    <script type="module">
        import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import {
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile,
            onAuthStateChanged, signOut, connectAuthEmulator
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import {
            getFirestore, collection, doc, getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
            query, where, writeBatch, serverTimestamp, connectFirestoreEmulator
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCUd7bXdshWHBWIx7SZD2J8S2fLhOxwhuw",
            authDomain: "gyoseki-up-98j3h4t.firebaseapp.com",
            projectId: "gyoseki-up-98j3h4t",
            storageBucket: "gyoseki-up-98j3h4t.firebasestorage.app",
            messagingSenderId: "851897922219",
            appId: "1:851897922219:web:1dce2ab3c766e40e9dbdee"
        };
        // ログイン画面の「ユーザー名」を Firebase Authentication のメール/パスワード
        // プロバイダで扱うための疑似メールドメイン（実在するメールアドレスである必要はない）。
        const LOGIN_EMAIL_DOMAIN = 'gyoseki-up.local';

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // ローカル開発時は Firebase Emulator に接続。
        // ただし ?prod を付けると localhost でも本番の Auth/Firestore に接続する。
        const urlParams = new URLSearchParams(location.search);
        const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
        const useEmulators = isLocalhost && !urlParams.has('prod');
        if (useEmulators) {
            connectAuthEmulator(auth, `http://${location.hostname}:9099`, { disableWarnings: true });
            connectFirestoreEmulator(db, location.hostname, 8080);
        }

        const { createApp, ref, computed, onMounted, watch, provide, inject, onBeforeUnmount, toRefs } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;

        const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'ja');
        const SETTINGS_REF = () => doc(db, 'settings', 'app');
        const DEFAULT_CATEGORIES = ['粗利率改善', '固定費コントロール', '粗利額アップ'];

        // --- Components ---
        const InitiativeForm = {
            template: '#initiative-form-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const route = VueRouter.useRoute();

                const newInitiative = ref({
                    name: '',
                    company: '',
                    section: '',
                    title: '',
                    date: new Date().toISOString().slice(0, 10),
                    category: '粗利額アップ',
                    content: '',
                    forecastAmount: null,
                    actualAmount: null,
                });

                // 氏名の選択に応じて、その人が所属する課・社を自動的に紐づける
                // （社・課はここでは直接選ばせず、氏名マスタの登録内容から解決する）。
                const resolveCompanySection = (name) => {
                    const person = root.names.value.find(n => n.name === name);
                    const section = person ? root.sections.value.find(s => s.id === person.sectionId) : null;
                    const company = section ? root.companies.value.find(co => co.id === section.companyId) : null;
                    newInitiative.value.company = company ? company.name : '';
                    newInitiative.value.section = section ? section.name : '';
                };

                const onNameChange = (name) => {
                    newInitiative.value.name = name;
                    resolveCompanySection(name);
                };

                const forecastAmountInput = ref('');
                const actualAmountInput = ref('');

                // clearable-input はラップした<input>の@inputを内部の$emitより先に発火させるため、
                // ref経由(inputRef.value)で値を読むと1文字分古い値を参照してしまい、
                // 桁区切り再フォーマット時にカーソル位置がずれて数字が壊れる（例: 480000→4,8000）。
                // event.target を直接読み書きすることでこのズレを避け、カーソル位置も桁数基準で復元する。
                const makeAmountBinding = (field, inputRef) => {
                    watch(
                        () => newInitiative.value[field],
                        (val) => {
                            inputRef.value = val != null ? root.formatCurrency(val) : '';
                        },
                        { immediate: true }
                    );

                    return (event) => {
                        const target = event.target;
                        const cursor = target.selectionStart ?? target.value.length;
                        const digitsBeforeCursor = target.value.slice(0, cursor).replace(/\D/g, '').length;

                        const numeric = target.value.replace(/\D/g, '');
                        const val = numeric ? parseInt(numeric, 10) : null;
                        newInitiative.value[field] = val;

                        const formatted = val != null ? root.formatCurrency(val) : '';
                        target.value = formatted;
                        inputRef.value = formatted;

                        let newCursor = 0;
                        if (digitsBeforeCursor > 0) {
                            let seen = 0;
                            for (let i = 0; i < formatted.length; i++) {
                                if (/\d/.test(formatted[i])) seen++;
                                newCursor = i + 1;
                                if (seen === digitsBeforeCursor) break;
                            }
                        }
                        target.setSelectionRange(newCursor, newCursor);
                    };
                };

                const handleForecastAmountInput = makeAmountBinding('forecastAmount', forecastAmountInput);
                const handleActualAmountInput = makeAmountBinding('actualAmount', actualAmountInput);

                const isEdit = computed(() => !!route.params.id);

                onMounted(() => {
                    if (route.query.copy) {
                        const existing = root.initiatives.value.find(i => i.id === route.query.copy);
                        if (existing) {
                            const { id, ...rest } = existing;
                            newInitiative.value = { ...rest };
                        }
                    } else if (isEdit.value) {
                        const existing = root.initiatives.value.find(i => i.id === route.params.id);
                        if (existing) {
                            newInitiative.value = { ...existing };
                        }
                    } else {
                        // 新規登録: ログインユーザーに一致する社員があれば氏名を初期選択し、
                        // それに紐づく社・課も自動的に設定する。一致しなければ未選択のまま。
                        const me = root.myProfile.value;
                        if (me && me.name) {
                            newInitiative.value.name = me.name;
                            resolveCompanySection(me.name);
                        }
                    }
                });

                const submit = async () => {
                    if (isEdit.value) {
                        await root.updateInitiative(route.params.id, newInitiative.value);
                    } else {
                        await root.submitInitiative(newInitiative.value);
                    }
                    await router.push('/');
                };

                const remove = async () => {
                    if (!isEdit.value) return;
                    if (!confirm('本当に削除しますか？')) return;
                    await root.deleteInitiative(route.params.id);
                    await router.push('/');
                };

                return { newInitiative, submit, isEdit, remove, root, forecastAmountInput, actualAmountInput, handleForecastAmountInput, handleActualAmountInput, onNameChange };
            }
        };

        const InitiativeList = {
            template: '#initiative-list-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const filters = ref({ name: '', company: '', section: '', category: '' });
                const sortByColumn = ref('date');
                const sortDirection = ref('desc');

                const safeLower = v => (v ?? '').toString().toLowerCase();

                const filteredInitiatives = computed(() => {
                    return root.initiatives.value.filter(item => {
                        const nameMatch = safeLower(item.name).includes(safeLower(filters.value.name));
                        const companyMatch = safeLower(item.company).includes(safeLower(filters.value.company));
                        const sectionMatch = safeLower(item.section).includes(safeLower(filters.value.section));
                        const catMatch = filters.value.category ? item.category === filters.value.category : true;
                        return nameMatch && companyMatch && sectionMatch && catMatch;
                    });
                });

                const cmp = (a, b) => (a > b) - (a < b);
                const toKey = (val, col) => {
                    if (col === 'date') return new Date(val || 0).getTime();
                    if (typeof val === 'number') return val;
                    const num = Number(val);
                    return Number.isFinite(num) ? num : (val ?? '').toString();
                };

                const sortedInitiatives = computed(() => {
                    const col = sortByColumn.value;
                    const dir = sortDirection.value === 'asc' ? 1 : -1;
                    return [...filteredInitiatives.value].sort((a, b) =>
                        dir * cmp(toKey(a[col], col), toKey(b[col], col))
                    );
                });

                // --- ページング（50件ずつ） ---
                const pageSize = 50;
                const currentPage = ref(1);
                const totalPages = computed(() => Math.max(1, Math.ceil(sortedInitiatives.value.length / pageSize)));
                const paginatedInitiatives = computed(() => {
                    const start = (currentPage.value - 1) * pageSize;
                    return sortedInitiatives.value.slice(start, start + pageSize);
                });
                const goToPage = (p) => {
                    currentPage.value = Math.min(Math.max(1, p), totalPages.value);
                };
                // フィルタ・並び替え・データ更新のたびに1ページ目に戻す
                watch([filteredInitiatives, sortByColumn, sortDirection], () => {
                    currentPage.value = 1;
                });

                // --- 列幅のドラッグ調整 ---
                const colWidths = ref({
                    date: 110, company: 130, section: 130, name: 110, title: 180,
                    category: 130, content: 320, forecastAmount: 130, actualAmount: 130, actions: 90
                });
                let resizingCol = null;
                let resizeStartX = 0;
                let resizeStartWidth = 0;
                const onResizeMove = (event) => {
                    if (!resizingCol) return;
                    const delta = event.clientX - resizeStartX;
                    colWidths.value[resizingCol] = Math.max(60, resizeStartWidth + delta);
                };
                const onResizeEnd = () => {
                    resizingCol = null;
                    document.removeEventListener('mousemove', onResizeMove);
                    document.removeEventListener('mouseup', onResizeEnd);
                };
                const startResize = (col, event) => {
                    resizingCol = col;
                    resizeStartX = event.clientX;
                    resizeStartWidth = colWidths.value[col];
                    document.addEventListener('mousemove', onResizeMove);
                    document.addEventListener('mouseup', onResizeEnd);
                };
                onBeforeUnmount(() => {
                    document.removeEventListener('mousemove', onResizeMove);
                    document.removeEventListener('mouseup', onResizeEnd);
                });

                const sortBy = (column) => {
                    if (sortByColumn.value === column) {
                        sortDirection.value = sortDirection.value === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortByColumn.value = column;
                        sortDirection.value = 'desc';
                    }
                };

                const sortIcon = (column) => {
                    if (sortByColumn.value !== column) return 'bi bi-arrow-down-up';
                    return sortDirection.value === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
                };

                const resetFilters = () => {
                    filters.value = { name: '', company: '', section: '', category: '' };
                };

                const edit = (id) => {
                    router.push(`/form/${id}`);
                };

                const copy = (id) => {
                    router.push({ path: '/form', query: { copy: id } });
                };

                const exportCsv = () => {
                    const headers = ['実施日', '社', '課', '氏名', 'タイトル', '分類', '内容', '見込み金額', '実績金額'];
                    const rows = sortedInitiatives.value.map(item => [
                        item.date,
                        item.company,
                        item.section,
                        item.name,
                        item.title,
                        item.category,
                        item.content,
                        item.forecastAmount,
                        item.actualAmount
                    ]);
                    const csvContent = [headers, ...rows]
                        .map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                        .join('\r\n');
                    const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'initiatives.csv';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                };

                return {
                    root,
                    filters,
                    sortBy,
                    sortIcon,
                    sortedInitiatives,
                    paginatedInitiatives,
                    pageSize,
                    currentPage,
                    totalPages,
                    goToPage,
                    colWidths,
                    startResize,
                    resetFilters,
                    edit,
                    copy,
                    exportCsv,
                    getCategoryClass: root.getCategoryClass,
                    formatCurrency: root.formatCurrency
                };
            }
        };

        const Settings = {
            template: '#settings-template',
            setup() {
                const root = inject('root');
                  const newCompany = ref('');
                  const newSectionName = ref('');
                  const newSectionCompanyId = ref('');
                  const csvCompanyId = ref('');
                  const csvSectionId = ref('');
                  const namesFile = ref(null);
                  const newCategory = ref('');

                  const companyName = (companyId) => root.companies.value.find(co => co.id === companyId)?.name || '';
                  const sectionLabel = (sectionId) => {
                      const s = root.sections.value.find(s => s.id === sectionId);
                      return s ? `${companyName(s.companyId)} / ${s.name}` : '';
                  };
                  // 指定した社に属する課だけを返す（氏名モーダル・CSVインポートの「社→課」の絞り込みに使う）
                  const sectionsOf = (companyId) => root.sections.value.filter(s => s.companyId === companyId);
                  const firstSectionOf = (companyId) => sectionsOf(companyId)[0]?.id || '';

                  watch(root.companies, (list) => {
                      if (!newSectionCompanyId.value && list.length) newSectionCompanyId.value = list[0].id;
                      if (!csvCompanyId.value && list.length) csvCompanyId.value = list[0].id;
                  }, { immediate: true });
                  watch(csvCompanyId, (companyId) => {
                      csvSectionId.value = firstSectionOf(companyId);
                  });

                  // 氏名 追加/編集モーダル
                  const nameModalMode = ref(null); // null | 'add' | 'edit'
                  const nameModalEditId = ref(null);
                  const nameModalCompanyId = ref('');
                  const nameModalSectionId = ref('');
                  const nameModalName = ref('');
                  const nameModalUsername = ref('');
                  const nameModalPassword = ref('');
                  const nameModalError = ref('');

                  const openAddNameModal = () => {
                      nameModalMode.value = 'add';
                      nameModalEditId.value = null;
                      nameModalCompanyId.value = root.companies.value[0]?.id || '';
                      nameModalSectionId.value = firstSectionOf(nameModalCompanyId.value);
                      nameModalName.value = '';
                      nameModalUsername.value = '';
                      nameModalPassword.value = '';
                      nameModalError.value = '';
                  };
                  const openEditNameModal = (n) => {
                      nameModalMode.value = 'edit';
                      nameModalEditId.value = n.id;
                      const sec = root.sections.value.find(s => s.id === n.sectionId);
                      nameModalCompanyId.value = sec ? sec.companyId : '';
                      nameModalSectionId.value = n.sectionId;
                      nameModalName.value = n.name || n;
                      nameModalUsername.value = n.username || '';
                      nameModalPassword.value = '';
                      nameModalError.value = '';
                  };
                  const closeNameModal = () => {
                      nameModalMode.value = null;
                  };
                  const onNameModalCompanyChange = () => {
                      nameModalSectionId.value = firstSectionOf(nameModalCompanyId.value);
                  };
                  const submitNameModal = async () => {
                      if (!nameModalName.value || !nameModalSectionId.value) return;
                      if (nameModalMode.value === 'add') {
                          if (nameModalUsername.value && !nameModalPassword.value) {
                              nameModalError.value = 'パスワードを入力してください。';
                              return;
                          }
                          if (!nameModalUsername.value && nameModalPassword.value) {
                              nameModalError.value = 'ユーザー名を入力してください。';
                              return;
                          }
                          nameModalError.value = '';
                          const result = await root.addNameWithLogin(nameModalName.value, nameModalSectionId.value, nameModalUsername.value, nameModalPassword.value);
                          if (result.ok) {
                              closeNameModal();
                          } else {
                              nameModalError.value = result.message || '追加に失敗しました。';
                          }
                      } else {
                          await root.updateName(nameModalEditId.value, nameModalName.value, nameModalSectionId.value);
                          closeNameModal();
                      }
                  };
                  const defaultStartInput = ref(root.defaultStart.value);
                  watch(root.defaultStart, v => (defaultStartInput.value = v));
                  const defaultEndInput = ref(root.defaultEnd.value);
                  watch(root.defaultEnd, v => (defaultEndInput.value = v));
                  const categoryGoalsInput = ref({ ...root.categoryGoals.value });
                  watch(root.categoryGoals, v => (categoryGoalsInput.value = { ...v }));

                  const editingCompanyId = ref(null);
                  const editingCompanyName = ref('');
                  const editingSectionId = ref(null);
                  const editingSectionName = ref('');
                  const editingSectionCompanyId = ref('');
                  const editingCategoryId = ref(null);
                  const editingCategoryName = ref('');

                  const addCompany = async () => {
                      if (!newCompany.value) return;
                      await root.addCompany(newCompany.value);
                      newCompany.value = '';
                  };
                  const startCompanyEdit = (co) => {
                      editingCompanyId.value = co.id;
                      editingCompanyName.value = co.name || co;
                  };
                  const cancelCompanyEdit = () => {
                      editingCompanyId.value = null;
                      editingCompanyName.value = '';
                  };
                  const saveCompany = async (id) => {
                      if (!editingCompanyName.value) return;
                      await root.updateCompany(id, editingCompanyName.value);
                      cancelCompanyEdit();
                  };
                  const removeCompany = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteCompany(id);
                  };

                  const addSection = async () => {
                      if (!newSectionName.value || !newSectionCompanyId.value) return;
                      await root.addSection(newSectionName.value, newSectionCompanyId.value);
                      newSectionName.value = '';
                  };
                  const startSectionEdit = (s) => {
                      editingSectionId.value = s.id;
                      editingSectionName.value = s.name || s;
                      editingSectionCompanyId.value = s.companyId;
                  };
                  const cancelSectionEdit = () => {
                      editingSectionId.value = null;
                      editingSectionName.value = '';
                      editingSectionCompanyId.value = '';
                  };
                  const saveSection = async (id) => {
                      if (!editingSectionName.value || !editingSectionCompanyId.value) return;
                      await root.updateSection(id, editingSectionName.value, editingSectionCompanyId.value);
                      cancelSectionEdit();
                  };
                  const removeSection = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteSection(id);
                  };

                  const removeName = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteName(id);
                  };

                  const importNamesCsv = async () => {
                      const file = namesFile.value?.files[0];
                      if (!file || !csvSectionId.value) return;
                      await root.importNames(file, csvSectionId.value);
                      namesFile.value.value = '';
                  };

                  const addCategory = async () => {
                      if (!newCategory.value) return;
                      await root.addCategory(newCategory.value);
                      newCategory.value = '';
                  };
                  const startCategoryEdit = (c) => {
                      editingCategoryId.value = c.id;
                      editingCategoryName.value = c.name || c;
                  };
                  const cancelCategoryEdit = () => {
                      editingCategoryId.value = null;
                      editingCategoryName.value = '';
                  };
                  const saveCategory = async (id) => {
                      if (!editingCategoryName.value) return;
                      await root.updateCategory(id, editingCategoryName.value);
                      cancelCategoryEdit();
                  };
                  const removeCategory = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteCategory(id);
                  };

                  const saveDefaultPeriod = async () => {
                      await root.updateDefaultPeriod(defaultStartInput.value, defaultEndInput.value);
                  };
                  const saveCategoryGoals = async () => {
                      await root.updateCategoryGoals(categoryGoalsInput.value);
                  };

                  return {
                      root,
                      newCompany,
                      newSectionName,
                      newSectionCompanyId,
                      csvCompanyId,
                      csvSectionId,
                      namesFile,
                      newCategory,
                      defaultStartInput,
                      defaultEndInput,
                      categoryGoalsInput,
                      companyName,
                      sectionLabel,
                      sectionsOf,
                      editingCompanyId,
                      editingCompanyName,
                      editingSectionId,
                      editingSectionName,
                      editingSectionCompanyId,
                      editingCategoryId,
                      editingCategoryName,
                      nameModalMode,
                      nameModalCompanyId,
                      nameModalSectionId,
                      nameModalName,
                      nameModalUsername,
                      nameModalPassword,
                      nameModalError,
                      openAddNameModal,
                      openEditNameModal,
                      closeNameModal,
                      onNameModalCompanyChange,
                      submitNameModal,
                      addCompany,
                      startCompanyEdit,
                      cancelCompanyEdit,
                      saveCompany,
                      removeCompany,
                      addSection,
                      startSectionEdit,
                      cancelSectionEdit,
                      saveSection,
                      removeSection,
                      removeName,
                      importNamesCsv,
                      addCategory,
                      startCategoryEdit,
                      cancelCategoryEdit,
                      saveCategory,
                      removeCategory,
                      saveDefaultPeriod,
                      saveCategoryGoals
                  };
            }
        };

        // --- Router ---
        const routes = [
            { path: '/', component: InitiativeList },
            { path: '/list', redirect: '/' },
            { path: '/form/:id?', component: InitiativeForm },
            { path: '/settings', component: Settings },
        ];
        const router = createRouter({
            history: createWebHashHistory(),
            routes,
            linkActiveClass: 'active'
        });

        // --- Main App ---
        const app = createApp({
            setup() {
                const user = ref(null);
                const authReady = ref(false);
                const authError = ref('');
                const loginUsername = ref('');
                const loginPassword = ref('');

                const initiatives = ref([]);
                const companies = ref([]);
                const sections = ref([]);
                const names = ref([]);
                const categories = ref([]);
                const categoryGoals = ref({});
                const defaultStart = ref('');
                const defaultEnd = ref('');
                const filterStart = ref('');
                const filterEnd = ref('');

                // ログイン中ユーザーのプロフィール（氏名。新規登録の初期値に使う）。
                // users/{uid} はアカウント作成時に管理者スクリプト(tools/manage_users.py)が書き込む。
                const myProfileDoc = ref(null);
                const myProfile = computed(() => myProfileDoc.value);

                const loadingCount = ref(0);
                const isLoading = computed(() => loadingCount.value > 0);
                const withLoading = async (fn) => {
                    loadingCount.value++;
                    try {
                        return await fn();
                    } finally {
                        loadingCount.value--;
                    }
                };

                // --- Firestore helpers ---
                const colRef = (name) => collection(db, name);

                const loadCollection = async (name) => {
                    const snap = await getDocs(colRef(name));
                    return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName);
                };

                const queryInitiatives = async (start, end) => {
                    const clauses = [];
                    if (start) clauses.push(where('date', '>=', start));
                    if (end) clauses.push(where('date', '<=', end));
                    const q = clauses.length ? query(colRef('initiatives'), ...clauses) : colRef('initiatives');
                    const snap = await getDocs(q);
                    // 旧「金額」フィールド（amount）のみを持つ既存データは実績金額として扱う
                    return snap.docs.map(d => {
                        const data = d.data();
                        return {
                            id: d.id,
                            ...data,
                            forecastAmount: data.forecastAmount ?? 0,
                            actualAmount: data.actualAmount ?? data.amount ?? 0,
                        };
                    });
                };

                // 初回アクセス時に分類マスタと設定ドキュメントを初期化
                const seedIfEmpty = async () => {
                    const settingsSnap = await getDoc(SETTINGS_REF());
                    if (!settingsSnap.exists()) {
                        await setDoc(SETTINGS_REF(), {
                            default_start: '',
                            default_end: '',
                            category_goals: {}
                        });
                    }
                    const catSnap = await getDocs(colRef('categories'));
                    if (catSnap.empty) {
                        const batch = writeBatch(db);
                        DEFAULT_CATEGORIES.forEach(name => {
                            batch.set(doc(colRef('categories')), { name });
                        });
                        await batch.commit();
                    }
                };

                const fetchBootstrap = async () => {
                    await withLoading(async () => {
                        try {
                            await seedIfEmpty();
                            const settingsSnap = await getDoc(SETTINGS_REF());
                            const s = settingsSnap.exists() ? settingsSnap.data() : {};
                            categoryGoals.value = s.category_goals || {};
                            defaultStart.value = s.default_start || '';
                            defaultEnd.value = s.default_end || '';
                            if (!filterStart.value) filterStart.value = defaultStart.value;
                            if (!filterEnd.value) filterEnd.value = defaultEnd.value;

                            const [inits, cos, secs, nms, cats, profileSnap] = await Promise.all([
                                queryInitiatives(filterStart.value, filterEnd.value),
                                loadCollection('companies'),
                                loadCollection('sections'),
                                loadCollection('names'),
                                loadCollection('categories'),
                                user.value ? getDoc(doc(db, 'users', user.value.uid)) : null,
                            ]);
                            initiatives.value = inits;
                            companies.value = cos;
                            sections.value = secs;
                            names.value = nms;
                            categories.value = cats;
                            myProfileDoc.value = profileSnap && profileSnap.exists() ? profileSnap.data() : null;
                        } catch (error) {
                            console.error('Error fetching bootstrap data:', error);
                        }
                    });
                };

                const fetchInitiatives = async () => {
                    await withLoading(async () => {
                        try {
                            initiatives.value = await queryInitiatives(filterStart.value, filterEnd.value);
                        } catch (error) {
                            console.error('Error fetching initiatives:', error);
                        }
                    });
                };

                const fetchCompanies = async () => {
                    await withLoading(async () => {
                        try {
                            companies.value = await loadCollection('companies');
                        } catch (error) {
                            console.error('Error fetching companies:', error);
                        }
                    });
                };

                const fetchSections = async () => {
                    await withLoading(async () => {
                        try {
                            sections.value = await loadCollection('sections');
                        } catch (error) {
                            console.error('Error fetching sections:', error);
                        }
                    });
                };

                const fetchNames = async () => {
                    await withLoading(async () => {
                        try {
                            names.value = await loadCollection('names');
                        } catch (error) {
                            console.error('Error fetching names:', error);
                        }
                    });
                };

                const fetchCategories = async () => {
                    await withLoading(async () => {
                        try {
                            categories.value = await loadCollection('categories');
                        } catch (error) {
                            console.error('Error fetching categories:', error);
                        }
                    });
                };

                const updateDefaultPeriod = async (start, end) => {
                    await withLoading(async () => {
                        try {
                            await setDoc(SETTINGS_REF(), { default_start: start || '', default_end: end || '' }, { merge: true });
                            defaultStart.value = start;
                            defaultEnd.value = end;
                            filterStart.value = start;
                            filterEnd.value = end;
                        } catch (error) {
                            console.error('Error updating default period:', error);
                        }
                    });
                };

                const updateCategoryGoals = async (goals) => {
                    await withLoading(async () => {
                        try {
                            const clean = {};
                            Object.entries(goals || {}).forEach(([k, v]) => {
                                clean[k] = Number(v) || 0;
                            });
                            await setDoc(SETTINGS_REF(), { category_goals: clean }, { merge: true });
                            categoryGoals.value = clean;
                        } catch (error) {
                            console.error('Error updating category goals:', error);
                        }
                    });
                };

                const pickInitiative = (data) => ({
                    name: data.name,
                    company: data.company,
                    section: data.section,
                    title: data.title,
                    date: data.date,
                    category: data.category,
                    content: data.content,
                    forecastAmount: parseInt(data.forecastAmount, 10) || 0,
                    actualAmount: parseInt(data.actualAmount, 10) || 0,
                });

                const submitInitiative = async (newInitiative) => {
                    await withLoading(async () => {
                        try {
                            await addDoc(colRef('initiatives'), {
                                ...pickInitiative(newInitiative),
                                createdAt: serverTimestamp(),
                            });
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error submitting initiative:', error);
                        }
                    });
                };

                const updateInitiative = async (id, updated) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, 'initiatives', id), pickInitiative(updated));
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error updating initiative:', error);
                        }
                    });
                };

                const deleteInitiative = async (id) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, 'initiatives', id));
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error deleting initiative:', error);
                        }
                    });
                };

                // --- マスタ (社・課・氏名・分類) 共通処理 ---
                // scopeKey を指定すると、その項目が同じ場合のみ name の重複とみなす
                // （例: 課は同じ社の中でのみ重複禁止、氏名は同じ課の中でのみ重複禁止）。
                const addMasterItem = async (colName, data, listRef, refetch, scopeKey) => {
                    await withLoading(async () => {
                        try {
                            const dup = listRef.value.some(item =>
                                item.name === data.name && (!scopeKey || item[scopeKey] === data[scopeKey])
                            );
                            if (dup) {
                                alert('既に登録されています: ' + data.name);
                                return;
                            }
                            await addDoc(colRef(colName), data);
                            await refetch();
                        } catch (error) {
                            console.error(`Error adding to ${colName}:`, error);
                        }
                    });
                };

                const updateMasterItem = async (colName, id, data, refetch) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, colName, id), data);
                            await refetch();
                        } catch (error) {
                            console.error(`Error updating ${colName}:`, error);
                        }
                    });
                };

                const deleteMasterItem = async (colName, id, refetch) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, colName, id));
                            await refetch();
                        } catch (error) {
                            console.error(`Error deleting from ${colName}:`, error);
                        }
                    });
                };

                const addCompany = (name) => addMasterItem('companies', { name }, companies, fetchCompanies);
                const updateCompany = (id, name) => updateMasterItem('companies', id, { name }, fetchCompanies);
                const deleteCompany = (id) => {
                    if (sections.value.some(s => s.companyId === id)) {
                        alert('この社に属する課が存在するため削除できません。先に課を削除してください。');
                        return;
                    }
                    return deleteMasterItem('companies', id, fetchCompanies);
                };

                const addSection = (name, companyId) => addMasterItem('sections', { name, companyId }, sections, fetchSections, 'companyId');
                const updateSection = (id, name, companyId) => updateMasterItem('sections', id, { name, companyId }, fetchSections);
                const deleteSection = (id) => {
                    if (names.value.some(n => n.sectionId === id)) {
                        alert('この課に属する氏名が存在するため削除できません。先に氏名を削除するか、別の課に変更してください。');
                        return;
                    }
                    return deleteMasterItem('sections', id, fetchSections);
                };

                // 氏名の追加と同時に、任意でログインアカウント（ユーザー名/パスワード）も作成する。
                // メインの Auth セッション（今操作している管理者自身）を維持したまま新規アカウントを
                // 作れるよう、一時的な別 Firebase App インスタンス上で作成する。
                const createLoginAccount = async (username, password, displayName) => {
                    const secondaryApp = initializeApp(firebaseConfig, `secondary-${Math.random().toString(36).slice(2)}`);
                    const secondaryAuth = getAuth(secondaryApp);
                    if (useEmulators) {
                        connectAuthEmulator(secondaryAuth, `http://${location.hostname}:9099`, { disableWarnings: true });
                    }
                    try {
                        const pseudoEmail = `${username.trim().toLowerCase()}@${LOGIN_EMAIL_DOMAIN}`;
                        const cred = await createUserWithEmailAndPassword(secondaryAuth, pseudoEmail, password);
                        await updateProfile(cred.user, { displayName });
                        await setDoc(doc(db, 'users', cred.user.uid), {
                            username: username.trim().toLowerCase(),
                            name: displayName,
                        });
                        return cred.user.uid;
                    } finally {
                        try { await signOut(secondaryAuth); } catch (e) { /* 無視 */ }
                        await deleteApp(secondaryApp);
                    }
                };

                const describeAccountError = (error) => {
                    if (error.code === 'auth/email-already-in-use') return 'そのユーザー名は既に使われています。';
                    if (error.code === 'auth/weak-password') return 'パスワードは6文字以上にしてください。';
                    if (error.code === 'auth/invalid-email') return 'ユーザー名に使用できない文字が含まれています。';
                    return 'ログインアカウントの作成に失敗しました: ' + (error.message || error.code || error);
                };

                // username を指定した場合のみログインアカウントも作成する（省略可）。
                const addNameWithLogin = (name, sectionId, username, password) => withLoading(async () => {
                    try {
                        if (names.value.some(n => n.name === name && n.sectionId === sectionId)) {
                            return { ok: false, message: '既に登録されています: ' + name };
                        }
                        const data = { name, sectionId };
                        if (username) {
                            try {
                                await createLoginAccount(username, password, name);
                            } catch (error) {
                                console.error('Error creating login account:', error);
                                return { ok: false, message: describeAccountError(error) };
                            }
                            data.username = username.trim().toLowerCase();
                        }
                        await addDoc(colRef('names'), data);
                        await fetchNames();
                        return { ok: true };
                    } catch (error) {
                        console.error('Error adding name:', error);
                        return { ok: false, message: '追加に失敗しました。' };
                    }
                });
                const updateName = (id, name, sectionId) => updateMasterItem('names', id, { name, sectionId }, fetchNames);
                const deleteName = (id) => deleteMasterItem('names', id, fetchNames);

                const addCategory = (name) => addMasterItem('categories', { name }, categories, fetchCategories);
                const updateCategory = (id, name) => updateMasterItem('categories', id, { name }, fetchCategories);
                const deleteCategory = (id) => deleteMasterItem('categories', id, fetchCategories);

                const importNames = async (file, sectionId) => {
                    await withLoading(async () => {
                        try {
                            const text = (await file.text()).replace(/^﻿/, '');
                            // 同じ課の中でのみ重複とみなす
                            const existing = new Set(
                                names.value.filter(n => n.sectionId === sectionId).map(n => n.name)
                            );
                            const toAdd = [];
                            text.split(/\r?\n/).forEach(line => {
                                if (!line.trim()) return;
                                let name = line.split(',')[0].trim();
                                name = name.replace(/^"(.*)"$/, '$1').trim();
                                if (name && !existing.has(name)) {
                                    existing.add(name);
                                    toAdd.push(name);
                                }
                            });
                            // Firestore のバッチ書き込みは1回500件まで
                            for (let i = 0; i < toAdd.length; i += 450) {
                                const batch = writeBatch(db);
                                toAdd.slice(i, i + 450).forEach(name => {
                                    batch.set(doc(colRef('names')), { name, sectionId });
                                });
                                await batch.commit();
                            }
                            await fetchNames();
                        } catch (error) {
                            console.error('Error importing names:', error);
                        }
                    });
                };

                const formatCurrency = (value) => new Intl.NumberFormat('ja-JP').format(value);

                const getCategoryClass = (category) => {
                    switch (category) {
                        case '粗利率改善': return 'bg-warning text-dark';
                        case '固定費コントロール': return 'bg-danger';
                        case '粗利額アップ': return 'bg-success';
                        default: return 'bg-secondary';
                    }
                };

                const hideOffcanvas = () => {
                    const el = document.getElementById('offcanvasNav');
                    if (!el) return;
                    let instance = bootstrap.Offcanvas.getInstance(el);
                    if (!instance) instance = new bootstrap.Offcanvas(el);
                    instance.hide();
                };

                // --- Auth ---
                const login = async () => {
                    authError.value = '';
                    const username = loginUsername.value.trim();
                    if (!username || !loginPassword.value) return;
                    try {
                        const pseudoEmail = `${username.toLowerCase()}@${LOGIN_EMAIL_DOMAIN}`;
                        await signInWithEmailAndPassword(auth, pseudoEmail, loginPassword.value);
                        loginPassword.value = '';
                    } catch (error) {
                        console.error('Login error:', error);
                        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                            authError.value = 'ユーザー名またはパスワードが正しくありません。';
                        } else {
                            authError.value = 'ログインに失敗しました: ' + (error.message || error.code || error);
                        }
                    }
                };

                const logout = async () => {
                    await signOut(auth);
                };

                onAuthStateChanged(auth, async (u) => {
                    user.value = u;
                    authReady.value = true;
                    if (u) {
                        await fetchBootstrap();
                    } else {
                        initiatives.value = [];
                        companies.value = [];
                        sections.value = [];
                        names.value = [];
                        categories.value = [];
                        myProfileDoc.value = null;
                    }
                });

                // Provide shared state and methods to all components
                  provide('root', {
                      initiatives,
                      companies,
                      sections,
                      names,
                      categories,
                      categoryGoals,
                      defaultStart,
                      defaultEnd,
                      filterStart,
                      filterEnd,
                      fetchInitiatives,
                      submitInitiative,
                      updateInitiative,
                      deleteInitiative,
                      fetchCompanies,
                      fetchSections,
                      fetchNames,
                      fetchCategories,
                      addCompany,
                      addSection,
                      addNameWithLogin,
                      importNames,
                      addCategory,
                      updateCompany,
                      deleteCompany,
                      updateSection,
                      deleteSection,
                      updateName,
                      deleteName,
                      updateCategory,
                      deleteCategory,
                      updateDefaultPeriod,
                      updateCategoryGoals,
                      formatCurrency,
                      getCategoryClass,
                      isLoading,
                      myProfile
                  });

                  return { initiatives, hideOffcanvas, isLoading, filterStart, filterEnd, fetchInitiatives, user, myProfile, authReady, authError, loginUsername, loginPassword, login, logout };
            }
        });

        app.component('tom-select', {
            inheritAttrs: false,
            props: {
                modelValue: String,
                options: Array
            },
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const selectRef = ref(null);
                let ts;

                const updateOptions = (opts = []) => {
                    if (ts) {
                        ts.clearOptions();
                        ts.addOptions(opts.map(o => ({ value: o, text: o })));
                        ts.refreshOptions(false);
                    }
                };

                onMounted(() => {
                    ts = new TomSelect(selectRef.value, {
                        create: true,
                        plugins: ['clear_button'],
                        placeholder: attrs.placeholder || '',
                        onChange(value) {
                            emit('update:modelValue', value);
                        }
                    });
                    updateOptions(props.options);
                    if (props.modelValue) {
                        ts.setValue(props.modelValue);
                    }
                });

                watch(() => props.options, (opts) => {
                    updateOptions(opts);
                }, { deep: true });

                watch(() => props.modelValue, (val) => {
                    if (ts && ts.getValue() !== val) {
                        ts.setValue(val || '');
                    }
                });

                onBeforeUnmount(() => {
                    if (ts) ts.destroy();
                });

                return { selectRef, attrs };
            },
            template: `<select ref="selectRef" v-bind="attrs"></select>`
        });

        app.component('clearable-input', {
            inheritAttrs: false,
            props: ['modelValue'],
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const inputClass = computed(() => [attrs.class, 'pe-4'].filter(Boolean).join(' '));
                const clear = () => emit('update:modelValue', '');
                return { attrs, inputClass, clear };
            },
            template: `
                <div class="position-relative">
                    <input v-bind="attrs" :class="inputClass" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)">
                    <button v-if="modelValue" type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" aria-label="Clear" @click="clear"></button>
                </div>
            `
        });

        app.component('date-filter', {
            template: '#date-filter-template',
            props: {
                startCol: { type: Number, default: 3 },
                endCol: { type: Number, default: 3 },
                buttonCol: { type: Number, default: 3 }
            },
            setup(props, { emit }) {
                const root = inject('root');
                const { startCol, endCol, buttonCol } = toRefs(props);
                const reset = () => {
                    root.filterStart.value = '';
                    root.filterEnd.value = '';
                    root.fetchInitiatives();
                    emit('reset');
                };
                return { root, reset, startCol, endCol, buttonCol };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
