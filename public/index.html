<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業績アップ取り組みダッシュボード</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Tom Select CSS (Bootstrap 5 theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 500;
        }
        .kpi-card .card-body {
            font-size: 2.2rem;
            font-weight: 700;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .th-sortable {
            cursor: pointer;
            user-select: none;
        }
        .th-sortable:hover {
            background-color: #f8f9fa;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
        .nav-link.active {
            font-weight: 700;
            background-color: #e9ecef;
            border-radius: 0.25rem;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="app">
        <template v-if="user">
            <!-- Offcanvas Navigation -->
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavLabel">メニュー</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <router-link to="/" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-graph-up-arrow me-2"></i>ダッシュボード</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/form" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-plus-circle me-2"></i>新規登録</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/list" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-list-task me-2"></i>実績一覧</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/about" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-info-circle me-2"></i>業績アップ活動とは</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/settings" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-gear me-2"></i>設定</router-link>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Header -->
            <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
                <div class="container-fluid">
                    <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav" aria-controls="offcanvasNav">
                        <i class="bi bi-list"></i>
                    </button>
                    <router-link v-if="$route.path.startsWith('/form')" to="/list" class="btn btn-outline-secondary btn-sm ms-2">
                        <i class="bi bi-arrow-left me-1"></i>一覧に戻る
                    </router-link>
                    <a class="navbar-brand mx-auto" href="#">
                        業績アップ取り組みダッシュボード
                    </a>
                    <button class="btn btn-light" type="button" @click="logout" :title="(myProfile?.name || user.email || '') + ' からログアウト'">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="container-fluid p-4">
                <router-view v-slot="{ Component }">
                    <transition name="fade" mode="out-in">
                        <component :is="Component" />
                    </transition>
                </router-view>
            </main>
        </template>

        <!-- Login Screen -->
        <div v-else-if="authReady" class="login-wrap">
            <div class="card login-card">
                <div class="card-body p-4">
                    <h5 class="mb-1 text-center">業績アップ取り組みダッシュボード</h5>
                    <p class="text-muted mb-4 text-center">ユーザー名とパスワードでログインしてください</p>
                    <form @submit.prevent="login">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">ユーザー名</label>
                            <input id="loginUsername" type="text" class="form-control" v-model="loginUsername" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">パスワード</label>
                            <input id="loginPassword" type="password" class="form-control" v-model="loginPassword" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" :disabled="isLoading">ログイン</button>
                    </form>
                    <div v-if="authError" class="alert alert-danger mt-3 mb-0 text-start" style="font-size: .85rem;">{{ authError }}</div>
                </div>
            </div>
        </div>

        <div v-if="!authReady || isLoading" class="loading-overlay" aria-live="polite" aria-busy="true">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" aria-label="読み込み中"></div>
            </div>
        </div>
    </div>

    <!-- Vue.js, Vue Router, Chart.js, Bootstrap JS from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

    <!-- Component Templates -->
    <script type="text/x-template" id="date-filter-template">
        <div class="row g-3 mb-4">
            <div :class="`col-md-${startCol}`">
                <label class="form-label">開始日</label>
                <clearable-input type="date" class="form-control" v-model="root.filterStart.value"></clearable-input>
            </div>
            <div :class="`col-md-${endCol}`">
                <label class="form-label">終了日</label>
                <clearable-input type="date" class="form-control" v-model="root.filterEnd.value"></clearable-input>
            </div>
            <div :class="`col-md-${buttonCol} d-flex align-items-end`">
                <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                <button class="btn btn-secondary" @click="reset">リセット</button>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="dashboard-template">
        <div>
            <!-- 新規登録ボタン -->
            <div class="d-flex justify-content-end mb-3">
                <router-link to="/form" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>新規登録
                </router-link>
            </div>

            <!-- Date Filters -->
            <date-filter></date-filter>

            <!-- 目標達成率 -->
            <div class="row">
                <div class="col-12 mb-4">
                    <div class="card">
                        <div class="card-header">目標達成率</div>
                        <div class="card-body">
                            <div v-for="c in root.categories.value" :key="c.id" class="mb-4">
                                <div class="d-flex justify-content-between">
                                    <strong>{{ c.name }}</strong>
                                    <span v-if="root.categoryGoals.value[c.name] > 0" class="text-muted">目標 ¥{{ formatCurrency(root.categoryGoals.value[c.name]) }}</span>
                                </div>

                                <div class="d-flex justify-content-between small mt-2">
                                    <span>実績: ¥{{ formatCurrency(categorySummary[c.name] || 0) }}</span>
                                    <span v-if="root.categoryGoals.value[c.name] > 0">{{ ((categorySummary[c.name] || 0) / root.categoryGoals.value[c.name] * 100).toFixed(1) }}%</span>
                                </div>
                                <div class="progress" style="height: 14px;">
                                    <div class="progress-bar" :style="{
                                        width: (root.categoryGoals.value[c.name] > 0 ? Math.min((categorySummary[c.name] || 0) / root.categoryGoals.value[c.name] * 100, 100) : 0) + '%',
                                        backgroundColor: root.categoryColorMap.value[c.name]
                                    }"></div>
                                </div>

                                <div class="d-flex justify-content-between small mt-2 text-muted">
                                    <span>見込み: ¥{{ formatCurrency(categoryForecastSummary[c.name] || 0) }}</span>
                                    <span v-if="root.categoryGoals.value[c.name] > 0">{{ ((categoryForecastSummary[c.name] || 0) / root.categoryGoals.value[c.name] * 100).toFixed(1) }}%</span>
                                </div>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar" :style="{
                                        width: (root.categoryGoals.value[c.name] > 0 ? Math.min((categoryForecastSummary[c.name] || 0) / root.categoryGoals.value[c.name] * 100, 100) : 0) + '%',
                                        backgroundColor: root.categoryColorMap.value[c.name],
                                        opacity: 0.4
                                    }"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card text-center">
                        <div class="card-header bg-success text-white">合計貢献金額</div>
                        <div class="card-body kpi-card">
                            ¥{{ formatCurrency(totalAmount) }}
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card text-center">
                        <div class="card-header bg-info text-white">総件数</div>
                        <div class="card-body kpi-card">
                            {{ root.initiatives.value.length }} 件
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-lg-4 mb-4" v-for="c in root.categories.value" :key="c.id">
                    <div class="card">
                        <div class="card-header">{{ c.name }}（部門別内訳）</div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas :ref="el => setCategoryPieRef(c.id, el)"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 mb-4">
                    <div class="card">
                        <div class="card-header">部門別 金額</div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas ref="departmentChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-form-template">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <span>{{ isEdit ? '取り組みを編集' : '新規取り組みを登録' }}</span>
            </div>
            <div class="card-body">
                <form @submit.prevent="submit">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="department" class="form-label">部門・チーム</label>
                            <tom-select id="department" class="form-select" :options="root.departments.value.map(d => d.name)" v-model="newInitiative.department" required></tom-select>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">氏名</label>
                            <tom-select id="name" class="form-select" :options="root.names.value.map(n => n.name)" v-model="newInitiative.name" required></tom-select>
                        </div>
                        <div class="col-md-6">
                            <label for="title" class="form-label">タイトル</label>
                            <clearable-input type="text" class="form-control" id="title" v-model="newInitiative.title" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label">実施日</label>
                            <clearable-input type="date" class="form-control" id="date" v-model="newInitiative.date" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">分類</label>
                            <select id="category" class="form-select" v-model="newInitiative.category" required>
                                <option v-for="c in root.categories.value" :key="c.id" :value="c.name">{{ c.name }}</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="content" class="form-label">具体的な内容</label>
                            <textarea class="form-control" id="content" rows="3" v-model="newInitiative.content" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="forecastAmount" class="form-label">見込み金額 (円)</label>
                            <clearable-input type="text" class="form-control" id="forecastAmount" v-model="forecastAmountInput" @input="handleForecastAmountInput" required></clearable-input>
                        </div>
                        <div class="col-md-6">
                            <label for="actualAmount" class="form-label">実績金額 (円)</label>
                            <clearable-input type="text" class="form-control" id="actualAmount" v-model="actualAmountInput" @input="handleActualAmountInput" required></clearable-input>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4" :disabled="root.isLoading.value">{{ isEdit ? '更新する' : '登録する' }}</button>
                    <button type="button" class="btn btn-danger mt-4 ms-2" v-if="isEdit" @click="remove" :disabled="root.isLoading.value">削除</button>
                </form>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-list-template">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                取り組み実績一覧
                <div class="d-flex">
                    <button class="btn btn-outline-secondary me-2" @click="exportCsv">
                        <i class="bi bi-download me-1"></i>CSVエクスポート
                    </button>
                    <router-link to="/form" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>新規登録
                    </router-link>
                </div>
            </div>
            <div class="card-body">
                <!-- Filters -->
                <date-filter :start-col="2" :end-col="2" :button-col="2" @reset="resetFilters"></date-filter>
                <div class="row g-3 mb-4">
                    <div class="col-md-2">
                        <label for="filterName" class="form-label">氏名</label>
                        <tom-select id="filterName" class="form-select" :options="root.names.value.map(n => n.name)" v-model="filters.name" placeholder="氏名で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterDepartment" class="form-label">部門</label>
                        <tom-select id="filterDepartment" class="form-select" :options="root.departments.value.map(d => d.name)" v-model="filters.department" placeholder="部門で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterCategory" class="form-label">分類</label>
                        <select id="filterCategory" class="form-select" v-model="filters.category">
                            <option value="">すべて</option>
                            <option v-for="c in root.categories.value" :key="c.id" :value="c.name">{{ c.name }}</option>
                        </select>
                    </div>
                </div>

                <!-- Initiatives List -->
                 <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col" @click="sortBy('date')" class="th-sortable">実施日 <i :class="sortIcon('date')"></i></th>
                                <th scope="col" @click="sortBy('department')" class="th-sortable">部門 <i :class="sortIcon('department')"></i></th>
                                <th scope="col" @click="sortBy('name')" class="th-sortable">氏名 <i :class="sortIcon('name')"></i></th>
                                <th scope="col" @click="sortBy('title')" class="th-sortable">タイトル <i :class="sortIcon('title')"></i></th>
                                <th scope="col" @click="sortBy('category')" class="th-sortable">分類 <i :class="sortIcon('category')"></i></th>
                                <th scope="col">内容</th>
                                <th scope="col" @click="sortBy('forecastAmount')" class="th-sortable text-end">見込み金額(円) <i :class="sortIcon('forecastAmount')"></i></th>
                                <th scope="col" @click="sortBy('actualAmount')" class="th-sortable text-end">実績金額(円) <i :class="sortIcon('actualAmount')"></i></th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="item in sortedInitiatives" :key="item.id"
                                tabindex="0" @keyup.enter="edit(item.id)" @click="edit(item.id)" style="cursor:pointer">
                                <td>{{ item.date }}</td>
                                <td>{{ item.department }}</td>
                                <td>{{ item.name }}</td>
                                <td>{{ item.title }}</td>
                                <td><span class="badge" :class="getCategoryClass(item.category)">{{ item.category }}</span></td>
                                <td>{{ item.content }}</td>
                                <td class="text-end">{{ formatCurrency(item.forecastAmount) }}</td>
                                <td class="text-end">{{ formatCurrency(item.actualAmount) }}</td>
                                <td class="text-nowrap">
                                    <button class="btn btn-sm btn-outline-secondary" @click.stop="copy(item.id)">複写</button>
                                </td>
                            </tr>
                            <tr v-if="sortedInitiatives.length === 0">
                                <td colspan="9" class="text-center">該当するデータがありません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="settings-template">
        <div>
            <h3 class="mb-3">設定</h3>
            <div class="mb-4">
                <label for="aboutText" class="form-label">業績アップ活動の説明</label>
                <textarea id="aboutText" class="form-control mb-2" rows="3" v-model="aboutInput"></textarea>
                <button class="btn btn-primary" @click="saveAbout" :disabled="root.isLoading.value">保存</button>
            </div>
            <div class="mb-4">
                <label class="form-label">デフォルト期間</label>
                <div class="row g-2">
                    <div class="col"><input type="date" class="form-control" v-model="defaultStartInput"></div>
                    <div class="col"><input type="date" class="form-control" v-model="defaultEndInput"></div>
                    <div class="col-auto"><button class="btn btn-primary" @click="saveDefaultPeriod" :disabled="root.isLoading.value">保存</button></div>
                </div>
            </div>
            <div class="mb-4">
                <h5 class="form-label">分類別目標金額 (円)</h5>
                <div v-for="c in root.categories.value" :key="c.id" class="input-group mb-2">
                    <span class="input-group-text">{{ c.name }}</span>
                    <input type="number" class="form-control" v-model.number="categoryGoalsInput[c.name]">
                </div>
                <button class="btn btn-primary" @click="saveCategoryGoals" :disabled="root.isLoading.value">保存</button>
            </div>
            <div class="accordion" id="settingsAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingDepartment">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDepartment" aria-expanded="false" aria-controls="collapseDepartment">
                        部門
                    </button>
                </h2>
                <div id="collapseDepartment" class="accordion-collapse collapse" aria-labelledby="headingDepartment" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <ul class="list-group mb-2">
                            <li class="list-group-item d-flex align-items-center" v-for="d in root.departments.value" :key="d.id">
                                <template v-if="editingDeptId === d.id">
                                    <clearable-input type="text" class="form-control me-2" v-model="editingDeptName"></clearable-input>
                                    <button class="btn btn-sm btn-primary me-1" @click="saveDepartment(d.id)" :disabled="root.isLoading.value">保存</button>
                                    <button class="btn btn-sm btn-secondary" @click="cancelDepartmentEdit" :disabled="root.isLoading.value">キャンセル</button>
                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ d.name || d }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startDepartmentEdit(d)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeDepartment(d.id)" :disabled="root.isLoading.value">削除</button>
                                </template>
                            </li>
                            <li class="list-group-item text-muted" v-if="root.departments.value.length === 0">部門が登録されていません。下のフォームから追加してください。</li>
                        </ul>
                        <form class="d-flex" @submit.prevent="addDepartment">
                            <clearable-input type="text" class="form-control me-2" v-model="newDepartment" placeholder="追加..."></clearable-input>
                            <button class="btn btn-primary" :disabled="root.isLoading.value">追加</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingName">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseName" aria-expanded="false" aria-controls="collapseName">
                        氏名
                    </button>
                </h2>
                <div id="collapseName" class="accordion-collapse collapse" aria-labelledby="headingName" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">

                    <div class="accordion-body">

                                </template>
                                <template v-else>
                                    <span class="me-auto">{{ c.name || c }}</span>
                                    <button class="btn btn-sm btn-outline-secondary me-1" @click="startCategoryEdit(c)" :disabled="root.isLoading.value">編集</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="removeCategory(c.id)" :disabled="root.isLoading.value">削除</button>

                        <form class="d-flex" @submit.prevent="addCategory">

        <div class="card">

    </script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import {
            getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, connectAuthEmulator
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import {
            getFirestore, collection, doc, getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
            query, where, writeBatch, serverTimestamp, connectFirestoreEmulator
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCbK53tWY8bduM9V6lDrCeHiXMrq0ncufo",
            authDomain: "gyoseki-dashboard-westa.firebaseapp.com",
            projectId: "gyoseki-dashboard-westa",
            storageBucket: "gyoseki-dashboard-westa.firebasestorage.app",
            messagingSenderId: "601752128597",
            appId: "1:601752128597:web:701d18c3db12cf417858dc"
        };
        // ログイン画面の「ユーザー名」を Firebase Authentication のメール/パスワード
        // プロバイダで扱うための疑似メールドメイン（実在するメールアドレスである必要はない）。
        const LOGIN_EMAIL_DOMAIN = 'gyoseki-up.local';

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // ローカル開発時は Firebase Emulator に接続。
        // ただし ?prod を付けると localhost でも本番の Auth/Firestore に接続する。
        const urlParams = new URLSearchParams(location.search);
        const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
        const useEmulators = isLocalhost && !urlParams.has('prod');
        if (useEmulators) {
            connectAuthEmulator(auth, `http://${location.hostname}:9099`, { disableWarnings: true });
            connectFirestoreEmulator(db, location.hostname, 8080);
        }

        if (window.ChartDataLabels) {
            Chart.register(ChartDataLabels);
        } else {
            console.warn('chartjs-plugin-datalabels が読み込まれていません。');
        }
        const { createApp, ref, computed, onMounted, watch, provide, inject, onBeforeUnmount, toRefs } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;
        const colorPalette = ['#0d6efd', '#dc3545', '#28a745', '#ffc107', '#6f42c1', '#d63384', '#fd7e14', '#198754', '#0dcaf0'];

        const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'ja');
        const SETTINGS_REF = () => doc(db, 'settings', 'app');
        const DEFAULT_ABOUT = '業績アップ活動とは、売上の向上やコスト削減など会社の収益性を高めるための取り組みの総称です。';
        const DEFAULT_CATEGORIES = ['粗利率改善', '固定費コントロール', '粗利額アップ'];

        // --- Components ---
        const Dashboard = {
            template: '#dashboard-template',
            setup() {
                const root = inject('root');
                const departmentChart = ref(null);
                let departmentChartInstance = null;
                const categoryPieRefs = ref({});
                const categoryPieInstances = {};

                const setCategoryPieRef = (id, el) => {
                    if (el) categoryPieRefs.value[id] = el;
                };

                const totalAmount = root.totalAmount;

                const categorySummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.category]) summary[item.category] = 0;
                        summary[item.category] += item.actualAmount;
                    });
                    return summary;
                });

                // 見込み金額 = 実績が未確定(0)の取り組みは見込み金額を、
                // 実績が確定している取り組みは実績金額を積み上げて算出する
                // (実績確定分を見込みに二重計上しないため)
                const categoryForecastSummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.category]) summary[item.category] = 0;
                        summary[item.category] += item.actualAmount > 0 ? item.actualAmount : item.forecastAmount;
                    });
                    return summary;
                });

                const departmentCategorySummary = computed(() => {
                    const summary = {};
                    root.initiatives.value.forEach(item => {
                        if (!summary[item.department]) summary[item.department] = {};
                        if (!summary[item.department][item.category]) summary[item.department][item.category] = 0;
                        summary[item.department][item.category] += item.actualAmount;
                    });
                    return summary;
                });

                const renderDepartmentChart = () => {
                    if (!departmentChart.value) return;
                    const labels = Object.keys(departmentCategorySummary.value);
                    const categoriesList = root.categories.value.map(c => c.name);
                    const datasets = categoriesList.map(cat => ({
                        label: cat,
                        data: labels.map(dept => (departmentCategorySummary.value[dept][cat] || 0)),
                        backgroundColor: root.categoryColorMap.value[cat]
                    }));
                    if (!departmentChartInstance) {
                        departmentChartInstance = new Chart(departmentChart.value.getContext('2d'), {
                            type: 'bar',
                            data: { labels, datasets },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: { x: { stacked: true }, y: { stacked: true } },
                                plugins: {
                                    legend: { position: 'top' },
                                    datalabels: {
                                        formatter: (value, ctx) => {
                                            const idx = ctx.dataIndex;
                                            const total = ctx.chart.data.datasets.reduce((sum, d) => sum + d.data[idx], 0);
                                            return total ? (value / total * 100).toFixed(1) + '%' : '';
                                        }
                                    }
                                }
                            }
                        });
                    } else {
                        departmentChartInstance.data.labels = labels;
                        departmentChartInstance.data.datasets = datasets;
                        departmentChartInstance.update();
                    }
                };

                const renderCategoryPies = () => {
                    const departments = Object.keys(departmentCategorySummary.value);
                    root.categories.value.forEach(c => {
                        const canvas = categoryPieRefs.value[c.id];
                        if (!canvas) return;
                        const data = departments.map(dept => departmentCategorySummary.value[dept][c.name] || 0);
                        const colors = departments.map((dept, idx) => colorPalette[idx % colorPalette.length]);
                        if (!categoryPieInstances[c.id]) {
                            categoryPieInstances[c.id] = new Chart(canvas.getContext('2d'), {
                                type: 'pie',
                                data: {
                                    labels: departments,
                                    datasets: [{ data, backgroundColor: colors }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: {
                                        legend: { position: 'top' },
                                        datalabels: {
                                            formatter: (value, ctx) => {
                                                const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                                                return total ? (value / total * 100).toFixed(1) + '%' : '';
                                            }
                                        }
                                    }
                                }
                            });
                        } else {
                            const inst = categoryPieInstances[c.id];
                            inst.data.labels = departments;
                            inst.data.datasets[0].data = data;
                            inst.data.datasets[0].backgroundColor = colors;
                            inst.update();
                        }
                    });
                };

                onMounted(() => {
                    renderDepartmentChart();
                    renderCategoryPies();
                });
                watch(root.initiatives, () => {
                    renderDepartmentChart();
                    renderCategoryPies();
                });
                // 分類マスタの読み込みタイミングによって円グラフ用canvasが後から追加されるため、
                // DOM更新後(flush: 'post')に描画する
                watch(() => root.categories.value.map(c => c.id).join(','), () => renderCategoryPies(), { flush: 'post' });
                onBeforeUnmount(() => {
                    if (departmentChartInstance) departmentChartInstance.destroy();
                    Object.values(categoryPieInstances).forEach(inst => inst.destroy());
                });

                return {
                    root, totalAmount, formatCurrency: root.formatCurrency,
                    departmentChart, categorySummary, categoryForecastSummary,
                    setCategoryPieRef,
                };
            }
        };

        const InitiativeForm = {
            template: '#initiative-form-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const route = VueRouter.useRoute();

                const newInitiative = ref({
                    department: '',
                    name: '',
                    title: '',
                    date: new Date().toISOString().slice(0, 10),
                    category: '粗利額アップ',
                    content: '',
                    forecastAmount: null,
                    actualAmount: null,
                });

                const forecastAmountInput = ref('');
                const actualAmountInput = ref('');

                // clearable-input はラップした<input>の@inputを内部の$emitより先に発火させるため、
                // ref経由(inputRef.value)で値を読むと1文字分古い値を参照してしまい、
                // 桁区切り再フォーマット時にカーソル位置がずれて数字が壊れる（例: 480000→4,8000）。
                // event.target を直接読み書きすることでこのズレを避け、カーソル位置も桁数基準で復元する。
                const makeAmountBinding = (field, inputRef) => {
                    watch(
                        () => newInitiative.value[field],
                        (val) => {
                            inputRef.value = val != null ? root.formatCurrency(val) : '';
                        },
                        { immediate: true }
                    );

                    return (event) => {
                        const target = event.target;
                        const cursor = target.selectionStart ?? target.value.length;
                        const digitsBeforeCursor = target.value.slice(0, cursor).replace(/\D/g, '').length;

                        const numeric = target.value.replace(/\D/g, '');
                        const val = numeric ? parseInt(numeric, 10) : null;
                        newInitiative.value[field] = val;

                        const formatted = val != null ? root.formatCurrency(val) : '';
                        target.value = formatted;
                        inputRef.value = formatted;

                        let newCursor = 0;
                        if (digitsBeforeCursor > 0) {
                            let seen = 0;
                            for (let i = 0; i < formatted.length; i++) {
                                if (/\d/.test(formatted[i])) seen++;
                                newCursor = i + 1;
                                if (seen === digitsBeforeCursor) break;
                            }
                        }
                        target.setSelectionRange(newCursor, newCursor);
                    };
                };

                const handleForecastAmountInput = makeAmountBinding('forecastAmount', forecastAmountInput);
                const handleActualAmountInput = makeAmountBinding('actualAmount', actualAmountInput);

                const isEdit = computed(() => !!route.params.id);

                onMounted(() => {
                    if (route.query.copy) {
                        const existing = root.initiatives.value.find(i => i.id === route.query.copy);
                        if (existing) {
                            const { id, ...rest } = existing;
                            newInitiative.value = { ...rest };
                        }
                    } else if (isEdit.value) {
                        const existing = root.initiatives.value.find(i => i.id === route.params.id);
                        if (existing) {
                            newInitiative.value = { ...existing };
                        }
                    } else {
                        // 新規登録: ログインユーザーに一致する社員があれば氏名・部門を初期選択。
                        // 一致しなければ未選択のまま。
                        const me = root.myProfile.value;
                        if (me) {
                            newInitiative.value.name = me.name || '';
                            if (me.department) newInitiative.value.department = me.department;
                        }
                    }
                });

                const submit = async () => {
                    if (isEdit.value) {
                        await root.updateInitiative(route.params.id, newInitiative.value);
                    } else {
                        await root.submitInitiative(newInitiative.value);
                    }
                    await router.push('/list');
                };

                const remove = async () => {
                    if (!isEdit.value) return;
                    if (!confirm('本当に削除しますか？')) return;
                    await root.deleteInitiative(route.params.id);
                    await router.push('/list');
                };

                return { newInitiative, submit, isEdit, remove, root, forecastAmountInput, actualAmountInput, handleForecastAmountInput, handleActualAmountInput };
            }
        };

        const InitiativeList = {
            template: '#initiative-list-template',
            setup() {
                const root = inject('root');
                const router = VueRouter.useRouter();
                const filters = ref({ name: '', department: '', category: '' });
                const sortByColumn = ref('date');
                const sortDirection = ref('desc');

                const safeLower = v => (v ?? '').toString().toLowerCase();

                const filteredInitiatives = computed(() => {
                    return root.initiatives.value.filter(item => {
                        const nameMatch = safeLower(item.name).includes(safeLower(filters.value.name));
                        const depMatch = safeLower(item.department).includes(safeLower(filters.value.department));
                        const catMatch = filters.value.category ? item.category === filters.value.category : true;
                        return nameMatch && depMatch && catMatch;
                    });
                });

                const cmp = (a, b) => (a > b) - (a < b);
                const toKey = (val, col) => {
                    if (col === 'date') return new Date(val || 0).getTime();
                    if (typeof val === 'number') return val;
                    const num = Number(val);
                    return Number.isFinite(num) ? num : (val ?? '').toString();
                };

                const sortedInitiatives = computed(() => {
                    const col = sortByColumn.value;
                    const dir = sortDirection.value === 'asc' ? 1 : -1;
                    return [...filteredInitiatives.value].sort((a, b) =>
                        dir * cmp(toKey(a[col], col), toKey(b[col], col))
                    );
                });

                const sortBy = (column) => {
                    if (sortByColumn.value === column) {
                        sortDirection.value = sortDirection.value === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortByColumn.value = column;
                        sortDirection.value = 'desc';
                    }
                };

                const sortIcon = (column) => {
                    if (sortByColumn.value !== column) return 'bi bi-arrow-down-up';
                    return sortDirection.value === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
                };

                const resetFilters = () => {
                    filters.value = { name: '', department: '', category: '' };
                };

                const edit = (id) => {
                    router.push(`/form/${id}`);
                };

                const copy = (id) => {
                    router.push({ path: '/form', query: { copy: id } });
                };

                const exportCsv = () => {
                    const headers = ['実施日', '部門', '氏名', 'タイトル', '分類', '内容', '見込み金額', '実績金額'];
                    const rows = sortedInitiatives.value.map(item => [
                        item.date,
                        item.department,
                        item.name,
                        item.title,
                        item.category,
                        item.content,
                        item.forecastAmount,
                        item.actualAmount
                    ]);
                    const csvContent = [headers, ...rows]
                        .map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                        .join('\r\n');
                    const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'initiatives.csv';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                };

                return {
                    root,
                    filters,
                    sortBy,
                    sortIcon,
                    sortedInitiatives,
                    resetFilters,
                    edit,
                    copy,
                    exportCsv,
                    getCategoryClass: root.getCategoryClass,
                    formatCurrency: root.formatCurrency
                };
            }
        };

        const Settings = {
            template: '#settings-template',
            setup() {
                const root = inject('root');
                  const newDepartment = ref('');
                  const newName = ref('');
                  const namesFile = ref(null);
                  const newCategory = ref('');
                  const aboutInput = ref(root.aboutText.value);
                  watch(root.aboutText, v => (aboutInput.value = v));
                  const defaultStartInput = ref(root.defaultStart.value);
                  watch(root.defaultStart, v => (defaultStartInput.value = v));
                  const defaultEndInput = ref(root.defaultEnd.value);
                  watch(root.defaultEnd, v => (defaultEndInput.value = v));
                  const categoryGoalsInput = ref({ ...root.categoryGoals.value });
                  watch(root.categoryGoals, v => (categoryGoalsInput.value = { ...v }));

                  const editingDeptId = ref(null);
                  const editingDeptName = ref('');
                  const editingNameId = ref(null);
                  const editingNameName = ref('');
                  const editingCategoryId = ref(null);
                  const editingCategoryName = ref('');

                  const addDepartment = async () => {
                      if (!newDepartment.value) return;
                      await root.addDepartment(newDepartment.value);
                      newDepartment.value = '';
                  };

                  const startDepartmentEdit = (d) => {
                      editingDeptId.value = d.id;
                      editingDeptName.value = d.name || d;
                  };
                  const cancelDepartmentEdit = () => {
                      editingDeptId.value = null;
                      editingDeptName.value = '';
                  };
                  const saveDepartment = async (id) => {
                      if (!editingDeptName.value) return;
                      await root.updateDepartment(id, editingDeptName.value);
                      cancelDepartmentEdit();
                  };
                  const removeDepartment = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteDepartment(id);
                  };

                  const addName = async () => {
                      if (!newName.value) return;
                      await root.addName(newName.value);
                      newName.value = '';
                  };
                  const startNameEdit = (n) => {
                      editingNameId.value = n.id;
                      editingNameName.value = n.name || n;
                  };
                  const cancelNameEdit = () => {
                      editingNameId.value = null;
                      editingNameName.value = '';
                  };
                  const saveName = async (id) => {
                      if (!editingNameName.value) return;
                      await root.updateName(id, editingNameName.value);
                      cancelNameEdit();
                  };
                  const removeName = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteName(id);
                  };

                  const importNamesCsv = async () => {
                      const file = namesFile.value?.files[0];
                      if (!file) return;
                      await root.importNames(file);
                      namesFile.value.value = '';
                  };

                  const addCategory = async () => {
                      if (!newCategory.value) return;
                      await root.addCategory(newCategory.value);
                      newCategory.value = '';
                  };
                  const startCategoryEdit = (c) => {
                      editingCategoryId.value = c.id;
                      editingCategoryName.value = c.name || c;
                  };
                  const cancelCategoryEdit = () => {
                      editingCategoryId.value = null;
                      editingCategoryName.value = '';
                  };
                  const saveCategory = async (id) => {
                      if (!editingCategoryName.value) return;
                      await root.updateCategory(id, editingCategoryName.value);
                      cancelCategoryEdit();
                  };
                  const removeCategory = async (id) => {
                      if (!confirm('削除しますか？')) return;
                      await root.deleteCategory(id);
                  };

                  const saveAbout = async () => {
                      await root.updateAbout(aboutInput.value || '');
                  };
                  const saveDefaultPeriod = async () => {
                      await root.updateDefaultPeriod(defaultStartInput.value, defaultEndInput.value);
                  };
                  const saveCategoryGoals = async () => {
                      await root.updateCategoryGoals(categoryGoalsInput.value);
                  };

                  return {
                      root,
                      newDepartment,
                      newName,
                      namesFile,
                      newCategory,
                      aboutInput,
                      defaultStartInput,
                      defaultEndInput,
                      categoryGoalsInput,
                      editingDeptId,
                      editingDeptName,
                      editingNameId,
                      editingNameName,
                      editingCategoryId,
                      editingCategoryName,
                      addDepartment,
                      startDepartmentEdit,
                      cancelDepartmentEdit,
                      saveDepartment,
                      removeDepartment,
                      addName,
                      startNameEdit,
                      cancelNameEdit,
                      saveName,
                      removeName,
                      importNamesCsv,
                      addCategory,
                      startCategoryEdit,
                      cancelCategoryEdit,
                      saveCategory,
                      removeCategory,
                      saveAbout,
                      saveDefaultPeriod,
                      saveCategoryGoals
                  };
            }
        };

        const About = {
            template: '#about-template',
            setup() {
                const root = inject('root');
                return { root };
            }
        };

        // --- Router ---
        const routes = [
            { path: '/', component: Dashboard },
            { path: '/form/:id?', component: InitiativeForm },
            { path: '/list', component: InitiativeList },
            { path: '/about', component: About },
            { path: '/settings', component: Settings },
        ];
        const router = createRouter({
            history: createWebHashHistory(),
            routes,
            linkActiveClass: 'active'
        });

        // --- Main App ---
        const app = createApp({
            setup() {
                const user = ref(null);
                const authReady = ref(false);
                const authError = ref('');
                const loginUsername = ref('');
                const loginPassword = ref('');

                const initiatives = ref([]);
                const departments = ref([]);
                const names = ref([]);
                const categories = ref([]);
                const aboutText = ref('');
                const categoryGoals = ref({});
                const defaultStart = ref('');
                const defaultEnd = ref('');
                const filterStart = ref('');
                const filterEnd = ref('');

                const categoryColorMap = computed(() => {
                    const map = {};
                    categories.value.forEach((c, idx) => {
                        map[c.name] = colorPalette[idx % colorPalette.length];
                    });
                    return map;
                });

                const totalAmount = computed(() =>
                    initiatives.value.reduce((sum, item) => sum + item.actualAmount, 0)
                );

                // ログイン中ユーザーのプロフィール（氏名・部門、新規登録の初期値に使う）。
                // users/{uid} はアカウント作成時に管理者スクリプト(tools/manage_users.py)が書き込む。
                const myProfileDoc = ref(null);
                const myProfile = computed(() => myProfileDoc.value);

                const loadingCount = ref(0);
                const isLoading = computed(() => loadingCount.value > 0);
                const withLoading = async (fn) => {
                    loadingCount.value++;
                    try {
                        await fn();
                    } finally {
                        loadingCount.value--;
                    }
                };

                // --- Firestore helpers ---
                const colRef = (name) => collection(db, name);

                const loadCollection = async (name) => {
                    const snap = await getDocs(colRef(name));
                    return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName);
                };

                const queryInitiatives = async (start, end) => {
                    const clauses = [];
                    if (start) clauses.push(where('date', '>=', start));
                    if (end) clauses.push(where('date', '<=', end));
                    const q = clauses.length ? query(colRef('initiatives'), ...clauses) : colRef('initiatives');
                    const snap = await getDocs(q);
                    // 旧「金額」フィールド（amount）のみを持つ既存データは実績金額として扱う
                    return snap.docs.map(d => {
                        const data = d.data();
                        return {
                            id: d.id,
                            ...data,
                            forecastAmount: data.forecastAmount ?? 0,
                            actualAmount: data.actualAmount ?? data.amount ?? 0,
                        };
                    });
                };

                // 初回アクセス時に分類マスタと設定ドキュメントを初期化
                const seedIfEmpty = async () => {
                    const settingsSnap = await getDoc(SETTINGS_REF());
                    if (!settingsSnap.exists()) {
                        await setDoc(SETTINGS_REF(), {
                            about_text: DEFAULT_ABOUT,
                            default_start: '',
                            default_end: '',
                            category_goals: {}
                        });
                    }
                    const catSnap = await getDocs(colRef('categories'));
                    if (catSnap.empty) {
                        const batch = writeBatch(db);
                        DEFAULT_CATEGORIES.forEach(name => {
                            batch.set(doc(colRef('categories')), { name });
                        });
                        await batch.commit();
                    }
                };

                const fetchBootstrap = async () => {
                    await withLoading(async () => {
                        try {
                            await seedIfEmpty();
                            const settingsSnap = await getDoc(SETTINGS_REF());
                            const s = settingsSnap.exists() ? settingsSnap.data() : {};
                            aboutText.value = s.about_text || '';
                            categoryGoals.value = s.category_goals || {};
                            defaultStart.value = s.default_start || '';
                            defaultEnd.value = s.default_end || '';
                            if (!filterStart.value) filterStart.value = defaultStart.value;
                            if (!filterEnd.value) filterEnd.value = defaultEnd.value;

                            const [inits, deps, nms, cats, profileSnap] = await Promise.all([
                                queryInitiatives(filterStart.value, filterEnd.value),
                                loadCollection('departments'),
                                loadCollection('names'),
                                loadCollection('categories'),
                                user.value ? getDoc(doc(db, 'users', user.value.uid)) : null,
                            ]);
                            initiatives.value = inits;
                            departments.value = deps;
                            names.value = nms;
                            categories.value = cats;
                            myProfileDoc.value = profileSnap && profileSnap.exists() ? profileSnap.data() : null;
                        } catch (error) {
                            console.error('Error fetching bootstrap data:', error);
                        }
                    });
                };

                const fetchInitiatives = async () => {
                    await withLoading(async () => {
                        try {
                            initiatives.value = await queryInitiatives(filterStart.value, filterEnd.value);
                        } catch (error) {
                            console.error('Error fetching initiatives:', error);
                        }
                    });
                };

                const fetchDepartments = async () => {
                    await withLoading(async () => {
                        try {
                            departments.value = await loadCollection('departments');
                        } catch (error) {
                            console.error('Error fetching departments:', error);
                        }
                    });
                };

                const fetchNames = async () => {
                    await withLoading(async () => {
                        try {
                            names.value = await loadCollection('names');
                        } catch (error) {
                            console.error('Error fetching names:', error);
                        }
                    });
                };

                const fetchCategories = async () => {
                    await withLoading(async () => {
                        try {
                            categories.value = await loadCollection('categories');
                        } catch (error) {
                            console.error('Error fetching categories:', error);
                        }
                    });
                };

                const updateDefaultPeriod = async (start, end) => {
                    await withLoading(async () => {
                        try {
                            await setDoc(SETTINGS_REF(), { default_start: start || '', default_end: end || '' }, { merge: true });
                            defaultStart.value = start;
                            defaultEnd.value = end;
                            filterStart.value = start;
                            filterEnd.value = end;
                        } catch (error) {
                            console.error('Error updating default period:', error);
                        }
                    });
                };

                const updateAbout = async (text) => {
                    await withLoading(async () => {
                        try {
                            await setDoc(SETTINGS_REF(), { about_text: text }, { merge: true });
                            aboutText.value = text;
                        } catch (error) {
                            console.error('Error updating about text:', error);
                        }
                    });
                };

                const updateCategoryGoals = async (goals) => {
                    await withLoading(async () => {
                        try {
                            const clean = {};
                            Object.entries(goals || {}).forEach(([k, v]) => {
                                clean[k] = Number(v) || 0;
                            });
                            await setDoc(SETTINGS_REF(), { category_goals: clean }, { merge: true });
                            categoryGoals.value = clean;
                        } catch (error) {
                            console.error('Error updating category goals:', error);
                        }
                    });
                };

                const pickInitiative = (data) => ({
                    department: data.department,
                    name: data.name,
                    title: data.title,
                    date: data.date,
                    category: data.category,
                    content: data.content,
                    forecastAmount: parseInt(data.forecastAmount, 10) || 0,
                    actualAmount: parseInt(data.actualAmount, 10) || 0,
                });

                const submitInitiative = async (newInitiative) => {
                    await withLoading(async () => {
                        try {
                            await addDoc(colRef('initiatives'), {
                                ...pickInitiative(newInitiative),
                                createdAt: serverTimestamp(),
                            });
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error submitting initiative:', error);
                        }
                    });
                };

                const updateInitiative = async (id, updated) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, 'initiatives', id), pickInitiative(updated));
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error updating initiative:', error);
                        }
                    });
                };

                const deleteInitiative = async (id) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, 'initiatives', id));
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error deleting initiative:', error);
                        }
                    });
                };

                // --- マスタ (部門・氏名・分類) 共通処理 ---
                const addMasterItem = async (colName, name, listRef, refetch) => {
                    await withLoading(async () => {
                        try {
                            if (listRef.value.some(item => item.name === name)) {
                                alert('既に登録されています: ' + name);
                                return;
                            }
                            await addDoc(colRef(colName), { name });
                            await refetch();
                        } catch (error) {
                            console.error(`Error adding to ${colName}:`, error);
                        }
                    });
                };

                const updateMasterItem = async (colName, id, name, refetch) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, colName, id), { name });
                            await refetch();
                        } catch (error) {
                            console.error(`Error updating ${colName}:`, error);
                        }
                    });
                };

                const deleteMasterItem = async (colName, id, refetch) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, colName, id));
                            await refetch();
                        } catch (error) {
                            console.error(`Error deleting from ${colName}:`, error);
                        }
                    });
                };

                const addDepartment = (name) => addMasterItem('departments', name, departments, fetchDepartments);
                const updateDepartment = (id, name) => updateMasterItem('departments', id, name, fetchDepartments);
                const deleteDepartment = (id) => deleteMasterItem('departments', id, fetchDepartments);

                const addName = (name) => addMasterItem('names', name, names, fetchNames);
                const updateName = (id, name) => updateMasterItem('names', id, name, fetchNames);
                const deleteName = (id) => deleteMasterItem('names', id, fetchNames);

                const addCategory = (name) => addMasterItem('categories', name, categories, fetchCategories);
                const updateCategory = (id, name) => updateMasterItem('categories', id, name, fetchCategories);
                const deleteCategory = (id) => deleteMasterItem('categories', id, fetchCategories);

                const importNames = async (file) => {
                    await withLoading(async () => {
                        try {
                            const text = (await file.text()).replace(/^﻿/, '');
                            const existing = new Set(names.value.map(n => n.name));
                            const toAdd = [];
                            text.split(/\r?\n/).forEach(line => {
                                if (!line.trim()) return;
                                let name = line.split(',')[0].trim();
                                name = name.replace(/^"(.*)"$/, '$1').trim();
                                if (name && !existing.has(name)) {
                                    existing.add(name);
                                    toAdd.push(name);
                                }
                            });
                            // Firestore のバッチ書き込みは1回500件まで
                            for (let i = 0; i < toAdd.length; i += 450) {
                                const batch = writeBatch(db);
                                toAdd.slice(i, i + 450).forEach(name => {
                                    batch.set(doc(colRef('names')), { name });
                                });
                                await batch.commit();
                            }
                            await fetchNames();
                        } catch (error) {
                            console.error('Error importing names:', error);
                        }
                    });
                };

                const formatCurrency = (value) => new Intl.NumberFormat('ja-JP').format(value);

                const getCategoryClass = (category) => {
                    switch (category) {
                        case '粗利率改善': return 'bg-warning text-dark';
                        case '固定費コントロール': return 'bg-danger';
                        case '粗利額アップ': return 'bg-success';
                        default: return 'bg-secondary';
                    }
                };

                const hideOffcanvas = () => {
                    const el = document.getElementById('offcanvasNav');
                    if (!el) return;
                    let instance = bootstrap.Offcanvas.getInstance(el);
                    if (!instance) instance = new bootstrap.Offcanvas(el);
                    instance.hide();
                };

                // --- Auth ---
                const login = async () => {
                    authError.value = '';
                    const username = loginUsername.value.trim();
                    if (!username || !loginPassword.value) return;
                    try {
                        const pseudoEmail = `${username.toLowerCase()}@${LOGIN_EMAIL_DOMAIN}`;
                        await signInWithEmailAndPassword(auth, pseudoEmail, loginPassword.value);
                        loginPassword.value = '';
                    } catch (error) {
                        console.error('Login error:', error);
                        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                            authError.value = 'ユーザー名またはパスワードが正しくありません。';
                        } else {
                            authError.value = 'ログインに失敗しました: ' + (error.message || error.code || error);
                        }
                    }
                };

                const logout = async () => {
                    await signOut(auth);
                };

                onAuthStateChanged(auth, async (u) => {
                    user.value = u;
                    authReady.value = true;
                    if (u) {
                        await fetchBootstrap();
                    } else {
                        initiatives.value = [];
                        departments.value = [];
                        names.value = [];
                        categories.value = [];
                        myProfileDoc.value = null;
                    }
                });

                // Provide shared state and methods to all components
                  provide('root', {
                      initiatives,
                      departments,
                      names,
                      categories,
                      aboutText,
                      categoryGoals,
                      defaultStart,
                      defaultEnd,
                      filterStart,
                      filterEnd,
                      fetchInitiatives,
                      submitInitiative,
                      updateInitiative,
                      deleteInitiative,
                      fetchDepartments,
                      fetchNames,
                      fetchCategories,
                      addDepartment,
                      addName,
                      importNames,
                      addCategory,
                      updateDepartment,
                      deleteDepartment,
                      updateName,
                      deleteName,
                      updateCategory,
                      deleteCategory,
                      updateAbout,
                      updateDefaultPeriod,
                      updateCategoryGoals,
                      formatCurrency,
                      getCategoryClass,
                      isLoading,
                      categoryColorMap,
                      totalAmount,
                      myProfile
                  });

                  return { initiatives, hideOffcanvas, isLoading, filterStart, filterEnd, fetchInitiatives, user, myProfile, authReady, authError, loginUsername, loginPassword, login, logout };
            }
        });

        app.component('tom-select', {
            inheritAttrs: false,
            props: {
                modelValue: String,
                options: Array
            },
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const selectRef = ref(null);
                let ts;

                const updateOptions = (opts = []) => {
                    if (ts) {
                        ts.clearOptions();
                        ts.addOptions(opts.map(o => ({ value: o, text: o })));
                        ts.refreshOptions(false);
                    }
                };

                onMounted(() => {
                    ts = new TomSelect(selectRef.value, {
                        create: true,
                        plugins: ['clear_button'],
                        placeholder: attrs.placeholder || '',
                        onChange(value) {
                            emit('update:modelValue', value);
                        }
                    });
                    updateOptions(props.options);
                    if (props.modelValue) {
                        ts.setValue(props.modelValue);
                    }
                });

                watch(() => props.options, (opts) => {
                    updateOptions(opts);
                }, { deep: true });

                watch(() => props.modelValue, (val) => {
                    if (ts && ts.getValue() !== val) {
                        ts.setValue(val || '');
                    }
                });

                onBeforeUnmount(() => {
                    if (ts) ts.destroy();
                });

                return { selectRef, attrs };
            },
            template: `<select ref="selectRef" v-bind="attrs"></select>`
        });

        app.component('clearable-input', {
            inheritAttrs: false,
            props: ['modelValue'],
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const inputClass = computed(() => [attrs.class, 'pe-4'].filter(Boolean).join(' '));
                const clear = () => emit('update:modelValue', '');
                return { attrs, inputClass, clear };
            },
            template: `
                <div class="position-relative">
                    <input v-bind="attrs" :class="inputClass" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)">
                    <button v-if="modelValue" type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" aria-label="Clear" @click="clear"></button>
                </div>
            `
        });

        app.component('date-filter', {
            template: '#date-filter-template',
            props: {
                startCol: { type: Number, default: 3 },
                endCol: { type: Number, default: 3 },
                buttonCol: { type: Number, default: 3 }
            },
            setup(props, { emit }) {
                const root = inject('root');
                const { startCol, endCol, buttonCol } = toRefs(props);
                const reset = () => {
                    root.filterStart.value = '';
                    root.filterEnd.value = '';
                    root.fetchInitiatives();
                    emit('reset');
                };
                return { root, reset, startCol, endCol, buttonCol };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
