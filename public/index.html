<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業績アップ取り組みダッシュボード</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6efd'/%3E%3Cpath d='M7 21 L13 14 L18 18 L25 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 8 H25 V13' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Tom Select CSS (Bootstrap 5 theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 500;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .th-sortable {
            cursor: pointer;
            user-select: none;
        }
        .th-sortable:hover {
            background-color: #f8f9fa;
        }
        .resizable-table {
            table-layout: fixed;
            /* border-collapse: collapse のままだとセルのbox-shadowが描画されないため、
               固定列の影を表示するには separate にする必要がある（罫線は片側だけなので二重線にはならない）。 */
            border-collapse: separate;
            border-spacing: 0;
        }
        .resizable-table th,
        .resizable-table td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 内容列は省略せず、列幅の中で折り返して全文を表示する */
        .resizable-table td.col-wrap {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            word-break: break-word;
        }
        .resizable-table th {
            position: relative;
        }
        /* リアクション・コメント列は横スクロールしても常に右端に表示されるよう固定する */
        .resizable-table th.col-sticky-right,
        .resizable-table td.col-sticky-right {
            position: sticky;
            right: 0;
            background-color: #fff;
        }
        .resizable-table th.col-sticky-right {
            z-index: 2;
        }
        .resizable-table td.col-sticky-right {
            z-index: 1;
        }
        /* この列の下に隠れている列がある間だけ影を出し、固定されていることを分かりやすくする。
           box-shadowはぼかしの分だけ上下にもにじんでしまうため、セルの高さぴったりに収まる
           グラデーションの疑似要素を左側にだけ重ねる方式にする。 */
        #tutorialTable.has-hidden-columns .resizable-table th.col-sticky-right::before,
        #tutorialTable.has-hidden-columns .resizable-table td.col-sticky-right::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -8px;
            width: 8px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.12), transparent);
            pointer-events: none;
        }
        /* リアクションボタンを折り返して表示できるようにする */
        .resizable-table td.col-sticky-right {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }
        .table-hover tbody tr:hover td.col-sticky-right {
            background-color: #e9ecef;
        }
        /* リアクションのアイコンは枠・背景なしのフラットな見た目にする（押した状態は色のみで示す） */
        .reaction-btn {
            border: none;
            background: transparent;
            color: #6c757d;
        }
        .reaction-btn:hover:not(:disabled),
        .reaction-btn:focus {
            background: transparent;
            color: #495057;
        }
        .reaction-btn.active {
            color: #0d6efd;
            font-weight: 600;
        }
        /* 一覧の「スタンプ」ボタン：アイコンとテキストをまとめて1つのボタンとして扱い、
           左端は隣接するコメント数と揃うようにパディング分を負のマージンで打ち消す。
           ホバー時はグレーに沈んだ（へこんだ）見た目にしてボタンだと分かるようにする。 */
        .stamp-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            font-size: inherit;
            padding: 0.1rem 0.35rem !important;
            margin-left: -0.35rem;
            border-radius: 0.375rem;
        }
        .stamp-btn:hover:not(:disabled) {
            /* 行全体のホバー色（#e9ecef）と同じ濃さに揃える */
            background-color: #e9ecef;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
            color: #495057;
        }
        /* リアクション選択ポップアップを吹き出し（トークバブル）の形にする */
        .reaction-picker-popup {
            border-radius: 0.75rem;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        }
        .reaction-picker-popup::after {
            content: '';
            position: absolute;
            top: -6px;
            right: 16px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid #fff;
            filter: drop-shadow(0 -1px 1px rgba(0, 0, 0, 0.08));
        }
        /* ボタンの下に開くと画面外に出てしまう場合はボタンの上に開くため、
           しっぽの向きも下向きに反転させる */
        .reaction-picker-popup--up::after {
            top: auto;
            bottom: -6px;
            border-bottom: none;
            border-top: 6px solid #fff;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.08));
        }
        /* 絵文字は普段は少しグレーがかった控えめな見た目にし、ホバーではっきり表示する
           （すでに押したリアクションは常にはっきり表示したままにする） */
        .reaction-picker-popup .btn {
            font-size: 1.25rem;
            filter: grayscale(0.7) opacity(0.6);
            transition: filter 0.15s ease;
        }
        .reaction-picker-popup .btn:hover:not(:disabled),
        .reaction-picker-popup .btn.active {
            filter: none;
        }
        /* コメント欄をチャットアプリ風の見た目にする */
        .chat-thread {
            background-color: #f0f2f5;
            border-radius: 0.75rem;
            padding: 0.75rem;
        }
        .chat-message {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .chat-message + .chat-message {
            margin-top: 0.5rem;
        }
        .chat-avatar {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-bubble {
            background-color: #fff;
            border-radius: 0.75rem;
            padding: 0.4rem 0.6rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            min-width: 0;
        }
        .chat-bubble-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0d6efd;
        }
        .chat-bubble-time {
            font-size: 0.7rem;
            color: #adb5bd;
        }
        .chat-message-actions {
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .chat-message:hover .chat-message-actions {
            opacity: 1;
        }
        .chat-name-input {
            max-width: 165px;
            flex-shrink: 0;
        }
        .chat-send-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            flex-shrink: 0;
        }
        .chat-textarea {
            resize: none;
            border-radius: 1.25rem;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .col-resizer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
        }
        .col-resizer:hover,
        .col-resizer.resizing {
            background-color: rgba(13, 110, 253, .35);
        }
        /* モーダルの幅・高さをウィンドウサイズに応じて可変にする
           （Bootstrapの固定ブレークポイントではなく、vw/vh基準で連続的に変化させる） */
        .modal-dialog {
            width: min(92vw, 700px);
            max-width: min(92vw, 700px);
        }
        .modal-dialog.modal-lg {
            width: min(92vw, 1000px);
            max-width: min(92vw, 1000px);
        }
        .modal-content {
            max-height: calc(100vh - 3.5rem);
            overflow: hidden;
        }
        /* modal-header/body/footer を <form> で包んでいるモーダルでは、
           Bootstrapのflex連鎖が<form>で途切れるため、formもflex列として中継させる */
        .modal-content > form {
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1 1 auto;
        }
        .modal-body {
            overflow-y: auto;
            min-height: 0;
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
        .nav-link.active {
            font-weight: 700;
            background-color: #e9ecef;
            border-radius: 0.25rem;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
        /* スマホ幅ではヘッダーのタイトルを1行に収まるサイズへ縮小する */
        @media (max-width: 767.98px) {
            .navbar-brand {
                font-size: 0.95rem;
                white-space: nowrap;
            }
        }
        /* 初回チュートリアル（スポットライト方式のガイド） */
        .tutorial-mask {
            position: fixed;
            background: rgba(15, 23, 42, 0.6);
            z-index: 2100;
        }
        .tutorial-highlight {
            position: fixed;
            z-index: 2101;
            border-radius: 8px;
            box-shadow: 0 0 0 3px #0d6efd, 0 0 18px rgba(13, 110, 253, .6);
            pointer-events: none;
        }
        .tutorial-popover {
            position: fixed;
            z-index: 2102;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
            padding: 1rem 1.15rem;
            width: min(90vw, 340px);
        }
        .tutorial-popover h6 {
            font-weight: 700;
            margin-bottom: .5rem;
        }
        .tutorial-popover p {
            font-size: .9rem;
            margin-bottom: .5rem;
            white-space: pre-line;
        }
        .tutorial-step-badge {
            font-size: .75rem;
            color: #6c757d;
            margin-bottom: .35rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <template v-if="user">
            <!-- Offcanvas Navigation -->
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavLabel">メニュー</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <router-link to="/" class="nav-link" active-class="active" exact-active-class="active" @click="hideOffcanvas"><i class="bi bi-list-task me-2"></i>実績一覧</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/settings" class="nav-link" active-class="active" @click="hideOffcanvas"><i class="bi bi-gear me-2"></i>設定</router-link>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" @click.prevent="replayTutorial"><i class="bi bi-question-circle me-2"></i>チュートリアル</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Header -->
            <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
                <div class="container-fluid">
                    <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav" aria-controls="offcanvasNav">
                        <i class="bi bi-list"></i>
                    </button>
                    <a class="navbar-brand mx-auto" href="#">
                        業績アップ取り組みダッシュボード
                    </a>
                    <button class="btn btn-light" type="button" @click="logout" title="ログアウト">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="container-fluid p-4">
                <router-view v-slot="{ Component }">
                    <transition name="fade" mode="out-in">
                        <component :is="Component" />
                    </transition>
                </router-view>
            </main>
        </template>

        <!-- Login Screen -->
        <div v-else-if="authReady" class="login-wrap">
            <div class="card login-card">
                <div class="card-body p-4">
                    <h5 class="mb-1 text-center">業績アップ取り組みダッシュボード</h5>
                    <p class="text-muted mb-4 text-center">パスワードを入力してログインしてください</p>
                    <form @submit.prevent="login">
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">パスワード</label>
                            <input id="loginPassword" type="password" class="form-control" v-model="loginPassword" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" :disabled="isLoading">ログイン</button>
                    </form>
                    <div v-if="authError" class="alert alert-danger mt-3 mb-0 text-start" style="font-size: .85rem;">{{ authError }}</div>
                </div>
            </div>
        </div>

        <div v-if="!authReady || isLoading" class="loading-overlay" aria-live="polite" aria-busy="true">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" aria-label="読み込み中"></div>
            </div>
        </div>

        <!-- 初回チュートリアル -->
        <template v-if="tutorial.active">
            <div class="tutorial-mask" :style="tutorial.maskStyle.top"></div>
            <div class="tutorial-mask" :style="tutorial.maskStyle.bottom"></div>
            <div class="tutorial-mask" :style="tutorial.maskStyle.left"></div>
            <div class="tutorial-mask" :style="tutorial.maskStyle.right"></div>
            <div class="tutorial-highlight" v-if="tutorial.hasTarget" :style="tutorial.highlightStyle"></div>
            <div class="tutorial-popover" ref="tutorialPopoverRef" :style="tutorial.popoverStyle">
                <div class="tutorial-step-badge">ステップ {{ tutorial.stepIndex + 1 }} / {{ TUTORIAL_STEPS.length }}</div>
                <h6>{{ tutorialCurrentStep.title }}</h6>
                <p>{{ tutorialCurrentStep.description }}</p>
                <div v-if="tutorialCurrentStep.action === 'click'" class="small text-primary fw-bold mb-2">
                    <i class="bi bi-hand-index-thumb me-1"></i>ハイライトされた箇所をクリックして進みます
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <button type="button" class="btn btn-sm btn-link text-muted p-0" @click="skipTutorial">スキップ</button>
                    <button v-if="tutorialCurrentStep.action !== 'click'" type="button" class="btn btn-sm btn-primary" @click="nextTutorialStep">
                        {{ tutorialIsLast ? '閉じる' : '次へ' }}
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Vue.js, Vue Router, Bootstrap JS from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

    <!-- Component Templates -->
    <script type="text/x-template" id="date-filter-template">
        <div class="row g-3 mb-4">
            <div :class="`col-md-${startCol}`">
                <label class="form-label">開始日</label>
                <clearable-input type="date" class="form-control" v-model="root.filterStart.value"></clearable-input>
            </div>
            <div :class="`col-md-${endCol}`">
                <label class="form-label">終了日</label>
                <clearable-input type="date" class="form-control" v-model="root.filterEnd.value"></clearable-input>
            </div>
            <div :class="`col-md-${buttonCol} d-flex align-items-end`">
                <button class="btn btn-primary me-2" @click="root.fetchInitiatives()">適用</button>
                <button class="btn btn-secondary" @click="reset">リセット</button>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="initiative-list-template">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                取り組み実績一覧
                <div class="d-flex">
                    <button class="btn btn-outline-secondary me-2 d-none d-md-inline-block" @click="exportCsv">
                        <i class="bi bi-download me-1"></i>CSVエクスポート
                    </button>
                    <button id="tutorialAddBtn" type="button" class="btn btn-primary" @click="openAddModal">
                        <i class="bi bi-plus-lg me-1"></i><span class="d-none d-md-inline">新規登録</span><span class="d-inline d-md-none">新規</span>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <!-- Filters -->
                <button class="btn btn-outline-secondary d-md-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#searchFilters" aria-expanded="false" aria-controls="searchFilters">
                    <i class="bi bi-funnel me-1"></i>検索条件
                </button>
                <div class="collapse d-md-block" id="searchFilters">
                <date-filter :start-col="2" :end-col="2" :button-col="2" @reset="resetFilters"></date-filter>
                <div class="row g-3 mb-4">
                    <div class="col-md-2">
                        <label for="filterName" class="form-label">氏名</label>
                        <tom-select id="filterName" class="form-select" :options="root.names.value.map(n => n.name)" v-model="filters.name" placeholder="氏名で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterCompany" class="form-label">社</label>
                        <tom-select id="filterCompany" class="form-select" :options="root.companies.value.map(c => c.name)" v-model="filters.company" placeholder="社で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterSection" class="form-label">課</label>
                        <tom-select id="filterSection" class="form-select" :options="root.sections.value.map(s => s.name)" v-model="filters.section" placeholder="課で検索..."></tom-select>
                    </div>
                    <div class="col-md-2">
                        <label for="filterCategory" class="form-label">分類</label>
                        <select id="filterCategory" class="form-select" v-model="filters.category">
                            <option value="">すべて</option>
                            <option v-for="c in root.categories.value" :key="c.id" :value="c.name">{{ c.name }}</option>
                        </select>
                    </div>
                </div>
                </div>

                <!-- Initiatives List -->
                 <div id="tutorialTable" ref="tableScrollEl" class="table-responsive d-none d-md-block" :class="{ 'has-hidden-columns': hasHiddenColumns }" @scroll="updateHiddenColumns">
                    <table class="table table-hover resizable-table">
                        <thead>
                            <tr>
                                <th scope="col" @click="sortBy('no')" class="th-sortable text-end" :style="{width: colWidths.no + 'px'}">No. <i :class="sortIcon('no')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('no', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('date')" class="th-sortable" :style="{width: colWidths.date + 'px'}">実施日 <i :class="sortIcon('date')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('date', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('company')" class="th-sortable" :style="{width: colWidths.company + 'px'}">社 <i :class="sortIcon('company')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('company', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('section')" class="th-sortable" :style="{width: colWidths.section + 'px'}">課 <i :class="sortIcon('section')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('section', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('name')" class="th-sortable" :style="{width: colWidths.name + 'px'}">氏名 <i :class="sortIcon('name')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('name', $event)" @click.stop></span></th>
                                <th scope="col" @click="sortBy('title')" class="th-sortable" :style="{width: colWidths.title + 'px'}">タイトル <i :class="sortIcon('title')"></i><span class="col-resizer" @mousedown.stop.prevent="startResize('title', $event)" @click.stop></span></th>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';

        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {

        // ログイン画面はID入力欄を持たず、共有のパスワードのみで認証する（ユーザーごとの

        // ローカル開発時は Firebase Emulator に接続。

        const { createApp, ref, reactive, computed, onMounted, watch, provide, inject, onBeforeUnmount, nextTick, toRefs } = Vue;

        const DEFAULT_CATEGORIES = ['粗利率改善', '固定費コントロール', '粗利額アップ'];

        // 新規登録時の氏名・社・課の初期値として、このブラウザで最後に登録した内容を

        // コメント投稿者の氏名も、直近入力した内容をこのブラウザに記憶しておく

        const loadLastCommentName = () => {

        const saveLastCommentName = (name) => {

        // 共有ログインのためユーザーごとの区別が無く、「誰が押したか」はこのブラウザ固有の

        // 実績に付けられるリアクションの絵文字一覧

            { key: 'good', emoji: '👍', label: 'いいね' },

            { key: 'surprised', emoji: '😲', label: 'びっくり' },

        ];

        // --- 初回チュートリアル ---
        const TUTORIAL_SEEN_KEY = 'gyoseki-up:tutorialSeen';
        const TUTORIAL_STEPS = [
            { title: 'ようこそ', description: '業績アップ取り組みダッシュボードの基本的な使い方をご案内します。実際の画面を操作しながら進めましょう。', placement: 'center' },
            { selector: '#searchFilters', title: '検索条件で絞り込み', description: '氏名・社・課・分類や期間を指定して、一覧に表示する実績を絞り込めます。', placement: 'bottom' },
            { selector: '#tutorialAddBtn', title: '新しい実績を登録', description: 'ハイライトされた「新規登録」ボタンをクリックして、登録フォームを開いてみましょう。', placement: 'bottom', action: 'click' },
            { selector: '#formName', title: '氏名を入力', description: '実績を登録する担当者の氏名を入力します。登録済みの氏名を入力すると、社・課が自動的に補完されます。', placement: 'bottom' },
            { selector: '#formCompany', title: '社を選択', description: '担当者が所属する社を選択します。', placement: 'bottom' },
            { selector: '#formSection', title: '課を選択', description: '担当者が所属する課を選択します。選択した社に応じて候補が絞り込まれます。', placement: 'bottom' },
            { selector: '#formTitle', title: 'タイトルを入力', description: '取り組みの内容が一目でわかる、簡潔なタイトルを入力します。', placement: 'bottom' },
            { selector: '#formDate', title: '実施日を選択', description: '取り組みを実施した日付を選択します。', placement: 'bottom' },
            { selector: '#formCategory', title: '分類を選択', description: '取り組みの分類を選択します。', placement: 'bottom' },
            { selector: '#formContent', title: '具体的な内容を入力', description: '取り組みの具体的な内容を記入します。', placement: 'top' },
            { selector: '#formActualAmount', title: '実績金額を入力', description: '取り組みによる実績金額を円単位で入力します。数字を入力すると自動的に桁区切りで表示されます。', placement: 'top' },
            { selector: '#tutorialCancelBtn', title: '登録・キャンセル', description: '入力が終わったら「登録する」で保存できます。ここでは説明のため、ハイライトされた「キャンセル」をクリックしてフォームを閉じてみましょう。', placement: 'top', action: 'click' },
            { selector: ['#tutorialTable', '#tutorialCardList'], title: '実績一覧テーブル', description: '登録した実績が一覧表示されます。列見出しをクリックすると並び替え、見出しの境界線をドラッグすると列幅を調整できます。', placement: 'top' },
            { title: 'チュートリアルは以上です', description: '基本的な使い方のご案内は以上です。この内容はメニューの「チュートリアル」からいつでも見返せます。', placement: 'center' },
        ];

        // 対象要素が見つかる（かつ表示されている）まで一定時間ポーリングする。
        // モーダル表示などVueの再描画完了を待つ用途と、スマホ幅で非表示の要素を
        // スキップする判定を兼ねる。
        // selector は単一のCSSセレクタのほか、候補の配列も受け付ける
        // （例: デスクトップ表とスマホ用カード一覧のように、画面幅に応じて
        // どちらか一方だけが表示される要素を1つのステップで扱う場合に使う）。
        const waitForElement = (selector, { timeout = 1200, interval = 60 } = {}) => new Promise(resolve => {
            const selectors = Array.isArray(selector) ? selector : [selector];
            const findVisible = () => {
                for (const s of selectors) {
                    const el = document.querySelector(s);
                    if (el && el.offsetParent !== null) return el;
                }
                return null;
            };
            const start = Date.now();
            const check = () => {
                const el = findVisible();
                if (el) {
                    resolve(el);
                } else if (Date.now() - start > timeout) {
                    resolve(null);
                } else {
                    setTimeout(check, interval);
                }
            };
            check();
        });

        // ハイライト対象の周囲だけを避けて画面を覆う4枚の暗幕の位置・サイズを計算する
        const computeTutorialMaskStyle = (rect) => {
            if (!rect) {
                return {
                    top: { top: '0', left: '0', width: '100vw', height: '100vh' },
                    bottom: { display: 'none' },
                    left: { display: 'none' },
                    right: { display: 'none' },
                };
            }
            const pad = 6;
            const top = Math.max(rect.top - pad, 0);
            const bottom = rect.bottom + pad;
            const left = Math.max(rect.left - pad, 0);
            const right = rect.right + pad;
            return {
                top: { top: '0px', left: '0px', width: '100vw', height: `${top}px` },
                bottom: { top: `${bottom}px`, left: '0px', width: '100vw', height: `${Math.max(window.innerHeight - bottom, 0)}px` },
                left: { top: `${top}px`, left: '0px', width: `${left}px`, height: `${Math.max(bottom - top, 0)}px` },
                right: { top: `${top}px`, left: `${right}px`, width: `${Math.max(window.innerWidth - right, 0)}px`, height: `${Math.max(bottom - top, 0)}px` },
            };
        };

        // 吹き出しをハイライト対象の上下どちらに出すか決め、画面外にはみ出さないよう調整する
        const computeTutorialPopoverStyle = (rect, placement, popoverEl) => {
            const margin = 14;
            const pw = popoverEl.offsetWidth;
            const ph = popoverEl.offsetHeight;
            let top, left;
            if (!rect) {
                top = window.innerHeight / 2 - ph / 2;
                left = window.innerWidth / 2 - pw / 2;
            } else {
                left = rect.left + rect.width / 2 - pw / 2;
                top = placement === 'top' ? rect.top - ph - margin : rect.bottom + margin;
                if (top < 8) top = rect.bottom + margin;
                if (top + ph > window.innerHeight - 8) top = rect.top - ph - margin;
            }
            left = Math.min(Math.max(left, 8), Math.max(window.innerWidth - pw - 8, 8));
            top = Math.min(Math.max(top, 8), Math.max(window.innerHeight - ph - 8, 8));
            return { top: `${top}px`, left: `${left}px` };
        };

        // --- Components ---
        const InitiativeList = {
            template: '#initiative-list-template',
            setup() {
                const root = inject('root');
                const filters = ref({ name: '', company: '', section: '', category: '' });
                const sortByColumn = ref('no');
                const sortDirection = ref('desc');

                const safeLower = v => (v ?? '').toString().toLowerCase();

                const filteredInitiatives = computed(() => {
                    return root.initiatives.value.filter(item => {
                        const nameMatch = safeLower(item.name).includes(safeLower(filters.value.name));
                        const companyMatch = safeLower(item.company).includes(safeLower(filters.value.company));
                        const sectionMatch = safeLower(item.section).includes(safeLower(filters.value.section));
                        const catMatch = filters.value.category ? item.category === filters.value.category : true;
                        return nameMatch && companyMatch && sectionMatch && catMatch;
                    });
                });

                const cmp = (a, b) => (a > b) - (a < b);
                const toKey = (val, col) => {
                    if (col === 'date') return new Date(val || 0).getTime();
                    if (typeof val === 'number') return val;
                    const num = Number(val);
                    return Number.isFinite(num) ? num : (val ?? '').toString();
                };

                const sortedInitiatives = computed(() => {
                    const col = sortByColumn.value;
                    const dir = sortDirection.value === 'asc' ? 1 : -1;
                    return [...filteredInitiatives.value].sort((a, b) =>
                        dir * cmp(toKey(a[col], col), toKey(b[col], col))
                    );
                });

                // --- ページング（50件ずつ） ---
                const pageSize = 50;
                const currentPage = ref(1);
                const totalPages = computed(() => Math.max(1, Math.ceil(sortedInitiatives.value.length / pageSize)));
                const paginatedInitiatives = computed(() => {
                    const start = (currentPage.value - 1) * pageSize;
                    return sortedInitiatives.value.slice(start, start + pageSize);
                });
                const goToPage = (p) => {
                    currentPage.value = Math.min(Math.max(1, p), totalPages.value);
                };
                // フィルタ・並び替え・データ更新のたびに1ページ目に戻す
                watch([filteredInitiatives, sortByColumn, sortDirection], () => {
                    currentPage.value = 1;
                });

                // 実施日は YYYY-MM-DD で保持し、表示のみスラッシュ区切りにする
                const formatDate = (value) => value ? value.replace(/-/g, '/') : '';

                // --- 列幅のドラッグ調整 ---
                const colWidths = ref({
                    no: 70, date: 110, company: 130, section: 130, name: 110, title: 180,
                    category: 130, content: 320, actualAmount: 130, engagement: 130
                });

                // 実施日・社・課は、表示されているデータの長さに合わせて列幅を自動計算する
                // （データが取得・更新されるたびに再計算し、ドラッグでの手動調整は次回更新まで保持する）。
                const measureCtx = document.createElement('canvas').getContext('2d');
                measureCtx.font = '16px "Noto Sans JP", "Inter", sans-serif';
                const measureTextWidth = (text) => measureCtx.measureText(text ?? '').width;
                const AUTO_FIT_COLUMNS = {
                    date: { label: '実施日', value: item => formatDate(item.date) },
                    company: { label: '社', value: item => item.company },
                    section: { label: '課', value: item => item.section },
                };
                const CELL_PADDING = 24; // セル左右のパディング分の余白
                const HEADER_EXTRA = 40; // ソートアイコン・リサイズハンドル分の余白
                const autoFitColumnWidths = () => {
                    Object.entries(AUTO_FIT_COLUMNS).forEach(([col, { label, value }]) => {
                        let maxWidth = measureTextWidth(label) + HEADER_EXTRA;
                        root.initiatives.value.forEach(item => {
                            const width = measureTextWidth(value(item)) + CELL_PADDING;
                            if (width > maxWidth) maxWidth = width;
                        });
                        colWidths.value[col] = Math.ceil(maxWidth);
                    });
                };
                watch(root.initiatives, autoFitColumnWidths, { immediate: true });

                let resizingCol = null;
                let resizeStartX = 0;
                let resizeStartWidth = 0;
                const onResizeMove = (event) => {
                    if (!resizingCol) return;
                    const delta = event.clientX - resizeStartX;
                    colWidths.value[resizingCol] = Math.max(60, resizeStartWidth + delta);
                };
                const onResizeEnd = () => {
                    resizingCol = null;
                    document.removeEventListener('mousemove', onResizeMove);
                    document.removeEventListener('mouseup', onResizeEnd);
                };
                const startResize = (col, event) => {
                    resizingCol = col;
                    resizeStartX = event.clientX;
                    resizeStartWidth = colWidths.value[col];
                    document.addEventListener('mousemove', onResizeMove);
                    document.addEventListener('mouseup', onResizeEnd);
                };
                onBeforeUnmount(() => {
                    document.removeEventListener('mousemove', onResizeMove);
                    document.removeEventListener('mouseup', onResizeEnd);
                });

                // リアクション・コメント列の下に隠れている列がある間だけ、固定列であることを示す影を出す
                const tableScrollEl = ref(null);
                const hasHiddenColumns = ref(false);
                const updateHiddenColumns = () => {
                    const el = tableScrollEl.value;
                    if (!el) return;
                    hasHiddenColumns.value = (el.scrollWidth - el.clientWidth - el.scrollLeft) > 1;
                };
                onMounted(() => {
                    updateHiddenColumns();
                    window.addEventListener('resize', updateHiddenColumns);
                });
                onBeforeUnmount(() => {
                    window.removeEventListener('resize', updateHiddenColumns);
                });
                watch([root.initiatives, colWidths], () => nextTick(updateHiddenColumns), { deep: true });

                // --- 取り組み実績 追加/編集モーダル ---
                const formModalMode = ref(null); // null | 'add' | 'edit'
                const formModalId = ref(null);
                const defaultFormInitiative = () => {
                    const last = loadLastEntry();
                    return {
                        name: last?.name || '',
                        company: last?.company || '',
                        section: last?.section || '',
                        title: '',
                        date: new Date().toISOString().slice(0, 10),
                        category: root.categories.value[0]?.name || '',
                        content: '',
                        actualAmount: null,
                    };
                };
                const formInitiative = ref(defaultFormInitiative());
                const actualAmountInput = ref('');

                // 氏名が氏名マスタの登録内容と一致する場合のみ、所属する課・社を自動的に
                // 補完する（氏名は自由入力のため、一致しない場合は社・課を手動で選ぶ）。
                const resolveFormCompanySection = (name) => {
                    const person = root.names.value.find(n => n.name === name);
                    if (!person) return;
                    const section = root.sections.value.find(s => s.id === person.sectionId);
                    const company = section ? root.companies.value.find(co => co.id === section.companyId) : null;
                    formInitiative.value.company = company ? company.name : '';
                    formInitiative.value.section = section ? section.name : '';
                };
                // 選択した社に属する課だけを一覧する（課セレクトの絞り込みに使う）
                const sectionsOfCompanyName = (companyName) => {
                    const company = root.companies.value.find(co => co.name === companyName);
                    return company ? root.sections.value.filter(s => s.companyId === company.id) : [];
                };
                const onFormCompanyChange = () => {
                    const firstSection = sectionsOfCompanyName(formInitiative.value.company)[0];
                    formInitiative.value.section = firstSection ? firstSection.name : '';
                };

                // clearable-input はラップした<input>の@inputを内部の$emitより先に発火させるため、
                // ref経由(inputRef.value)で値を読むと1文字分古い値を参照してしまい、
                // 桁区切り再フォーマット時にカーソル位置がずれて数字が壊れる（例: 480000→4,8000）。
                // event.target を直接読み書きすることでこのズレを避け、カーソル位置も桁数基準で復元する。
                // 全角数字（IME入力時など）を半角に変換してから桁のみを残す
                const toHalfWidthDigits = (str) => str.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));

                const makeAmountBinding = (field, inputRef) => (event) => {
                    const target = event.target;
                    const rawValue = toHalfWidthDigits(target.value);
                    const cursor = target.selectionStart ?? rawValue.length;
                    const digitsBeforeCursor = rawValue.slice(0, cursor).replace(/\D/g, '').length;

                    const numeric = rawValue.replace(/\D/g, '');
                    const val = numeric ? parseInt(numeric, 10) : null;
                    formInitiative.value[field] = val;

                    const formatted = val != null ? root.formatCurrency(val) : '';
                    target.value = formatted;
                    inputRef.value = formatted;

                    let newCursor = 0;
                    if (digitsBeforeCursor > 0) {
                        let seen = 0;
                        for (let i = 0; i < formatted.length; i++) {
                            if (/\d/.test(formatted[i])) seen++;
                            newCursor = i + 1;
                            if (seen === digitsBeforeCursor) break;
                        }
                    }
                    target.setSelectionRange(newCursor, newCursor);
                };
                const handleActualAmountInput = makeAmountBinding('actualAmount', actualAmountInput);

                // モーダルを開くたびに金額表示欄を現在値に合わせて明示的に同期する

                const syncAmountInputs = () => {

                };

                // --- コメント・リアクション（編集モーダル内のセクション） ---
                const commentName = ref('');

                const commentsFor = (initiativeId) => root.comments.value
                    .filter(c => c.initiativeId === initiativeId)

                const commentCount = (initiativeId) => root.comments.value
                    .filter(c => c.initiativeId === initiativeId).length;

                const reactionSummary = (initiativeId) => {
                    const clientId = getClientId();
                    return REACTION_TYPES.map(rt => {
                        const matching = root.reactions.value.filter(r => r.initiativeId === initiativeId && r.type === rt.key);
                        return {
                            ...rt,
                            count: matching.length,
                            active: matching.some(r => r.clientId === clientId),

                };

                const formatDateTime = (ts) => {
                    if (!ts) return '';
                    const date = ts.toDate ? ts.toDate() : new Date(ts);
                    return date.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                };

                // コメント投稿者ごとにアバターの色を変え、誰の発言か見分けやすくする
                const AVATAR_COLORS = ['#0d6efd', '#6610f2', '#d63384', '#fd7e14', '#198754', '#20c997', '#0dcaf0'];
                const avatarColor = (name) => {
                    const str = name || '';
                    let hash = 0;
                    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
                    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
                };

                // コメント欄はテキストエリアにして改行できるようにし、入力量に応じて自動で高さを伸ばす
                // （送信後や編集終了時は高さをリセットする必要があるため、要素をrefで保持しておく）
                const commentTextareaEl = ref(null);

                // --- リアクション選択ポップアップ ---

                // 対象の実績ID（reactionPickerTargetId）だけを切り替える。
                const reactionPickerTargetId = ref(null);
                const reactionPickerPos = ref({ top: 0, left: 0 });
                const reactionPickerOpensUpward = ref(false);
                // ポップアップの想定幅（絵文字5個分）。固定列など画面右端に近いボタンから開いた場合に
                // 画面外へはみ出さないよう、右端に収まるよう左位置を調整するのに使う。
                // ポップアップの想定サイズ。画面端に近いボタンから開いた場合でも
                // 画面外にはみ出さないよう、位置を計算する際の目安として使う。
                const REACTION_PICKER_WIDTH = 220;
                const REACTION_PICKER_HEIGHT = 52;
                const openReactionPicker = (event, targetId) => {
                    if (reactionPickerTargetId.value === targetId) {
                        reactionPickerTargetId.value = null;
                        return;
                    }
                    const rect = event.currentTarget.getBoundingClientRect();
                    // 一覧のリアクション列は画面右端に固定されているため、ボタンの右端を基準に
                    // 左側へ吹き出しを開く（右端基準にすることで、右に開いて画面外にはみ出すのを防ぐ）。
                    const maxLeft = window.innerWidth - REACTION_PICKER_WIDTH - 8;
                    const left = Math.max(8, Math.min(rect.right - REACTION_PICKER_WIDTH, maxLeft));

                    let top = rect.bottom + 4;
                    let openUpward = false;
                    if (top + REACTION_PICKER_HEIGHT > window.innerHeight - 8) {
                        // 下に開くと画面外に出てしまう場合はボタンの上に開く
                        top = rect.top - REACTION_PICKER_HEIGHT - 4;
                        openUpward = true;
                    }
                    top = Math.max(8, top);

                    reactionPickerPos.value = { top, left };
                    reactionPickerOpensUpward.value = openUpward;
                    reactionPickerTargetId.value = targetId;

                const cancelCommentEdit = () => {
                    editingCommentId.value = null;

                const saveCommentEdit = async () => {
                    const name = editCommentName.value.trim();
                    const text = editCommentText.value.trim();
                    if (!name || !text || !editingCommentId.value) return;

                const removeComment = async (commentId) => {
                    if (!confirm('このコメントを削除しますか？')) return;
                    await root.deleteComment(commentId);
                };

                const sortBy = (column) => {
                    if (sortByColumn.value === column) {
                        sortDirection.value = sortDirection.value === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortByColumn.value = column;
                        sortDirection.value = 'desc';
                    }
                };

                const sortIcon = (column) => {
                    if (sortByColumn.value !== column) return 'bi bi-arrow-down-up';
                    return sortDirection.value === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
                };

                const resetFilters = () => {
                    filters.value = { name: '', company: '', section: '', category: '' };
                };

                const exportCsv = () => {
                    const headers = ['No.', '実施日', '社', '課', '氏名', 'タイトル', '分類', '内容', '実績金額'];
                    const rows = sortedInitiatives.value.map(item => [
                        item.no,
                        formatDate(item.date),
                        item.company,
                        item.section,
                        item.name,
                        item.title,
                        item.category,
                        item.content,
                        item.actualAmount
                    ]);
                    const csvContent = [headers, ...rows]
                        .map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                        .join('\r\n');
                    const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'initiatives.csv';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                };

                return {

                    sortBy,
                    sortIcon,

                    paginatedInitiatives,
                    pageSize,
                    currentPage,
                    totalPages,

        };

        // --- Router ---

                            comments.value = await loadCollection('comments');
                        } catch (error) {
                            console.error('Error fetching comments:', error);
                        }
                    });
                };

                const fetchReactions = async () => {
                    await withLoading(async () => {
                        try {
                            reactions.value = await loadCollection('reactions');
                        } catch (error) {
                            console.error('Error fetching reactions:', error);
                        }
                    });
                };

                const updateDefaultPeriod = async (start, end) => {
                    await withLoading(async () => {
                        try {
                            await setDoc(SETTINGS_REF(), { default_start: start || '', default_end: end || '' }, { merge: true });
                            defaultStart.value = start;
                            defaultEnd.value = end;
                            filterStart.value = start;
                            filterEnd.value = end;
                        } catch (error) {
                            console.error('Error updating default period:', error);
                        }
                    });
                };

                const updateCategoryGoals = async (goals) => {
                    await withLoading(async () => {
                        try {
                            const clean = {};
                            Object.entries(goals || {}).forEach(([k, v]) => {
                                clean[k] = Number(v) || 0;
                            });
                            await setDoc(SETTINGS_REF(), { category_goals: clean }, { merge: true });
                            categoryGoals.value = clean;
                        } catch (error) {
                            console.error('Error updating category goals:', error);
                        }
                    });
                };

                const pickInitiative = (data) => ({
                    name: data.name,
                    company: data.company,
                    section: data.section,
                    title: data.title,
                    date: data.date,
                    category: data.category,
                    content: data.content,
                    actualAmount: parseInt(data.actualAmount, 10) || 0,
                });

                // 実績の管理番号を採番する。counters/initiatives の値をトランザクションで
                // 読み取り→+1→書き戻しすることで、同時登録が重なっても番号が重複しない。
                const nextInitiativeNo = async () => {
                    const counterRef = doc(db, 'counters', 'initiatives');
                    return await runTransaction(db, async (tx) => {
                        const snap = await tx.get(counterRef);
                        const next = (snap.exists() ? (snap.data().value || 0) : 0) + 1;
                        tx.set(counterRef, { value: next });
                        return next;
                    });
                };

                const submitInitiative = async (newInitiative) => {
                    await withLoading(async () => {
                        try {
                            const no = await nextInitiativeNo();
                            await addDoc(colRef('initiatives'), {
                                ...pickInitiative(newInitiative),
                                no,
                                createdAt: serverTimestamp(),
                            });
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error submitting initiative:', error);
                        }
                    });
                };

                const updateInitiative = async (id, updated) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, 'initiatives', id), pickInitiative(updated));
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error updating initiative:', error);
                        }
                    });
                };

                const deleteInitiative = async (id) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, 'initiatives', id));
                            await fetchInitiatives();
                        } catch (error) {
                            console.error('Error deleting initiative:', error);
                        }
                    });
                };

                // --- コメント・リアクション ---
                const addComment = async (initiativeId, name, text) => {
                    await withLoading(async () => {
                        try {
                            await addDoc(colRef('comments'), {
                                initiativeId, name, text, createdAt: serverTimestamp(),
                            });
                            await fetchComments();
                        } catch (error) {
                            console.error('Error adding comment:', error);
                        }
                    });
                };

                const updateComment = async (commentId, name, text) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, 'comments', commentId), { name, text });
                            await fetchComments();
                        } catch (error) {
                            console.error('Error updating comment:', error);
                        }
                    });
                };

                const deleteComment = async (commentId) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, 'comments', commentId));
                            await fetchComments();
                        } catch (error) {
                            console.error('Error deleting comment:', error);
                        }
                    });
                };

                // 共有ログインのためリアクションはこのブラウザ固有のIDと紐づける。
                // ドキュメントIDを実績ID・種類・端末IDの組み合わせにすることで、
                // 同じ端末から同じ種類を二重に押せないようにし、再度押すと解除できるようにする。
                const toggleReaction = async (initiativeId, type) => {
                    await withLoading(async () => {
                        try {
                            const clientId = getClientId();
                            const reactionId = `${initiativeId}_${type}_${clientId}`;
                            const exists = reactions.value.some(r => r.id === reactionId);
                            if (exists) {
                                await deleteDoc(doc(db, 'reactions', reactionId));
                            } else {
                                await setDoc(doc(db, 'reactions', reactionId), {
                                    initiativeId, type, clientId, createdAt: serverTimestamp(),
                                });
                            }
                            await fetchReactions();
                        } catch (error) {
                            console.error('Error toggling reaction:', error);
                        }
                    });
                };

                // --- マスタ (社・課・氏名・分類) 共通処理 ---
                // scopeKey を指定すると、その項目が同じ場合のみ name の重複とみなす
                // （例: 課は同じ社の中でのみ重複禁止、氏名は同じ課の中でのみ重複禁止）。
                const addMasterItem = async (colName, data, listRef, refetch, scopeKey) => {
                    await withLoading(async () => {
                        try {
                            const dup = listRef.value.some(item =>
                                item.name === data.name && (!scopeKey || item[scopeKey] === data[scopeKey])
                            );
                            if (dup) {
                                alert('既に登録されています: ' + data.name);
                                return;
                            }
                            await addDoc(colRef(colName), data);
                            await refetch();
                        } catch (error) {
                            console.error(`Error adding to ${colName}:`, error);
                        }
                    });
                };

                const updateMasterItem = async (colName, id, data, refetch) => {
                    await withLoading(async () => {
                        try {
                            await updateDoc(doc(db, colName, id), data);
                            await refetch();
                        } catch (error) {
                            console.error(`Error updating ${colName}:`, error);
                        }
                    });
                };

                const deleteMasterItem = async (colName, id, refetch) => {
                    await withLoading(async () => {
                        try {
                            await deleteDoc(doc(db, colName, id));
                            await refetch();
                        } catch (error) {
                            console.error(`Error deleting from ${colName}:`, error);
                        }
                    });
                };

                const addCompany = (name) => addMasterItem('companies', { name }, companies, fetchCompanies);
                const updateCompany = (id, name) => updateMasterItem('companies', id, { name }, fetchCompanies);
                const deleteCompany = (id) => {
                    if (sections.value.some(s => s.companyId === id)) {
                        alert('この社に属する課が存在するため削除できません。先に課を削除してください。');
                        return;
                    }
                    return deleteMasterItem('companies', id, fetchCompanies);
                };

                const addSection = (name, companyId) => addMasterItem('sections', { name, companyId }, sections, fetchSections, 'companyId');
                const updateSection = (id, name, companyId) => updateMasterItem('sections', id, { name, companyId }, fetchSections);
                const deleteSection = (id) => {
                    if (names.value.some(n => n.sectionId === id)) {
                        alert('この課に属する氏名が存在するため削除できません。先に氏名を削除するか、別の課に変更してください。');
                        return;
                    }
                    return deleteMasterItem('sections', id, fetchSections);
                };

                const addName = (name, sectionId) => withLoading(async () => {
                    try {
                        if (names.value.some(n => n.name === name && n.sectionId === sectionId)) {
                            return { ok: false, message: '既に登録されています: ' + name };
                        }
                        await addDoc(colRef('names'), { name, sectionId });
                        await fetchNames();
                        return { ok: true };
                    } catch (error) {
                        console.error('Error adding name:', error);
                        return { ok: false, message: '追加に失敗しました。' };
                    }
                });
                const updateName = (id, name, sectionId) => updateMasterItem('names', id, { name, sectionId }, fetchNames);
                const deleteName = (id) => deleteMasterItem('names', id, fetchNames);

                const addCategory = (name) => addMasterItem('categories', { name }, categories, fetchCategories);
                const updateCategory = (id, name) => updateMasterItem('categories', id, { name }, fetchCategories);
                const deleteCategory = (id) => deleteMasterItem('categories', id, fetchCategories);

                const importNames = async (file, sectionId) => {
                    await withLoading(async () => {
                        try {
                            const text = (await file.text()).replace(/^﻿/, '');
                            // 同じ課の中でのみ重複とみなす
                            const existing = new Set(
                                names.value.filter(n => n.sectionId === sectionId).map(n => n.name)
                            );
                            const toAdd = [];
                            text.split(/\r?\n/).forEach(line => {
                                if (!line.trim()) return;
                                let name = line.split(',')[0].trim();
                                name = name.replace(/^"(.*)"$/, '$1').trim();
                                if (name && !existing.has(name)) {
                                    existing.add(name);
                                    toAdd.push(name);
                                }
                            });
                            // Firestore のバッチ書き込みは1回500件まで
                            for (let i = 0; i < toAdd.length; i += 450) {
                                const batch = writeBatch(db);
                                toAdd.slice(i, i + 450).forEach(name => {
                                    batch.set(doc(colRef('names')), { name, sectionId });
                                });
                                await batch.commit();
                            }
                            await fetchNames();
                        } catch (error) {
                            console.error('Error importing names:', error);
                        }
                    });
                };

                const formatCurrency = (value) => new Intl.NumberFormat('ja-JP').format(value);

                const getCategoryClass = (category) => {
                    switch (category) {
                        case '粗利率改善': return 'bg-warning text-dark';
                        case '固定費コントロール': return 'bg-danger';
                        case '粗利額アップ': return 'bg-success';
                        default: return 'bg-secondary';
                    }
                };

                const hideOffcanvas = () => {
                    const el = document.getElementById('offcanvasNav');
                    if (!el) return;
                    let instance = bootstrap.Offcanvas.getInstance(el);
                    if (!instance) instance = new bootstrap.Offcanvas(el);
                    instance.hide();
                };

                // --- 初回チュートリアル ---
                const tutorial = reactive({
                    active: false,
                    stepIndex: 0,
                    hasTarget: false,
                    highlightStyle: {},
                    maskStyle: computeTutorialMaskStyle(null),
                    popoverStyle: {},
                });
                const tutorialPopoverRef = ref(null);
                const tutorialCurrentStep = computed(() => TUTORIAL_STEPS[tutorial.stepIndex] || {});
                const tutorialIsLast = computed(() => tutorial.stepIndex === TUTORIAL_STEPS.length - 1);
                let tutorialActionCleanup = null;
                const clearTutorialAction = () => {
                    if (tutorialActionCleanup) {
                        tutorialActionCleanup();
                        tutorialActionCleanup = null;
                    }
                };
                const onTutorialReflow = () => {
                    if (tutorial.active) renderTutorialStep();
                };
                const endTutorial = () => {
                    clearTutorialAction();
                    tutorial.active = false;
                    window.removeEventListener('resize', onTutorialReflow);
                    window.removeEventListener('scroll', onTutorialReflow, true);
                    try { localStorage.setItem(TUTORIAL_SEEN_KEY, '1'); } catch (e) { /* 無視 */ }
                };
                const renderTutorialStep = async () => {
                    const step = TUTORIAL_STEPS[tutorial.stepIndex];
                    let el = null;
                    if (step.selector) {
                        el = await waitForElement(step.selector);
                        if (!tutorial.active) return; // 待機中にスキップ/終了された
                        if (!el) {
                            goToTutorialStep(tutorial.stepIndex + 1);
                            return;
                        }
                        el.scrollIntoView({ block: 'center', behavior: 'auto' });
                        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    }
                    const rect = el ? el.getBoundingClientRect() : null;
                    tutorial.hasTarget = !!rect;
                    if (rect) {
                        const pad = 6;
                        tutorial.highlightStyle = {
                            top: `${rect.top - pad}px`,
                            left: `${rect.left - pad}px`,
                            width: `${rect.width + pad * 2}px`,
                            height: `${rect.height + pad * 2}px`,
                        };
                    }
                    tutorial.maskStyle = computeTutorialMaskStyle(rect);
                    await nextTick();
                    if (tutorialPopoverRef.value) {
                        tutorial.popoverStyle = computeTutorialPopoverStyle(rect, step.placement, tutorialPopoverRef.value);
                    }
                    clearTutorialAction();
                    if (step.action === 'click' && el) {
                        const handler = () => goToTutorialStep(tutorial.stepIndex + 1);
                        el.addEventListener('click', handler, { once: true });
                        tutorialActionCleanup = () => el.removeEventListener('click', handler);
                    }
                };
                const goToTutorialStep = (index) => {
                    if (index >= TUTORIAL_STEPS.length) {
                        endTutorial();
                        return;
                    }
                    tutorial.stepIndex = index;
                    renderTutorialStep();
                };
                const startTutorial = async () => {
                    if (router.currentRoute.value.path !== '/') {
                        await router.push('/');
                        await nextTick();
                    }
                    tutorial.active = true;
                    tutorial.stepIndex = 0;
                    window.addEventListener('resize', onTutorialReflow);
                    window.addEventListener('scroll', onTutorialReflow, true);
                    await nextTick();
                    renderTutorialStep();
                };
                const skipTutorial = () => endTutorial();
                const nextTutorialStep = () => goToTutorialStep(tutorial.stepIndex + 1);
                const replayTutorial = () => {
                    const el = document.getElementById('offcanvasNav');
                    if (el) {
                        el.addEventListener('hidden.bs.offcanvas', () => startTutorial(), { once: true });
                    }
                    hideOffcanvas();
                    if (!el) startTutorial();
                };

                // --- Auth ---
                const login = async () => {
                    authError.value = '';
                    if (!loginPassword.value) return;
                    try {
                        await signInWithEmailAndPassword(auth, APP_LOGIN_EMAIL, loginPassword.value);
                        loginPassword.value = '';
                    } catch (error) {
                        console.error('Login error:', error);
                        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                            authError.value = 'パスワードが正しくありません。';
                        } else {
                            authError.value = 'ログインに失敗しました: ' + (error.message || error.code || error);
                        }
                    }
                };

                const logout = async () => {
                    await signOut(auth);
                };

                onAuthStateChanged(auth, async (u) => {
                    user.value = u;
                    authReady.value = true;
                    if (u) {
                        await fetchBootstrap();
                        try {
                            if (!localStorage.getItem(TUTORIAL_SEEN_KEY)) {
                                setTimeout(() => startTutorial(), 400);
                            }
                        } catch (e) { /* 無視 */ }
                    } else {
                        initiatives.value = [];
                        companies.value = [];
                        sections.value = [];
                        names.value = [];
                        categories.value = [];
                        comments.value = [];
                        reactions.value = [];
                    }
                });

                // Provide shared state and methods to all components
                  provide('root', {
                      initiatives,
                      companies,
                      sections,
                      names,
                      categories,
                      comments,
                      reactions,
                      categoryGoals,
                      defaultStart,
                      defaultEnd,
                      filterStart,
                      filterEnd,
                      fetchInitiatives,
                      submitInitiative,
                      updateInitiative,
                      deleteInitiative,
                      fetchCompanies,
                      fetchSections,
                      fetchNames,
                      fetchCategories,
                      fetchComments,
                      fetchReactions,
                      addComment,
                      updateComment,
                      deleteComment,
                      toggleReaction,
                      addCompany,
                      addSection,
                      addName,
                      importNames,
                      addCategory,
                      updateCompany,
                      deleteCompany,
                      updateSection,
                      deleteSection,
                      updateName,
                      deleteName,
                      updateCategory,
                      deleteCategory,
                      updateDefaultPeriod,
                      updateCategoryGoals,
                      formatCurrency,
                      getCategoryClass,
                      isLoading
                  });

                  return {
                      initiatives, hideOffcanvas, isLoading, filterStart, filterEnd, fetchInitiatives,
                      user, authReady, authError, loginPassword, login, logout,
                      tutorial, tutorialCurrentStep, tutorialIsLast, tutorialPopoverRef,
                      TUTORIAL_STEPS, skipTutorial, nextTutorialStep, replayTutorial
                  };
            }
        });

        app.component('tom-select', {
            inheritAttrs: false,
            props: {
                modelValue: String,
                options: Array
            },
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const selectRef = ref(null);
                let ts;

                const updateOptions = (opts = []) => {
                    if (ts) {
                        ts.clearOptions();
                        ts.addOptions(opts.map(o => ({ value: o, text: o })));
                        ts.refreshOptions(false);
                    }
                };

                onMounted(() => {
                    ts = new TomSelect(selectRef.value, {
                        create: true,
                        plugins: ['clear_button'],
                        placeholder: attrs.placeholder || '',
                        onChange(value) {
                            emit('update:modelValue', value);
                        }
                    });
                    updateOptions(props.options);
                    if (props.modelValue) {
                        ts.setValue(props.modelValue);
                    }
                });

                watch(() => props.options, (opts) => {
                    updateOptions(opts);
                }, { deep: true });

                watch(() => props.modelValue, (val) => {
                    if (ts && ts.getValue() !== val) {
                        ts.setValue(val || '');
                    }
                });

                onBeforeUnmount(() => {
                    if (ts) ts.destroy();
                });

                return { selectRef, attrs };
            },
            template: `<select ref="selectRef" v-bind="attrs"></select>`
        });

        app.component('clearable-input', {
            inheritAttrs: false,
            props: ['modelValue'],
            emits: ['update:modelValue'],
            setup(props, { emit, attrs }) {
                const inputClass = computed(() => [attrs.class, 'pe-4'].filter(Boolean).join(' '));
                const clear = () => emit('update:modelValue', '');
                return { attrs, inputClass, clear };
            },
            template: `
                <div class="position-relative">
                    <input v-bind="attrs" :class="inputClass" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)">
                    <button v-if="modelValue" type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" aria-label="Clear" @click="clear"></button>
                </div>
            `
        });

        app.component('date-filter', {
            template: '#date-filter-template',
            props: {
                startCol: { type: Number, default: 3 },
                endCol: { type: Number, default: 3 },
                buttonCol: { type: Number, default: 3 }
            },
            setup(props, { emit }) {
                const root = inject('root');
                const { startCol, endCol, buttonCol } = toRefs(props);
                const reset = () => {
                    root.filterStart.value = '';
                    root.filterEnd.value = '';
                    root.fetchInitiatives();
                    emit('reset');
                };
                return { root, reset, startCol, endCol, buttonCol };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
